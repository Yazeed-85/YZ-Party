<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YZ Party</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
<button id="mute" class="fab" aria-label="كتم الصوت">🔊</button>
<main>
  <section id="home" class="screen glass">
    <h1 class="mark">YZ Party</h1>
    <p class="sub">ألعاب لشخصين أو أكثر، كل لاعب على هاتفه</p>
    <input id="name" maxlength="16" placeholder="اسمك" autocomplete="off">
    <button id="create" class="btn primary">أنشئ غرفة</button>
    <div class="or">أو انضم بكود الغرفة</div>
    <div class="row"><input id="code" class="codein" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off"><button id="join" class="btn">انضم</button></div>
  </section>

  <section id="lobby" class="screen" hidden>
    <div class="glass pad codewrap">
      <span class="lbl">كود الغرفة</span>
      <div id="tiles" class="tiles"></div>
      <button id="copy" class="btn ghost">انسخ رابط الدعوة</button>
    </div>
    <div class="glass pad"><h2>اللاعبون</h2><ul id="players"></ul></div>
    <div class="glass pad"><h2>الألعاب</h2><div id="games" class="games"></div><p id="hint" class="hint"></p></div>
    <div class="bar"><button id="start" class="btn primary">ابدأ اللعبة</button><button id="leave" class="btn ghost">غادر</button></div>
  </section>
</main>

<script type="module">
import { ready } from './shared/firebase.js';
import { createRoom, joinRoom, enterRoom, watchRoom, pickGame, startGame, leaveRoom, getCode, savedName, saveName, cleanName } from './shared/room.js';
import { GAMES } from './shared/games-registry.js';
import { toast, sfx, show, enterAnim, toggleMute, isMuted } from './shared/ui.js';

const $ = s => document.querySelector(s);
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
let S = { code: null, uid: null, meta: null, players: {}, scores: {} }, stop = null;

function render() {
  const { meta, code, uid, players, scores } = S;
  if (!meta) return;
  $('#tiles').replaceChildren(...[...code].map(d => h('b', 'tile', d)));
  $('#players').replaceChildren(...Object.entries(players).sort((a, b) => a[1].joinedAt - b[1].joinedAt).map(([id, p]) => {
    const li = h('li', 'pl');
    li.append(h('i', 'dot' + (p.connected === false ? ' off' : '')), h('span', 'nm', p.name + (id === uid ? ' (أنت)' : '')));
    if (id === meta.host) li.append(h('span', 'crown', 'المضيف'));
    li.append(h('span', 'pts', scores[id] || 0));
    return li;
  }));
  const isHost = meta.host === uid, n = Object.keys(players).length;
  $('#games').replaceChildren(...GAMES.map(x => {
    const b = h('button', 'gcard' + (meta.pick === x.id ? ' on' : ''));
    b.disabled = !isHost || !x.ready;
    b.append(h('span', 'gi', x.icon), h('strong', '', x.name), h('small', '', x.ready ? x.desc : 'قريباً'));
    b.onclick = () => { sfx.click(); pickGame(code, x.id).catch(e => toast(e.message, 'error')); };
    return b;
  }));
  const pick = GAMES.find(x => x.id === meta.pick), ok = pick && n >= pick.min && n <= pick.max;
  $('#start').hidden = !isHost; $('#start').disabled = !ok;
  $('#hint').textContent = !isHost ? 'بانتظار المضيف ليختار اللعبة'
    : !GAMES.some(x => x.ready) ? 'الألعاب تُضاف تباعاً ولا توجد لعبة جاهزة بعد'
    : !pick ? 'اختر لعبة للبدء'
    : ok ? '' : `هذه اللعبة تحتاج ${pick.min === pick.max ? pick.min : pick.min + ' إلى ' + pick.max} لاعبين`;
}

function closed(msg) {
  stop?.(); sessionStorage.removeItem('yz_room');
  history.replaceState(null, '', location.pathname);
  toast(msg); show('home');
}

async function openLobby(code) {
  const u = await ready;
  stop?.();
  S = { code, uid: u.uid, meta: null, players: {}, scores: {} };
  show('lobby');
  stop = watchRoom(code, {
    meta: m => {
      if (!m || m.status === 'closed') return closed('أُغلقت الغرفة');
      if (m.status === 'playing' && m.game) { location.href = `games/${m.game}/index.html?room=${code}`; return; }
      S.meta = m; render();
    },
    players: p => { S.players = p || {}; render(); },
    scores: s => { S.scores = s || {}; render(); }
  });
}

async function go(fn) {
  const name = cleanName($('#name').value);
  if (!name) { sfx.error(); return toast('اكتب اسمك أولاً', 'error'); }
  saveName(name);
  try { sfx.click(); openLobby(await fn(name)); } catch (e) { sfx.error(); toast(e.message, 'error'); }
}

$('#create').onclick = () => go(n => createRoom(n));
$('#join').onclick = () => go(n => {
  const c = $('#code').value.trim();
  if (!/^\d{4}$/.test(c)) throw new Error('الكود مكوّن من 4 أرقام');
  return joinRoom(c, n);
});
$('#start').onclick = () => startGame(S.code, S.meta.pick).catch(e => toast(e.message, 'error'));
$('#leave').onclick = async () => { await leaveRoom(S.code); closed('غادرت الغرفة'); };
$('#copy').onclick = () => navigator.clipboard?.writeText(`${location.origin}${location.pathname}?join=${S.code}`).then(() => toast('نُسخ الرابط'));
$('#mute').onclick = () => { $('#mute').textContent = toggleMute() ? '🔇' : '🔊'; };

$('#mute').textContent = isMuted() ? '🔇' : '🔊';
$('#name').value = savedName();
const jp = new URLSearchParams(location.search).get('join');
if (jp) $('#code').value = jp.slice(0, 4);
enterAnim('#home');
if (getCode()) enterRoom().then(c => openLobby(c.code)).catch(() => sessionStorage.removeItem('yz_room'));
</script>
</body>
</html>
