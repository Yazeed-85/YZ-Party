<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141b36"/><stop offset="1" stop-color="#090c18"/></linearGradient>
<radialGradient id="felt" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#1c6f6a"/><stop offset=".6" stop-color="#124a4d"/><stop offset="1" stop-color="#0b2f35"/></radialGradient>
<radialGradient id="heart" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ffc2cb"/><stop offset=".55" stop-color="#ff6b81"/><stop offset="1" stop-color="#c0304f"/></radialGradient>
<radialGradient id="glowA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb454" stop-opacity=".4"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></radialGradient>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5a34"/><stop offset=".5" stop-color="#4a2c17"/><stop offset="1" stop-color="#7a4d2b"/></linearGradient>
<linearGradient id="post" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2f44"/><stop offset=".5" stop-color="#6b7391"/><stop offset="1" stop-color="#2a2f44"/></linearGradient>
<path id="hp" d="M0 12 C-18 -2 -12 -16 0 -6 C12 -16 18 -2 0 12Z"/>
