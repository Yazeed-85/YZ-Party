<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141b36" /><stop offset="1" stop-color="#090c18" /></linearGradient>
<radialGradient id="gx" cx=".2" cy=".2" r=".75"><stop offset="0" stop-color="#ff6b81" stop-opacity=".34" /><stop offset="1" stop-color="#ff6b81" stop-opacity="0" /></radialGradient>
<radialGradient id="go" cx=".8" cy=".8" r=".75"><stop offset="0" stop-color="#34d399" stop-opacity=".34" /><stop offset="1" stop-color="#34d399" stop-opacity="0" /></radialGradient>
<radialGradient id="rose" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffb3be" /><stop offset="1" stop-color="#ff6b81" /></radialGradient>
<radialGradient id="mint" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#a7f3d0" /><stop offset="1" stop-color="#34d399" /></radialGradient>
<linearGradient id="boardGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgba(255, 107, 129, 0.4)" /><stop offset="0.5" stop-color="rgba(255,255,255,0.05)" /><stop offset="1" stop-color="rgba(52, 211, 153, 0.4)" /></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="12" /></filter>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="blur" /><feComposite in="SourceGraphic" in2="blur" operator="over" /></filter>
</defs>

<!-- الخلفية الأساسية والأجرام -->
<rect width="600" height="400" fill="url(#bg)" />
<rect width="600" height="400" fill="url(#gx)" />
<rect width="600" height="400" fill="url(#go)" />

<!-- جزيئات الإضاءة الخلفية (X و O صغيرة) -->
<g opacity="0.3" filter="url(#blur)">
  <path d="M 80,60 L 120,100 M 120,60 L 80,100" stroke="#ff6b81" stroke-width="8" stroke-linecap="round" />
  <circle cx="500" cy="90" r="22" fill="none" stroke="#34d399" stroke-width="8" />
  <path d="M 480,320 L 520,360 M 520,320 L 480,360" stroke="#ff6b81" stroke-width="8" stroke-linecap="round" />
  <circle cx="90" cy="310" r="25" fill="none" stroke="#34d399" stroke-width="8" />
</g>

<!-- اللوحة المركزية المائلة ثلاثية الأبعاد -->
<g transform="translate(300, 200) rotate(-15) scale(1, 0.9) translate(-300, -200)">
  
  <!-- قاعدة اللوحة الزجاجية -->
  <rect x="150" y="50" width="300" height="300" rx="30" fill="#1a2552" opacity="0.6" />
  <rect x="150" y="50" width="300" height="300" rx="30" fill="none" stroke="url(#boardGlow)" stroke-width="3" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.7))" />
  
  <!-- خطوط الشبكة متوهجة بمهارة -->
  <line x1="250" y1="70" x2="250" y2="330" stroke="#3b4a8f" stroke-width="6" stroke-linecap="round" />
  <line x1="350" y1="70" x2="350" y2="330" stroke="#3b4a8f" stroke-width="6" stroke-linecap="round" />
  <line x1="170" y1="150" x2="430" y2="150" stroke="#3b4a8f" stroke-width="6" stroke-linecap="round" />
  <line x1="170" y1="250" x2="430" y2="250" stroke="#3b4a8f" stroke-width="6" stroke-linecap="round" />

  <!-- القطع المضيئة على اللوحة -->
  
  <!-- X في المركز -->
  <g transform="translate(300, 200)" filter="url(#glow)">
    <circle cx="0" cy="0" r="38" fill="rgba(255, 107, 129, 0.15)" />
    <path d="M -22,-22 L 22,22 M 22,-22 L -22,22" stroke="url(#rose)" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- O في أعلى اليمين -->
  <g transform="translate(400, 100)" filter="url(#glow)">
    <circle cx="0" cy="0" r="38" fill="rgba(52, 211, 153, 0.15)" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#mint)" stroke-width="12" />
  </g>

  <!-- X في أعلى اليسار -->
  <g transform="translate(200, 100)" filter="url(#glow)">
    <circle cx="0" cy="0" r="38" fill="rgba(255, 107, 129, 0.15)" />
    <path d="M -22,-22 L 22,22 M 22,-22 L -22,22" stroke="url(#rose)" stroke-width="12" stroke-linecap="round" />
  </g>
  
  <!-- O في أسفل الوسط -->
  <g transform="translate(300, 300)" filter="url(#glow)">
    <circle cx="0" cy="0" r="38" fill="rgba(52, 211, 153, 0.15)" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#mint)" stroke-width="12" />
  </g>
  
  <!-- قطعة شفافة / لم تلعب بعد (أسفل اليمين) لإعطاء إيحاء اللعب -->
  <g transform="translate(400, 300)" opacity="0.4">
    <path d="M -20,-20 L 20,20 M 20,-20 L -20,20" stroke="#64748b" stroke-width="8" stroke-linecap="round" />
  </g>

</g>

<!-- ظل أسفل اللوحة لتعزيز البعد الثالث -->
<ellipse cx="300" cy="380" rx="150" ry="12" fill="#050812" opacity="0.8" filter="url(#blur)" />

<!-- طبقة تظليل شاملة لضمان وضوح النص الأبيض -->
<rect width="600" height="400" fill="#090c18" opacity="0.4" style="backdrop-filter: blur(2px);" />
</svg>