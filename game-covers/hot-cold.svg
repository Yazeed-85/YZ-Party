<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141b36"/><stop offset="1" stop-color="#090c18"/></linearGradient>
<radialGradient id="gt" cx=".85" cy=".05" r=".75"><stop offset="0" stop-color="#4fd1c5" stop-opacity=".42"/><stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/></radialGradient>
<radialGradient id="ga" cx=".08" cy=".95" r=".75"><stop offset="0" stop-color="#ffb454" stop-opacity=".34"/><stop offset="1" stop-color="#ffb454" stop-opacity="0"/></radialGradient>
<radialGradient id="rose" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffb3be"/><stop offset="1" stop-color="#ff6b81"/></radialGradient>
<radialGradient id="amb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffe3b0"/><stop offset="1" stop-color="#ffb454"/></radialGradient>
<radialGradient id="ice" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#b8f5ee"/><stop offset="1" stop-color="#4fd1c5"/></radialGradient>
<radialGradient id="orb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffd48a"/><stop offset=".45" stop-color="#ffb454"/><stop offset="1" stop-color="#ff6b81"/></radialGradient>
<linearGradient id="merc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd1c5"/><stop offset=".48" stop-color="#ffb454"/><stop offset="1" stop-color="#ff6b81"/></linearGradient>
<linearGradient id="arc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4fd1c5"/><stop offset=".5" stop-color="#ffb454"/><stop offset="1" stop-color="#ff6b81"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="600" height="400" fill="url(#bg)"/><rect width="600" height="400" fill="url(#gt)"/><rect width="600" height="400" fill="url(#ga)"/>

<!-- قوس التدريج الحراري في الخلفية -->
<path d="M 118 228 A 188 188 0 0 1 482 228" fill="none" stroke="#0b1030" stroke-width="18" stroke-linecap="round" opacity=".65"/>
<path d="M 118 228 A 188 188 0 0 1 482 228" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 12" opacity=".85"/>

<!-- بطاقة البارد (يسار - مكشوفة) -->
<g transform="translate(168,188) rotate(-12)">
  <rect x="-68" y="-82" width="136" height="164" rx="22" fill="#1a2552" stroke="#4fd1c5" stroke-opacity=".65" stroke-width="2"/>
  <rect x="-52" y="-66" width="104" height="132" rx="14" fill="#0b1030" opacity=".75"/>
  <!-- رمز نجمة الثلج الهندسي -->
  <g stroke="#4fd1c5" stroke-width="3.5" stroke-linecap="round" opacity=".92">
    <line x1="0" y1="-38" x2="0" y2="6"/>
    <line x1="-19" y1="-27" x2="19" y2="-5"/>
    <line x1="-19" y1="-5" x2="19" y2="-27"/>
  </g>
  <circle cx="0" cy="-16" r="5" fill="url(#ice)"/>
  <rect x="-34" y="24" width="68" height="10" rx="5" fill="#4fd1c5" opacity=".85"/>
  <rect x="-22" y="42" width="44" height="8" rx="4" fill="#4fd1c5" opacity=".45"/>
  <circle cx="-48" cy="-62" r="14" fill="url(#ice)"/>
</g>

<!-- بطاقة الحار (يمين - سرية) -->
<g transform="translate(432,188) rotate(12)">
  <rect x="-68" y="-82" width="136" height="164" rx="22" fill="#1a2552" stroke="#ff6b81" stroke-opacity=".7" stroke-width="2"/>
  <rect x="-52" y="-66" width="104" height="132" rx="14" fill="#0b1030" opacity=".75"/>
  <!-- شعلة النار الهندسية -->
  <path d="M 0 -42 C 18 -24 24 -4 12 12 C 6 20 -6 20 -12 12 C -24 -4 -18 -24 0 -42 Z" fill="url(#orb)"/>
  <path d="M 0 -22 C 9 -12 11 0 5 9 C 2 13 -2 13 -5 9 C -11 0 -9 -12 0 -22 Z" fill="#ffe3b0"/>
  <rect x="-34" y="24" width="68" height="10" rx="5" fill="url(#rose)" opacity=".9"/>
  <rect x="-22" y="42" width="44" height="8" rx="4" fill="#ffb454" opacity=".55"/>
  <circle cx="48" cy="-62" r="14" fill="url(#rose)"/>
</g>

<!-- جزيئات الثلج والشرار في الفضاء -->
<circle cx="88" cy="118" r="7" fill="#4fd1c5" opacity=".75"/>
<circle cx="64" cy="172" r="4.5" fill="#4fd1c5" opacity=".5"/>
<circle cx="112" cy="276" r="6" fill="#4fd1c5" opacity=".6"/>
<circle cx="512" cy="112" r="8" fill="#ff6b81" opacity=".8"/>
<circle cx="538" cy="168" r="5" fill="#ffb454" opacity=".65"/>
<circle cx="492" cy="278" r="6.5" fill="#ff6b81" opacity=".65"/>

<!-- وهج الترمومتر المركزي -->
<circle cx="300" cy="236" r="60" fill="#ff6b81" opacity=".38" filter="url(#blur)"/>
<circle cx="300" cy="115" r="36" fill="#4fd1c5" opacity=".25" filter="url(#blur)"/>

<!-- جسم الترمومتر المركزي -->
<rect x="270" y="48" width="60" height="184" rx="30" fill="#1a2552" stroke="#3b4a8f" stroke-opacity=".8" stroke-width="2.5"/>
<circle cx="300" cy="238" r="50" fill="#1a2552" stroke="#3b4a8f" stroke-opacity=".8" stroke-width="2.5"/>

<!-- التجويف الداخلي للترمومتر -->
<rect x="282" y="60" width="36" height="172" rx="18" fill="#0b1030"/>
<circle cx="300" cy="238" r="38" fill="#0b1030"/>

<!-- سائل الزئبق المتدرج (بارد -> دافئ -> حار) -->
<rect x="289" y="86" width="22" height="150" rx="11" fill="url(#merc)"/>
<circle cx="300" cy="238" r="30" fill="url(#orb)"/>

<!-- لمعة زجاجية على الكرة الحرارية -->
<circle cx="289" cy="227" r="9" fill="#fff" opacity=".35"/>
<rect x="293" y="96" width="4" height="110" rx="2" fill="#fff" opacity=".28"/>

<!-- تدريجات القياس الجانبية -->
<line x1="252" y1="88" x2="264" y2="88" stroke="#4fd1c5" stroke-width="3.5" stroke-linecap="round"/>
<line x1="256" y1="112" x2="264" y2="112" stroke="#4fd1c5" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
<line x1="250" y1="136" x2="264" y2="136" stroke="#ffb454" stroke-width="3.5" stroke-linecap="round"/>
<line x1="256" y1="160" x2="264" y2="160" stroke="#ffb454" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
<line x1="252" y1="184" x2="264" y2="184" stroke="#ff6b81" stroke-width="3.5" stroke-linecap="round"/>

<line x1="336" y1="88" x2="348" y2="88" stroke="#4fd1c5" stroke-width="3.5" stroke-linecap="round"/>
<line x1="336" y1="112" x2="344" y2="112" stroke="#4fd1c5" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
<line x1="336" y1="136" x2="350" y2="136" stroke="#ffb454" stroke-width="3.5" stroke-linecap="round"/>
<line x1="336" y1="160" x2="344" y2="160" stroke="#ffb454" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
<line x1="336" y1="184" x2="348" y2="184" stroke="#ff6b81" stroke-width="3.5" stroke-linecap="round"/>

<!-- حلقة المؤشر النشط البيضاء (بنفس طابع الألعاب الأخرى) -->
<circle cx="300" cy="136" r="16" fill="url(#amb)"/>
<circle cx="300" cy="136" r="21" fill="none" stroke="#fff" stroke-width="3" opacity=".95"/>

<!-- ظل القاعدة السفلي -->
<rect x="190" y="312" width="220" height="10" rx="5" fill="#0b1030" opacity=".7"/>
</svg>