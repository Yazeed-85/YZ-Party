  if (!reduce) {
    gsap.to(orb, { y: -12, rotation: 5, duration: 1.7, yoyo: true, repeat: -1, ease: 'sine.inOut' });
    fl.querySelectorAll('.note').forEach((n, i) => gsap.to(n, { y: gsap.utils.random(-22, 22), x: gsap.utils.random(-14, 14), rotation: gsap.utils.random(-25, 25), duration: gsap.utils.random(1.3, 2.2), yoyo: true, repeat: -1, ease: 'sine.inOut', delay: i * .2 }));
  }
}
async function onChoose(music, fl, ch) {
  musicOn = music; sessionStorage.setItem('yz_music', music ? '1' : '0');
  [...ch.children].forEach(b => (b.disabled = true));
  if (music) primeMusic(); else actx().resume?.();       // داخل لمسة المستخدم
  const perm = mic();                                    // طلب إذن الميكروفون فوراً بلا زر منفصل
  const orb = fl.querySelector('.orb'), dir = music ? 1 : -1;
  if (!reduce) gsap.timeline().to(fl.querySelectorAll('.note'), { opacity: 0, duration: .2 }).to(orb, { x: dir * 150, y: 250, scale: .3, rotation: dir * 540, duration: .95, ease: 'power2.in' }, 0).to(orb, { opacity: 0, duration: .2 }, '-=.2');
  sfx.click();
  try { await perm; } catch {
    toast('الميكروفون مطلوب للعبة، اسمح به ثم اختر من جديد', 'error'); sfx.error();
    if (!reduce) gsap.to(orb, { x: 0, y: 0, scale: 1, rotation: 0, opacity: 1, duration: .5 }); [...ch.children].forEach(b => (b.disabled = false)); return;
  }
  setTimeout(imReady, reduce ? 0 : 750);
}

function render() {
  if (!st) return;
  if (st.round !== lastRound) { lastRound = st.round; recState = 'idle'; holding = false; stopPlay(); }
  const done = st.phase === 'done';
  $('#dots').replaceChildren(...Array.from({ length: ROUNDS }, (_, i) => h('i', (i + 1 < st.round || done ? 'on' : '') + (i + 1 === st.round && !done ? ' cur' : ''))));
  $('#gp').replaceChildren(...[0, 1].map(i => {
    const pl = h('div', 'pill'); pl.append(sp(nm(i) + (!done && st.round && i === spkOf(st.round) && ['say', 'listen'].includes(st.phase) ? ' 🎙' : (!done && st.round && i === mimOf(st.round) && st.phase === 'mimic' ? ' 🔁' : ''))), h('b', '', st.pts[i]));
    if (prevPts && prevPts[i] !== st.pts[i] && !reduce) gsap.fromTo(pl, { scale: 1.25 }, { scale: 1, duration: .6, ease: 'elastic.out(1,.5)' });
    return pl;
  }));
  prevPts = [...st.pts];
  (st.phase === 'say' && me === mimOf(st.round) && musicOn && serverNow() >= st.goAt) ? startMusic() : stopMusic();   // عند المقلِّد طوال تسجيل صاحب الجملة، إن سمح بها
  if (recObj && !((st.phase === 'say' && me === spkOf(st.round)) || (st.phase === 'mimic' && me === mimOf(st.round)))) recObj.stop();
  if (st.phase === 'judge' && me === spkOf(st.round) && !judging[st.round] && pcmA(st.round) && pcmB(st.round)) {
    judging[st.round] = true; setTimeout(() => finishJudge(st.round, runJudge(st.round)), 900);
  }
  renderPanel(); fillSheet();
  if (st.phase === 'listen' && me === mimOf(st.round)) startListen();
  if (done && !ended) {
    ended = true; const w = st.winner; stopMusic(); stream?.getTracks().forEach(t => t.stop());
    w === me ? sfx.win() : w === 'draw' ? sfx.turn() : sfx.lose();
    if (ctx.isHost) setTimeout(() => finishGame(ctx, w === 'draw' ? makeResult('draw', st.order, { pts: st.pts, ev: evBy(st.order, st.pts, 'r') })
      : makeResult('win', [st.order[w], st.order[1 - w]], { pts: st.pts, ev: evBy(st.order, st.pts, 'r') })), 6000);
  }
}

// ===== التشغيل =====
const backToLobby = async () => { await update(roomRef(ctx.code, 'meta'), { status: 'lobby', game: null }).catch(() => {}); goLobby(ctx.code); };
try { ctx = await enterRoom(); } catch (e) { toast(e.message, 'error'); setTimeout(() => goLobby(''), 1800); throw e; }
const ids = Object.keys(ctx.players);
if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { toast('متصفحك لا يدعم تسجيل الصوت', 'error'); if (ctx.isHost) setTimeout(backToLobby, 2200); }
else if (ids.length !== 2) { toast('اللعبة تحتاج لاعبين اثنين', 'error'); abortGame(ctx); }
else if (ctx.isHost) {
  const other = ids.find(i => i !== ctx.meta.host);
  runTransaction(gameRef(ctx.code, 's'), cur => cur || { order: [ctx.meta.host, other], round: 0, phase: 'ready', rd: [0, 0], pts: [0, 0], hist: [], endAt: 0, seq: 0 });
}
players = ctx.players;
const ex = initGameExit(ctx, { isOver: () => st?.phase === 'done', onGone: () => { stopMusic(); stopPlay(); recObj?.stop(); } });
onValue(gameRef(ctx.code, 's'), s => { st = s.val(); if (st) { me = st.order.indexOf(ctx.uid); render(); } });
onValue(gameRef(ctx.code, 'clipA'), s => { rawA = s.val(); if (st) render(); });
onValue(gameRef(ctx.code, 'clipB'), s => { rawB = s.val(); if (st) render(); });
watchRoom(ctx.code, {
  meta: m => { if (!m || m.status !== 'playing') { stopMusic(); if (!ex.busy()) goLobby(ctx.code); } },
  players: p => { players = p || players; scoreBar($('#sb'), players, scores, ctx.uid); if (st) { if (!['listen', 'reveal'].includes(st.phase)) panelKey = ''; render(); } },
  scores: s => { scores = s || {}; scoreBar($('#sb'), players, scores, ctx.uid); }
});
</script>
