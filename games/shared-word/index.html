<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الكلمة المشتركة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
html,body{height:100%;overflow:hidden}
main{justify-content:flex-start;padding-top:14px;height:100vh;height:100dvh;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scroll-behavior:auto}
.harm{width:min(94vw,820px);align-self:center;display:flex;flex-direction:column;gap:6px}
.harm .top{display:flex;justify-content:space-between;color:var(--mute);font-size:.8rem}.harm b{color:var(--text)}
.track{direction:ltr;height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.fill{height:100%;width:50%;border-radius:999px;transition:width .9s cubic-bezier(.2,.8,.2,1),background .9s}
.track::after{content:'';position:absolute;inset:0 auto 0 50%;width:2px;background:rgba(255,255,255,.25)}
.stage{padding:16px;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.pcard{padding:12px 14px;border-radius:18px;background:rgba(0,0,0,.25);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:center;height:104px;justify-content:center;overflow:hidden}
.pcard .cb{height:50px;width:100%;display:flex;align-items:center;justify-content:center}
.foot{height:84px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px}
.rd{height:1.3em}
.mid{height:1.15em;overflow:hidden;white-space:nowrap}
.pcard .who{color:var(--mute);font-size:.85rem}
.pcard .w{font:700 2rem 'Reem Kufi',sans-serif}
.pcard.ok{border-color:var(--lagoon);background:rgba(79,209,197,.12)}
.pcard.bad{border-color:rgba(255,107,129,.5)}
.mid{font:700 3rem 'Reem Kufi',sans-serif;color:var(--amber);line-height:1.1;padding:6px 0}
.rd{color:var(--mute);font-size:.9rem}
.verdict{font:700 1.3rem 'Reem Kufi',sans-serif}
.t{font:700 1.6rem 'Reem Kufi',sans-serif;color:var(--lagoon)}
.sent{color:var(--lagoon);font-weight:700}
.sm{color:var(--mute);font-size:.9rem}
.send{display:flex;gap:8px;width:100%;height:50px}.send input{text-align:center;font-size:1.2rem;padding-block:0;height:50px}.send .btn{width:auto;padding:0 22px;height:50px}
</style>
</head>
<body>
<main>
  <div id="sb" class="glass scorebar"></div>
  <div class="harm">
    <div class="top"><span>التناغم</span><b id="pct">50%</b></div>
    <div class="track"><div id="fill" class="fill"></div></div>
  </div>
  <div id="stage" class="glass stage">جارٍ التحميل…</div>
</main>
<script type="module">
import { runTransaction, onValue, serverNow } from '../../shared/firebase.js';
import { enterRoom, watchRoom, gameRef, goLobby, abortGame } from '../../shared/room.js';
import { finishGame, makeResult } from '../../shared/result.js';
import { countdown, deadline } from '../../shared/timer.js';
import { toast, sfx, scoreBar } from '../../shared/ui.js';
import { initGameExit } from '../../shared/leave.js';
import { WORDS } from './words.js';

// إعدادات قابلة للتعديل
const START = 50, UP = 15, DOWN = 20, WRITE_S = 20, REVEAL_S = 5, DECK = 40;
const $ = s => document.querySelector(s);
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
// توحيد الكتابة: التشكيل والتطويل، الهمزات، ة/ه، ى/ي، الرموز والمسافات، "ال" التعريف
const norm = s => (s || '').replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
  .replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '').replace(/^ال(?=.{2,})/, '');
// التقارب: جمع/مفرد ومشتقات قريبة. نُسقط لواحق الجمع والتأنيث، ثم نقارن "هيكل" الحروف بلا حروف العلة (ا و ي)
const strip = s => { for (const x of ['ات', 'ون', 'ين', 'ان', 'ه']) if (s.endsWith(x) && s.length - x.length >= 3) return s.slice(0, -x.length); return s; };
const skel = s => { if (s[0] === 'ا' && s.length > 3) s = s.slice(1); return s[0] + s.slice(1).replace(/[اوي]/g, ''); };
const variants = n => { const a = strip(n), v = new Set([n, a]); for (const x of [n, a]) { const k = skel(x); if (k.length >= 3) v.add(k); } return v; };
const same = (a, b) => { if (!a || !b) return false; const vb = variants(b); return [...variants(a)].some(x => vb.has(x)); };

let ctx, st = null, me = -1, players = {}, scores = {}, ended = false, stopT = null, stageKey = '', draft = '', lastSeq = -1;

// ===== القواعد =====
const act = fn => runTransaction(gameRef(ctx.code), cur => (cur ? fn(cur) : undefined)).catch(() => {});
const wordOf = (c, r) => c.words[(r - 1) % c.words.length];
function evalRound(o, now) {          // الكلمة الناقصة (انتهى وقتها) تُحتسب عدم تطابق
  const na = o.s0 != null ? norm(o.s0) : null, nb = o.s1 != null ? norm(o.s1) : null, ok = same(na, nb);
  o.exact = !!na && na === nb;
  o.bar = Math.max(0, Math.min(100, o.bar + (ok ? UP : -DOWN)));
  o.used = [...(o.used || []), ...[na, nb].filter(Boolean)];
  o.hist = [...(o.hist || []), { w: o.word, a: o.s0 ?? '—', b: o.s1 ?? '—', ok }];
  o.ok = ok;
  if (o.bar >= 100 || o.bar <= 0) { o.phase = 'done'; o.win = o.bar >= 100; }
  else { o.phase = 'reveal'; o.endAt = now + REVEAL_S * 1000; }
  o.seq++; return o;
}
const submit = text => act(c => {
  if (c.phase !== 'write' || c['s' + me] != null) return;
  const n = norm(text);
  if (n.length < 2 || same(n, norm(c.word)) || (c.used || []).some(u => same(n, u))) return;
  const o = { ...c, ['s' + me]: text.trim().slice(0, 20) };
  return o.s0 != null && o.s1 != null ? evalRound(o, serverNow()) : o;
});
const timeout = seq => act(c => {
  if (c.seq !== seq || serverNow() < c.endAt - 500) return;
  if (c.phase === 'write') return evalRound({ ...c }, serverNow());
  if (c.phase === 'reveal') {
    const r = c.round + 1;
    return { ...c, round: r, word: wordOf(c, r), s0: null, s1: null, ok: null, phase: 'write', endAt: deadline(WRITE_S), seq: c.seq + 1 };
  }
});

// ===== الواجهة =====
const nm = i => players[st.order[i]]?.name || '؟';
function startTimer() {
  stopT?.(); const t = $('#t'); if (!t || st.phase === 'done') return;
  const seq = st.seq;
  stopT = countdown(st.endAt, (l, s) => { t.textContent = s; if (s <= 3 && s > 0 && l % 1000 < 100) sfx.tick(); }, () => timeout(seq));
}

function tryAdd() {
  const n = norm(inp.value);
  if (n.length < 2) return toast('اكتب كلمة من حرفين على الأقل', 'error'), sfx.error();
  if (same(n, norm(st.word))) return toast('ممنوع كتابة الكلمة الظاهرة أو قريب منها', 'error'), sfx.error();
  if ((st.used || []).some(u => same(n, u))) return toast('هذه الكلمة (أو قريبة منها) استُخدمت من قبل', 'error'), sfx.error();
  sfx.click(); submit(inp.value); draft = '';
}

// الواجهة تُبنى مرة واحدة ثم تُحدَّث عناصرها في أماكنها: لا إعادة بناء ولا تركيز تلقائي ولا حركة صفحة عند أي تحديث من الطرف الآخر
let E = null, inp = null, myRow = null, builtRound = -1;
function buildStage() {
  const S = $('#stage'); S.replaceChildren();
  const card = () => { const c = h('div', 'pcard'), who = h('span', 'who'), cb = h('div', 'cb'); c.append(who, cb); c._w = who; c._b = cb; return c; };
  E = { rd: h('div', 'rd'), c: [card(), card()], mid: h('div', 'mid'), foot: h('div', 'foot') };
  const t = h('div', 't', ''); t.id = 't'; E.t = t; E.msg = h('div', 'sm'); E.foot.append(t, E.msg);
  S.append(E.rd, E.c[0], E.mid, E.c[1], E.foot);
  inp = h('input'); inp.maxLength = 20; inp.placeholder = 'أول كلمة تخطر ببالك'; inp.autocomplete = 'off';
  inp.oninput = () => { draft = inp.value; }; inp.onkeydown = e => { if (e.key === 'Enter') tryAdd(); };
  const b = h('button', 'btn primary', 'أرسل'); b.onclick = tryAdd;
  myRow = h('div', 'send'); myRow.append(inp, b);
}
function patchCard(i, show) {
  const c = E.c[i], b = c._b, sent = st['s' + i] != null;
  c._w.textContent = nm(i) + (i === me ? ' (أنت)' : '');
  c.classList.toggle('ok', show && !!st.ok); c.classList.toggle('bad', show && !st.ok);
  if (show) { if (b.firstChild !== b._w || b._w.textContent !== String(st['s' + i] ?? '—')) { b._w = h('span', 'w', st['s' + i] ?? '—'); b.replaceChildren(b._w); } return; }
  b._w = null;
  if (i === me && !sent) { if (b.firstChild !== myRow) b.replaceChildren(myRow); return; }
  const txt = sent ? '✔ أُرسلت' : '… يكتب', cls = sent ? 'sent' : 'sm';
  if (!(b.firstChild && b.firstChild._k === txt)) { const e = h('span', cls, txt); e._k = txt; b.replaceChildren(e); }
}
function renderStage() {
  if (!E) buildStage();
  const show = st.phase !== 'write', roundChanged = builtRound !== st.round;
  E.rd.textContent = `الجولة ${st.round}`; E.mid.textContent = st.word;
  if (roundChanged) { builtRound = st.round; draft = ''; inp.value = ''; }
  patchCard(0, show); patchCard(1, show);
  if (st.phase === 'write') { E.msg.textContent = 'اكتبا الكلمة المناسبة للكلمة التي في المنتصف، وتطابقا دون كلام'; E.msg.className = 'sm'; }
  else if (st.phase === 'reveal') { E.msg.textContent = st.ok ? (st.exact ? `متطابقة! +${UP} 🔥` : `متقاربة ✨ +${UP}`) : `مختلفة −${DOWN}`; E.msg.className = 'verdict'; }
  else { E.msg.textContent = st.win ? 'ربحتما! تناغم كامل 🎉' : 'انهار التناغم 💔'; E.msg.className = 'verdict'; }
  if (st.phase === 'done') E.t.textContent = '';
  const key = st.seq + '|' + st.phase;
  if (key !== stageKey) {
    stageKey = key;
    if (window.gsap && st.phase !== 'write') gsap.from(E.c.map(c => c._b), { y: 8, opacity: 0, duration: .35, stagger: .1, clearProps: 'transform,opacity' });
    startTimer();
    if (st.phase === 'write' && st['s' + me] == null && roundChanged && !matchMedia('(pointer:coarse)').matches) setTimeout(() => inp.focus({ preventScroll: true }), 50);
  }
}

function render() {
  if (!st) return;
  const col = `hsl(${st.bar * 1.25},72%,52%)`;
  $('#fill').style.width = st.bar + '%'; $('#fill').style.background = col; $('#pct').textContent = st.bar + '%';
  if (st.seq !== lastSeq) {
    lastSeq = st.seq;
    if (st.phase === 'reveal' || st.phase === 'done') st.ok ? sfx.turn() : sfx.error();
  }
  renderStage();
  if (st.phase === 'done' && !ended) {
    ended = true; st.win ? sfx.win() : sfx.lose();
    const rounds = (st.hist || []).length, bonus = rounds <= 5 ? 2 : rounds <= 8 ? 1 : 0;
    if (ctx.isHost) setTimeout(() => finishGame(ctx, st.win ? makeResult('coop-win', st.order, { rounds, bonus })
      : makeResult('coop-lose', st.order, { rounds })), 6000);
  }
}

// ===== التشغيل =====
try { ctx = await enterRoom(); } catch (e) { toast(e.message, 'error'); setTimeout(() => goLobby(''), 1800); throw e; }
const ids = Object.keys(ctx.players);
if (ids.length !== 2) { toast('اللعبة تحتاج لاعبين اثنين', 'error'); abortGame(ctx); }
else if (ctx.isHost) {
  const other = ids.find(i => i !== ctx.meta.host), words = [...WORDS].sort(() => Math.random() - .5).slice(0, DECK);
  runTransaction(gameRef(ctx.code), cur => cur || { order: [ctx.meta.host, other], words, round: 1, word: words[0], bar: START,
    phase: 'write', endAt: deadline(WRITE_S), seq: 0 });
}
players = ctx.players;
const ex = initGameExit(ctx, { isOver: () => st?.phase === 'done' });
onValue(gameRef(ctx.code), s => { st = s.val(); if (st) { me = st.order.indexOf(ctx.uid); render(); } });
watchRoom(ctx.code, {
  meta: m => { if ((!m || m.status !== 'playing') && !ex.busy()) goLobby(ctx.code); },
  players: p => { players = p || players; scoreBar($('#sb'), players, scores, ctx.uid); if (st) render(); },
  scores: s => { scores = s || {}; scoreBar($('#sb'), players, scores, ctx.uid); }
});
</script>
</body>
</html>
