<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تحدي X & O</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@500;700&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
html,body{height:100%;overflow:hidden}
main{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;justify-content:flex-start;gap:8px;padding:10px 14px 14px}
@media (pointer:coarse){main{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}}

/* الشبكة الخلفية والأجرام المضيئة */
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,210,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,210,255,0.02) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.orb1{width:350px;height:350px;background:rgba(0,210,255,0.06);top:-100px;right:-100px}
.orb2{width:300px;height:300px;background:rgba(167,139,250,0.06);bottom:-80px;left:-80px}

/* أشرطة وتنسيقات YZ-Party */
.scorebar{padding:6px 10px;flex:none;z-index:2}.sb{padding:5px 12px}
.info{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;z-index:2}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16)}
.dots i.on{background:var(--amber)}.dots i.cur{background:var(--text);box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.gp{display:flex;gap:6px}
.pill{display:flex;gap:8px;align-items:center;padding:3px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:.85rem}
.pill b{font:900 1.1rem 'Tajawal',sans-serif}
.pill.px b{color:#ff6b81}.pill.po b{color:#34d399}

/* البطاقة الرئيسية */
.card{flex:1 1 0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 20px;text-align:center;border-radius:28px;position:relative;overflow:hidden;z-index:2;background:rgba(15,25,40,0.85);border:1px solid rgba(0,210,255,0.12);box-shadow:0 30px 80px rgba(0,0,0,0.6)}
.ttl{font:900 clamp(1.15rem,4.5vw,1.6rem) 'Tajawal',sans-serif;color:white}
.sub{color:var(--mute);font-size:.92rem;line-height:1.6;white-space:pre-line}
.badge{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:2.9rem;background:rgba(255,255,255,.06);border:2px solid var(--line);flex:none}
.ok{color:#34d399}.no{color:#ff6b81}.am{color:var(--amber)}

/* لوحة اللعب XO */
.card{overflow-y:auto;padding:18px 14px;gap:12px;justify-content:center;justify-content:safe center}
.vs{display:flex;gap:10px;width:100%;max-width:380px;justify-content:center}
.vs .pl{flex:1;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);font-weight:700;font-size:.9rem;min-width:0;transition:.25s}
.vs .pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:right}
.vs .pl i{font:900 1.2rem 'Tajawal',sans-serif;font-style:normal;width:1.6em;height:1.6em;display:grid;place-items:center;border-radius:8px}
.vs .pl.px i{color:#ff6b81;background:rgba(255,107,129,.14)}.vs .pl.po i{color:#34d399;background:rgba(52,211,153,.14)}
.vs .pl.on.px{border-color:#ff6b81;box-shadow:0 0 18px rgba(255,107,129,.25)}.vs .pl.on.po{border-color:#34d399;box-shadow:0 0 18px rgba(52,211,153,.25)}
.board-wrap{--s:min(84vw,380px,max(180px,calc(100vh - 330px)));--s:min(84vw,380px,max(180px,calc(100dvh - 330px)));width:var(--s);aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(6px,2.2vw,12px);margin:2px 0;position:relative}
.cell{background:rgba(22,32,50,.7);border:1.5px solid rgba(255,255,255,.07);border-radius:clamp(12px,4vw,20px);display:flex;align-items:center;justify-content:center;cursor:default;transition:.15s;box-shadow:0 4px 15px rgba(0,0,0,.3);user-select:none;-webkit-tap-highlight-color:transparent;padding:16%}
.cell svg{width:100%;height:100%;overflow:visible}
.cell svg path,.cell svg circle{fill:none;stroke-width:11;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.cell.val-X svg{stroke:#ff6b81}.cell.val-O svg{stroke:#34d399}
.cell.pop svg path,.cell.pop svg circle{animation:draw .35s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.cell.clickable{cursor:pointer;background:rgba(0,210,255,.05);border-color:rgba(0,210,255,.18)}
@media (hover:hover){.cell.clickable:hover{background:rgba(0,210,255,.13);transform:translateY(-2px)}}
.cell.clickable:active{transform:scale(.93)}
.cell.val-X{background:rgba(255,107,129,.08);border-color:rgba(255,107,129,.25)}
.cell.val-O{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.25)}
.cell.win{animation:winPulse .6s ease infinite alternate}
.cell.win.val-X{background:rgba(255,107,129,.22);box-shadow:0 0 25px rgba(255,107,129,.4)}
.cell.win.val-O{background:rgba(52,211,153,.22);box-shadow:0 0 25px rgba(52,211,153,.4)}
@keyframes winPulse{from{transform:scale(1)}to{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.cell.pop svg *,.cell.win{animation:none}}
@media (max-height:520px) and (orientation:landscape){main{max-width:760px}.card{flex-direction:row;flex-wrap:wrap;gap:8px 18px;padding:8px}.card .ttl{font-size:1.1rem}.board-wrap{--s:min(46vw,calc(100vh - 150px))}}

/* شريط الوقت */
.tm{position:absolute;top:14px;left:18px;font:700 1.2rem 'Reem Kufi',sans-serif;color:var(--mute)}
.tb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.07)}
.tb i{display:block;height:100%;background:#00d2ff;transform-origin:right}

.acts{display:flex;gap:10px;width:100%;max-width:380px}.acts .btn{flex:1;padding:12px;border-radius:14px}
.spin{width:60px;height:60px;border-radius:50%;border:4px solid rgba(0,210,255,0.1);border-top-color:#00d2ff;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<main>
  <div id="sb" class="glass scorebar"></div>
  <div class="info"><div id="dots" class="dots"></div><div id="gp" class="gp"></div></div>
  <div id="card" class="card">جارٍ التحميل…</div>
</main>

<script type="module">
import { runTransaction, onValue, serverNow } from '../../shared/firebase.js';
import { enterRoom, watchRoom, gameRef, goLobby, abortGame } from '../../shared/room.js';
import { finishGame, makeResult, evBy } from '../../shared/result.js';
import { countdown, deadline } from '../../shared/timer.js';
import { toast, sfx, scoreBar } from '../../shared/ui.js';
import { initGameExit } from '../../shared/leave.js';

const $ = s => document.querySelector(s);
const sp = (t, c) => h('span', c, t);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || !window.gsap;   // بلا حركات إن مُنعت المكتبة أو فُضِّل تقليلها
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const btn = (txt, cls, fn) => { const b = h('button', 'btn ' + cls, txt); b.onclick = () => { sfx.click(); fn(); }; return b; };

// ===== الإعدادات =====
const ROUNDS = 5;
const TURN_S = 15;
const REVEAL_S = 4;
const MARK = { X: '<svg viewBox="0 0 100 100"><path pathLength="1" d="M14 14L86 86"/><path pathLength="1" d="M86 14L14 86" style="animation-delay:.12s"/></svg>', O: '<svg viewBox="0 0 100 100"><circle pathLength="1" cx="50" cy="50" r="36"/></svg>' };
const WIN_PATTERNS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

let ctx, st = null, me = -1, players = {}, scores = {}, ended = false, stopT = null;
let panelKey = '', lastSeq = -1, prevPts = null, prevBoardSig = [];

const nm = i => players[st?.order?.[i]]?.name || 'لاعب';
const act = fn => runTransaction(gameRef(ctx.code, 's'), cur => (cur ? fn(cur) : undefined)).catch(() => {});

// بدء جولة جديدة
function toRound(c, r) {
  const startTurn = (r - 1) % 2; // التناوب في من يبدأ أولاً
  return {
    ...c, round: r, phase: 'play',
    board: Array(9).fill(''), turn: startTurn,
    wPattern: null, rWinner: null,
    endAt: deadline(TURN_S), seq: c.seq + 1
  };
}

const imReady = () => act(c => {
  if (c.phase !== 'ready') return;
  const rd = [...(c.rd || [0, 0])]; rd[me] = 1;
  return rd[0] && rd[1] ? toRound({ ...c, rd }, 1) : { ...c, rd, seq: c.seq + 1 };
});

// تنفيذ حركة
const makeMove = idx => act(c => {
  if (me < 0 || !Number.isInteger(idx) || idx < 0 || idx > 8) return;
  if (c.phase !== 'play' || c.order[c.turn] !== ctx.uid || c.board[idx] !== '') return;
  const nb = Array.from({ length: 9 }, (_, i) => c.board[i] || '');
  nb[idx] = me === 0 ? 'X' : 'O';
  
  let wPat = null, isWin = false;
  for (let p of WIN_PATTERNS) {
    if (nb[p[0]] !== '' && nb[p[0]] === nb[p[1]] && nb[p[0]] === nb[p[2]]) { isWin = true; wPat = p; break; }
  }
  
  if (isWin) {
    const pts = [...c.pts]; pts[me] += 1;
    return { ...c, phase: 'reveal', board: nb, wPattern: wPat, rWinner: me, pts, endAt: deadline(REVEAL_S), seq: c.seq + 1 };
  }
  
  const isDraw = nb.every(x => x !== '');
  if (isDraw) return { ...c, phase: 'reveal', board: nb, wPattern: null, rWinner: 'draw', endAt: deadline(REVEAL_S), seq: c.seq + 1 };
  
  return { ...c, board: nb, turn: 1 - me, endAt: deadline(TURN_S), seq: c.seq + 1 };
});

const onTimeout = seq => act(c => {
  if (c.seq !== seq || serverNow() < c.endAt - 500) return;
  
  if (c.phase === 'play') {
    // لعب عشوائي إذا انتهى الوقت
    const empty = Array.from({ length: 9 }, (_, i) => i).filter(i => !c.board[i]);
    if (empty.length === 0) return;
    const rIdx = empty[Math.floor(Math.random() * empty.length)];
    const nb = Array.from({ length: 9 }, (_, i) => c.board[i] || '');
    nb[rIdx] = c.turn === 0 ? 'X' : 'O';

    let wPat = null, isWin = false;
    for (let p of WIN_PATTERNS) {
      if (nb[p[0]] !== '' && nb[p[0]] === nb[p[1]] && nb[p[0]] === nb[p[2]]) { isWin = true; wPat = p; break; }
    }
    if (isWin) {
      const pts = [...c.pts]; pts[c.turn] += 1;
      return { ...c, phase: 'reveal', board: nb, wPattern: wPat, rWinner: c.turn, pts, endAt: deadline(REVEAL_S), seq: c.seq + 1 };
    }
    const isDraw = nb.every(x => x !== '');
    if (isDraw) return { ...c, phase: 'reveal', board: nb, wPattern: null, rWinner: 'draw', endAt: deadline(REVEAL_S), seq: c.seq + 1 };

    return { ...c, board: nb, turn: 1 - c.turn, endAt: deadline(TURN_S), seq: c.seq + 1 };
  }

  if (c.phase === 'reveal') {
    if (c.round >= ROUNDS) {
      const w = c.pts[0] === c.pts[1] ? 'draw' : c.pts[0] > c.pts[1] ? 0 : 1;
      return { ...c, phase: 'done', winner: w, seq: c.seq + 1 };
    }
    return toRound(c, c.round + 1);
  }
});

function startTimer() {
  stopT?.(); if (!st || st.phase === 'ready' || st.phase === 'done') return;
  const t = $('#t'), b = $('#tb i'), seq = st.seq, tot = (st.phase === 'play' ? TURN_S : REVEAL_S) * 1000;
  stopT = countdown(st.endAt, (l, s) => {
    if (t) t.textContent = s;
    if (b) b.style.transform = `scaleX(${Math.min(1, l / tot)})`;
  }, () => onTimeout(seq));
}

function renderPanel() {
  if (!st || me < 0) return;
  const key = [st.seq, st.phase, st.round, st.turn, (st.board || []).join('|'), st.wPattern?.join(','), players[st.order[0]]?.name, players[st.order[1]]?.name].join('|');
  if (key === panelKey) return; panelKey = key;

  const c = $('#card');
  c.replaceChildren();

  if (st.phase !== 'done' && st.phase !== 'ready') {
    const tm = h('div', 'tm', '…'); tm.id = 't'; c.append(tm);
    const tb = h('div', 'tb'); tb.id = 'tb'; tb.append(h('i')); c.append(tb);
  }

  if (st.phase === 'ready') {
    if (st.rd?.[me]) {
      c.append(h('div', 'spin'), h('div', 'sub', `بانتظار ${nm(1 - me)}…`));
    } else {
      c.append(
        h('div', 'ttl', 'تحدي X & O'),
        h('div', 'sub', `رتب 3 قطع متتالية أفقياً أو عمودياً أو قطرياً لتفوز بالجولة.\n${ROUNDS} جولات، ولديك ${TURN_S} ثانية لكل حركة، وإلا يلعب النظام عنك!\nأنت ${me === 0 ? 'X' : 'O'}`),
        btn('جاهز للتحدي 🔥', 'primary', imReady)
      );
    }
  } else if (st.phase === 'play' || st.phase === 'reveal') {
    const isMyTurn = st.phase === 'play' && st.turn === me;
    
    if (st.phase === 'reveal') {
      const msg = st.rWinner === 'draw' ? 'تعادل!' : st.rWinner === me ? 'أحسنت! فزت بالجولة 👏' : 'خسرت الجولة 😤';
      const cls = st.rWinner === 'draw' ? 'am' : st.rWinner === me ? 'ok' : 'no';
      c.append(h('div', `ttl ${cls}`, msg));
    } else {
      c.append(h('div', 'ttl', isMyTurn ? '✨ دورك الآن!' : `⏳ انتظر ${nm(st.turn)}...`));
    }

    const wrap = h('div', 'board-wrap');
    for (let i = 0; i < 9; i++) {
      const cell = h('div', 'cell');
      const val = (st.board || [])[i] || '';
      if (val) {
        cell.innerHTML = MARK[val];
        cell.classList.add(`val-${val}`);
        if (!prevBoardSig[i] && lastSeq !== st.seq) cell.classList.add('pop');
        if (st.phase === 'reveal' && st.wPattern?.includes(i)) cell.classList.add('win');
      } else if (isMyTurn) {
        cell.classList.add('clickable');
        cell.onclick = () => { sfx.click(); makeMove(i); };
      }
      wrap.append(cell);
    }
    c.append(wrap); prevBoardSig = Array.from({ length: 9 }, (_, i) => (st.board || [])[i] || '');

    if (st.phase === 'play' && lastSeq !== st.seq && !reduce) {
      gsap.from(wrap, { scale: 0.95, opacity: 0.8, duration: 0.2 });
    }

  } else if (st.phase === 'done') {
    const w = st.winner;
    c.append(
      h('div', 'ttl', 'نهاية المباراة'),
      h('div', 'badge', w === 'draw' ? '🤝' : w === me ? '🏆' : '😎'),
      h('span', 'ttl ' + (w === me ? 'ok' : 'am'), w === 'draw' ? 'تعادل!' : w === me ? 'أنت البطل! 🎉' : `فاز ${nm(w)}`),
      h('div', 'sub', `${st.pts[me]} – ${st.pts[1 - me]}`)
    );
  }

  if (lastSeq !== st.seq) {
    if (st.phase === 'reveal') {
      if (st.rWinner === me) sfx.win();
      else if (st.rWinner === 'draw') sfx.turn();
      else sfx.lose();
    }
    lastSeq = st.seq;
  }

  startTimer();
}

function render() {
  if (!st) return;
  const done = st.phase === 'done';
  $('#dots').replaceChildren(...Array.from({ length: ROUNDS }, (_, i) => h('i', (i + 1 < st.round || done ? 'on' : '') + (i + 1 === st.round && !done ? ' cur' : ''))));
  $('#gp').replaceChildren(...[0, 1].map(i => {
    const pl = h('div', 'pill ' + (i === 0 ? 'px' : 'po'));
    pl.append(sp((i === 0 ? '✕ ' : '◯ ') + nm(i) + (!done && st.round && st.phase === 'play' && i === st.turn ? ' ✨' : '')), h('b', '', st.pts[i]));
    if (prevPts && prevPts[i] !== st.pts[i] && !reduce) gsap.fromTo(pl, { scale: 1.25 }, { scale: 1, duration: 0.6, ease: 'elastic.out(1, 0.5)' });
    return pl;
  }));
  prevPts = [...st.pts];
  renderPanel();
  if (done && !ended) {
    ended = true; stopT?.();
    const w = st.winner; w === me ? sfx.win() : w === 'draw' ? sfx.turn() : sfx.lose();
    if (ctx.isHost) setTimeout(() => finishGame(ctx, w === 'draw' ? makeResult('draw', st.order, { pts: st.pts, ev: evBy(st.order, st.pts, 'r') }) : makeResult('win', [st.order[w], st.order[1 - w]], { pts: st.pts, ev: evBy(st.order, st.pts, 'r') })), 5500);
  }
}

// ===== التشغيل =====
try { ctx = await enterRoom(); } catch (e) { toast(e.message, 'error'); setTimeout(() => goLobby(''), 1800); throw e; }

const ids = Object.keys(ctx.players || {});
if (ids.length !== 2) { toast('اللعبة تحتاج لاعبين اثنين', 'error'); abortGame(ctx); }
else {
  if (ctx.isHost) {
    const other = ids.find(i => i !== ctx.meta.host);
    runTransaction(gameRef(ctx.code, 's'), cur => cur || toRound({ order: [ctx.meta.host, other], round: 0, rd: [1, 1], pts: [0, 0], seq: 0 }, 1));
  }
  players = ctx.players;
  const ex = initGameExit(ctx, { isOver: () => st?.phase === 'done', onGone: () => stopT?.() });
  onValue(gameRef(ctx.code, 's'), s => { st = s.val(); if (st) { me = st.order.indexOf(ctx.uid); render(); } });
  watchRoom(ctx.code, {
    meta: m => { if ((!m || m.status !== 'playing') && !ex.busy()) goLobby(ctx.code); },
    players: p => { players = p || players; scoreBar($('#sb'), players, scores, ctx.uid); if (st) render(); },
    scores: s => { scores = s || {}; scoreBar($('#sb'), players, scores, ctx.uid); }
  });
}
</script>
</body>
</html>
