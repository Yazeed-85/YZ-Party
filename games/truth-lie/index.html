<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صادق أم كاذب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
main{justify-content:flex-start;padding-top:14px;gap:10px}
.info{display:flex;justify-content:space-between;align-items:center;padding:0 6px;color:var(--mute);font-size:.9rem}
.info b{color:var(--amber);font:700 1.2rem 'Reem Kufi',sans-serif}
/* ===== الصندوق ثلاثي الأبعاد ===== */
.scene{position:relative;height:420px;perspective:900px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:visible}
.rot{position:absolute;left:50%;top:300px;width:0;height:0;transform-style:preserve-3d}
.rot.back{z-index:1}.rot.front{z-index:3}
.f{position:absolute;border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 0 34px rgba(0,0,0,.4)}
.f.front,.f.back{width:170px;height:120px;left:-85px;top:-60px}
.f.front{transform:translateZ(85px);background:linear-gradient(160deg,#2b3658,#171d33)}
.f.back{transform:rotateY(180deg) translateZ(85px);background:#0f1428}
.f.left,.f.right{width:170px;height:120px;left:-85px;top:-60px;background:linear-gradient(160deg,#222c4b,#121830)}
.f.left{transform:rotateY(-90deg) translateZ(85px)}.f.right{transform:rotateY(90deg) translateZ(85px)}
.f.bottom{width:170px;height:170px;left:-85px;top:-85px;transform:rotateX(-90deg) translateZ(60px);background:#0b1020}
.f.front::before,.lidp::before{content:'';position:absolute;left:50%;width:30px;margin-left:-15px;top:0;bottom:0;background:linear-gradient(90deg,#e09a2b,var(--amber),#e09a2b)}
.f.front::after{content:'؟';position:absolute;inset:0;display:grid;place-items:center;font:700 3.4rem 'Reem Kufi',sans-serif;color:#3a2605}
.hinge{position:absolute;left:0;top:0;width:0;height:0;transform:translate3d(0,-60px,-85px);transform-style:preserve-3d}
.lid{position:absolute;left:-85px;top:0;width:170px;height:0;transform-style:preserve-3d}
.lidp{position:absolute;left:0;top:0;width:170px;height:170px;transform-origin:50% 0;transform:rotateX(90deg);background:linear-gradient(160deg,#34416a,#1d2543);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.shadow{position:absolute;left:50%;top:372px;width:210px;height:38px;margin-left:-105px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent)}
.item{position:absolute;left:50%;top:300px;width:156px;padding:12px;border-radius:20px;background:rgba(16,20,38,.94);border:1px solid rgba(255,180,84,.65);box-shadow:0 0 56px rgba(255,180,84,.5);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2;opacity:0;pointer-events:none}
.item img{width:130px;height:130px;object-fit:contain;border-radius:12px;background:rgba(255,255,255,.05)}
.item b{font:700 1.3rem 'Reem Kufi',sans-serif;color:var(--amber)}
.spark{position:absolute;left:50%;top:120px;width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber);z-index:5;pointer-events:none}
.hold{text-align:center;color:var(--mute);font-size:.85rem;min-height:1.2em}
/* ===== اللوحة ===== */
.card{padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.big{font:700 2.4rem 'Reem Kufi',sans-serif;color:var(--lagoon)}
.msg{font-size:1.15rem;font-weight:700}.sm{color:var(--mute);font-size:.9rem}
.two{display:flex;gap:10px;width:100%}.two .btn{flex:1}
.btn.yes{background:var(--lagoon);color:#06231f}.btn.no{background:var(--rose);color:#2a0710}
</style>
</head>
<body>
<main>
  <div id="sb" class="glass scorebar"></div>
  <div class="info"><span id="round">…</span><b id="pts">0 – 0</b></div>
  <div id="scene" class="scene" aria-label="الصندوق">
    <div class="shadow"></div>
    <div class="rot back">
      <div class="f back"></div><div class="f left"></div><div class="f right"></div><div class="f bottom"></div>
      <div class="hinge"><div id="lid" class="lid"><div class="lidp"></div></div></div>
    </div>
    <div id="item" class="item"><img id="iimg" alt=""><b id="iname"></b></div>
    <div class="rot front"><div class="f front"></div></div>
  </div>
  <div id="hold" class="hold"></div>
  <div id="panel" class="glass card">جارٍ التحميل…</div>
</main>
<script type="module">
import { runTransaction, onValue, serverNow, update } from '../../shared/firebase.js';
import { enterRoom, watchRoom, gameRef, roomRef, goLobby } from '../../shared/room.js';
import { finishGame, makeResult } from '../../shared/result.js';
import { countdown, deadline } from '../../shared/timer.js';
import { toast, sfx, scoreBar } from '../../shared/ui.js';

// إعدادات قابلة للتعديل
const ROUNDS = 6, CHOOSE_S = 20, ASK_S = 30, JUDGE_S = 10, REVEAL_S = 7, VIOL_S = 5, MAX_VIOL = 2, DECK = 14;
const $ = s => document.querySelector(s);
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const btn = (txt, cls, fn) => { const b = h('button', 'btn ' + cls, txt); b.onclick = () => { sfx.click(); fn(); }; return b; };
const T = { honest: 'صادق', liar: 'كاذب' };
const label = f => f.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
let ctx, st = null, me = -1, players = {}, scores = {}, ended = false, stopT = null, panelKey = '', boxOpen = false, holding = false, tl = null, lastSeq = -1;

// ===== القواعد =====
const holderOf = r => (r - 1) % 2;                       // المضيف يحمل الصندوق في الجولات الفردية
const prod = c => c.deck[(c.round - 1) % c.deck.length];
const act = fn => runTransaction(gameRef(ctx.code), cur => (cur ? fn(cur) : undefined)).catch(() => {});
const toAsk = (c, pick) => ({ ...c, pick, phase: 'ask', endAt: deadline(ASK_S), viol: 0, seq: c.seq + 1 });
const choose = p => act(c => (c.phase === 'choose' && c.order[holderOf(c.round)] === ctx.uid) ? toAsk(c, p) : undefined);
const violation = () => act(c => {                        // سؤال مخالف: يخصم 5 ثوانٍ من وقت السائل (حد أقصى MAX_VIOL)
  if (c.phase !== 'ask' || c.order[holderOf(c.round)] !== ctx.uid || (c.viol || 0) >= MAX_VIOL) return;
  const left = c.endAt - serverNow();
  return { ...c, viol: (c.viol || 0) + 1, endAt: serverNow() + Math.max(500, left - VIOL_S * 1000), seq: c.seq + 1 };
});
const toJudge = c => ({ ...c, phase: 'judge', endAt: deadline(JUDGE_S), seq: c.seq + 1 });
const ready = () => act(c => (c.phase === 'ask' && c.order[1 - holderOf(c.round)] === ctx.uid) ? toJudge(c) : undefined);
function reveal(c, v) {                                   // نقطة للمخمّن إن أصاب وإلا لصاحب الصندوق
  const hh = holderOf(c.round), g = 1 - hh, ok = v === c.pick, pts = [...c.pts];
  pts[ok ? g : hh]++;
  return { ...c, verdict: v || 'none', ok, pts, phase: 'reveal', endAt: serverNow() + REVEAL_S * 1000, seq: c.seq + 1 };
}
const judge = v => act(c => (c.phase === 'judge' && c.order[1 - holderOf(c.round)] === ctx.uid) ? reveal(c, v) : undefined);
const timeout = seq => act(c => {
  if (c.seq !== seq || serverNow() < c.endAt - 500) return;
  if (c.phase === 'choose') return toAsk(c, Math.random() < .5 ? 'honest' : 'liar');
  if (c.phase === 'ask') return toJudge(c);
  if (c.phase === 'judge') return reveal(c, null);
  if (c.phase === 'reveal') {
    const r = c.round, tie = c.pts[0] === c.pts[1];
    if (r < ROUNDS || (r === ROUNDS && tie))             // التعادل بعد الجولات الست يُحسم بجولة فاصلة
      return { ...c, round: r + 1, phase: 'choose', pick: null, verdict: null, ok: null, endAt: deadline(CHOOSE_S), viol: 0, seq: c.seq + 1 };
    return { ...c, phase: 'done', winner: c.pts[0] > c.pts[1] ? 0 : 1, seq: c.seq + 1 };
  }
});

// ===== الصندوق التفاعلي (GSAP) =====
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) gsap.globalTimeline.timeScale(10);
gsap.set('.rot', { rotationX: -18, rotationY: -26 });
gsap.set('#lid', { transformOrigin: '50% 0', rotationX: 0 });
gsap.set('#item', { xPercent: -50, yPercent: -50, opacity: 0, scale: .45, y: 40 });
gsap.from('.rot', { y: -320, opacity: 0, duration: 1, ease: 'bounce.out', delay: .15 });
gsap.from('.shadow', { opacity: 0, scale: .4, duration: .8, delay: .5 });
gsap.to('.rot', { y: -8, duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 1.3 });

function openBox() {
  boxOpen = true; tl?.kill();
  tl = gsap.timeline()
    .fromTo('.rot', { x: -4 }, { x: 4, duration: .05, repeat: 5, yoyo: true, ease: 'none' })
    .to('.rot', { x: 0, duration: .05 })
    .to('#lid', { rotationX: 115, duration: .6, ease: 'back.out(1.7)' })
    .fromTo('#item', { y: 40, scale: .45, opacity: 0, rotation: -10 }, { y: -190, scale: 1, opacity: 1, rotation: 0, duration: .9, ease: 'elastic.out(1,.6)' }, '-=.25');
}
function closeBox() {
  boxOpen = false; tl?.kill();
  tl = gsap.timeline().to('#item', { y: 40, scale: .45, opacity: 0, duration: .35, ease: 'power2.in' })
    .to('#lid', { rotationX: 0, duration: .5, ease: 'bounce.out' }, '-=.1');
}
function burst() {
  for (let i = 0; i < 22; i++) {
    const p = h('i', 'spark'), a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 130;
    $('#scene').append(p);
    gsap.fromTo(p, { x: 0, y: 0, scale: 1, opacity: 1 }, { x: Math.cos(a) * d, y: Math.sin(a) * d - 60, scale: 0, opacity: 0, delay: .5,
      duration: .9 + Math.random() * .5, ease: 'power2.out', onComplete: () => p.remove() });
  }
}
const canHold = () => st && me === holderOf(st.round) && ['choose', 'ask', 'judge'].includes(st.phase);
function syncBox() {
  if (!st) return;
  const want = st.phase === 'reveal' || (holding && canHold());
  if (want && !boxOpen) {
    const f = prod(st);
    $('#iimg').src = 'images/' + encodeURIComponent(f); $('#iname').textContent = label(f);
    openBox(); if (st.phase === 'reveal') { burst(); sfx.win(); }
  } else if (!want && boxOpen) closeBox();
}
const scene = $('#scene');
scene.addEventListener('pointerdown', e => { if (!canHold()) return; e.preventDefault(); holding = true; syncBox(); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => scene.addEventListener(ev, () => { if (holding) { holding = false; syncBox(); } }));
scene.addEventListener('contextmenu', e => e.preventDefault());
$('#iimg').onerror = () => { $('#iimg').style.visibility = 'hidden'; };
$('#iimg').onload = () => { $('#iimg').style.visibility = 'visible'; };

// ===== الواجهة =====
const nm = i => players[st.order[i]]?.name || '؟';
function startTimer() {
  stopT?.(); const t = $('#t'); if (!t || st.phase === 'done') return;
  const seq = st.seq;
  stopT = countdown(st.endAt, (l, s) => { t.textContent = s; if (s <= 3 && s > 0 && l % 1000 < 100) sfx.tick(); }, () => timeout(seq));
}
function renderPanel() {
  const key = [st.seq, st.phase, st.endAt].join('|');
  if (key === panelKey) return; panelKey = key;
  const p = $('#panel'), hh = holderOf(st.round), g = 1 - hh, isH = me === hh;
  const timer = h('div', 'big', '…'); timer.id = 't';
  const two = (a, b) => { const r = h('div', 'two'); r.append(a, b); return r; };
  p.replaceChildren();
  if (st.phase === 'choose') {
    if (isH) p.append(h('div', 'msg', 'اختر دورك في هذه الجولة'), h('div', 'sm', 'اضغط مطولاً على الصندوق لترى المنتج، ثم قرّر: ستجيب بصدق في كل أجوبتك أم تكذب في كلها'), timer,
      two(btn('سأكون صادقاً 😇', 'yes', () => choose('honest')), btn('سأكذب 😈', 'no', () => choose('liar'))));
    else p.append(h('div', 'msg', `${nm(hh)} ينظر إلى المنتج…`), h('div', 'sm', 'يختار الآن أن يكون صادقاً أو كاذباً، ولن تعرف اختياره'), timer);
  } else if (st.phase === 'ask') {
    if (isH) {
      const left = MAX_VIOL - (st.viol || 0), v = btn(`سؤال مخالف (−${VIOL_S}ث) · ${left}`, 'ghost', violation); v.disabled = left <= 0;
      p.append(h('div', 'msg', `${nm(g)} يسألك الآن`), h('div', 'sm', `اختيارك: ${st.pick === 'honest' ? 'صادق 😇' : 'كاذب 😈'} في كل أجوبتك. الأسئلة عن المنتج فقط`), timer, v);
    } else p.append(h('div', 'msg', `اسأل ${nm(hh)} عن المنتج!`), h('div', 'sm', 'أسئلة عن المنتج فقط، ثم احكم: صادق أم كاذب؟'), timer, btn('انتهيت، سأحكم', 'primary', ready));
  } else if (st.phase === 'judge') {
    if (isH) p.append(h('div', 'msg', `${nm(g)} يحكم الآن…`), timer);
    else p.append(h('div', 'msg', `هل ${nm(hh)} صادق أم كاذب؟`), timer, two(btn('صادق', 'yes', () => judge('honest')), btn('كاذب', 'no', () => judge('liar'))));
  } else if (st.phase === 'reveal') {
    p.append(h('div', 'msg', st.ok ? `أصاب ${nm(g)}! 🎯` : `انخدع ${nm(g)}! 🎭`),
      h('div', 'sm', `${nm(hh)} كان ${T[st.pick]}`), h('div', 'sm', `حكم ${nm(g)}: ${T[st.verdict] || 'لم يحكم'}`),
      h('div', 'sm', `+1 لـ${nm(st.ok ? g : hh)}`), timer);
  } else {
    const w = st.winner;
    p.append(h('div', 'msg', w === me ? 'فزت! 🎉' : `فاز ${nm(w)}`), h('div', 'sm', `النتيجة النهائية ${st.pts[0]} – ${st.pts[1]}`));
  }
  if (!reduce) gsap.from(p.children, { y: 14, opacity: 0, duration: .4, stagger: .07, ease: 'power2.out' });
  startTimer();
}
function render() {
  if (!st) return;
  $('#round').textContent = st.phase === 'done' ? 'انتهت اللعبة' : st.round > ROUNDS ? 'الجولة الفاصلة' : `الجولة ${st.round} من ${ROUNDS}`;
  $('#pts').textContent = `${nm(0)} ${st.pts[0]} – ${st.pts[1]} ${nm(1)}`;
  $('#hold').textContent = canHold() ? 'اضغط مطولاً على الصندوق لترى المنتج' : '';
  if (!canHold() && holding) holding = false;
  if (st.seq !== lastSeq) { lastSeq = st.seq; if (st.phase === 'choose' || st.phase === 'judge') sfx.turn(); }
  syncBox(); renderPanel();
  if (st.phase === 'done' && !ended) {
    ended = true; const w = st.winner;
    w === me ? sfx.win() : sfx.lose();
    if (ctx.isHost) setTimeout(() => finishGame(ctx, makeResult('win', [st.order[w], st.order[1 - w]], { pts: st.pts })), 6000);
  }
}

// ===== التشغيل =====
const backToLobby = async () => { await update(roomRef(ctx.code, 'meta'), { status: 'lobby', game: null }).catch(() => {}); goLobby(ctx.code); };
try { ctx = await enterRoom(); } catch (e) { toast(e.message, 'error'); setTimeout(() => goLobby(''), 1800); throw e; }
const ids = Object.keys(ctx.players);
if (ids.length !== 2) { toast('اللعبة تحتاج لاعبين اثنين', 'error'); if (ctx.isHost) setTimeout(backToLobby, 1800); }
else if (ctx.isHost) {
  try {
    const list = await (await fetch('images/list.json?' + Date.now())).json();
    if (!Array.isArray(list) || !list.length) throw 0;
    const deck = [...list].sort(() => Math.random() - .5).slice(0, DECK), other = ids.find(i => i !== ctx.meta.host);
    runTransaction(gameRef(ctx.code), cur => cur || { order: [ctx.meta.host, other], deck, round: 1, phase: 'choose', pts: [0, 0],
      viol: 0, endAt: deadline(CHOOSE_S), seq: 0 });
  } catch { toast('لا توجد صور في games/truth-lie/images', 'error'); setTimeout(backToLobby, 2500); }
}
players = ctx.players;
onValue(gameRef(ctx.code), s => { st = s.val(); if (st) { me = st.order.indexOf(ctx.uid); render(); } });
watchRoom(ctx.code, {
  meta: m => { if (!m || m.status !== 'playing') goLobby(ctx.code); },
  players: p => { players = p || players; scoreBar($('#sb'), players, scores, ctx.uid); if (st) { panelKey = ''; render(); } },
  scores: s => { scores = s || {}; scoreBar($('#sb'), players, scores, ctx.uid); }
});
</script>
</body>
</html>
