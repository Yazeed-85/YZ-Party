<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صادق أم كاذب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<!-- مكتبة Google لعرض وتدوير مجسمات الـ 3D (GLB) -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
<style>
html,body{height:100%;overflow:hidden}
main{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;justify-content:flex-start;gap:8px;padding:10px 14px 14px}
@media (pointer:coarse){main{padding-bottom:58px}}
.scorebar{padding:6px 10px;flex:none}.sb{padding:5px 12px}
.info{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.16)}
.dots i.on{background:var(--amber)}.dots i.cur{background:var(--text);box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.gp{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.info{flex-wrap:wrap}
.gp.m .pill{padding:2px 8px;gap:5px;font-size:.78rem}.gp.m .pill span{max-width:5.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill.gone{opacity:.4}
.pill{display:flex;gap:8px;align-items:center;padding:3px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:.85rem}
.pill b{color:var(--amber);font:700 1.05rem 'Reem Kufi',sans-serif}
/* ===== المشهد: يُصغَّر تلقائياً ليتسع في الشاشة بلا تمرير ===== */
.scene{position:relative;flex:1 1 0;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
.stage{position:absolute;left:50%;top:0;width:340px;height:520px;margin-left:-170px;transform-origin:50% 0;perspective:900px}
.rot{position:absolute;left:50%;top:410px;width:0;height:0;transform-style:preserve-3d;visibility:hidden}
.rot.back{z-index:1}.rot.front{z-index:3}
.f{position:absolute;border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 0 34px rgba(0,0,0,.4)}
.f.front,.f.back{width:170px;height:120px;left:-85px;top:-60px}
.f.front{transform:translateZ(85px);background:linear-gradient(160deg,#2b3658,#171d33)}
.f.back{transform:rotateY(180deg) translateZ(85px);background:#0f1428}
.f.left,.f.right{width:170px;height:120px;left:-85px;top:-60px;background:linear-gradient(160deg,#222c4b,#121830)}
.f.left{transform:rotateY(-90deg) translateZ(85px)}.f.right{transform:rotateY(90deg) translateZ(85px)}
.f.bottom{width:170px;height:170px;left:-85px;top:-85px;transform:rotateX(-90deg) translateZ(60px);background:#0b1020}
.f.front::before,.lidp::before{content:'';position:absolute;left:50%;width:30px;margin-left:-15px;top:0;bottom:0;background:linear-gradient(90deg,#e09a2b,var(--amber),#e09a2b)}
.f.front::after{content:'؟';position:absolute;inset:0;display:grid;place-items:center;font:700 3.4rem 'Reem Kufi',sans-serif;color:#3a2605}
.hinge{position:absolute;left:0;top:0;width:0;height:0;transform:translate3d(0,-60px,-85px);transform-style:preserve-3d}
.lid{position:absolute;left:-85px;top:0;width:170px;height:0;transform-style:preserve-3d}
.lidp{position:absolute;left:0;top:0;width:170px;height:170px;transform-origin:50% 0;transform:rotateX(90deg);background:linear-gradient(160deg,#34416a,#1d2543);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.shadow{position:absolute;left:50%;top:482px;width:210px;height:38px;margin-left:-105px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent)}
.item{position:absolute;left:50%;top:410px;width:300px;display:flex;justify-content:center;z-index:2;opacity:0;pointer-events:none}
.item::before{content:'';position:absolute;left:50%;top:50%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,180,84,.34),rgba(255,180,84,.08) 62%,transparent);z-index:-1;pointer-events:none}
.item model-viewer{width:290px;height:290px;background:transparent;--poster-color:transparent;--progress-bar-color:#ffb454;outline:none}
.item img{width:270px;height:270px;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55))}
.spark{position:absolute;left:50%;top:190px;width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber);z-index:5;pointer-events:none}
/* ===== اللوحة السفلية المدمجة ===== */
.pn{flex:none;padding:12px 14px 10px;display:flex;flex-direction:column;gap:9px;border-radius:22px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px}
.ttl{font-size:1.1rem;font-weight:700}
.tm{font:700 1.4rem 'Reem Kufi',sans-serif;color:var(--mute);min-width:2ch;text-align:left}
.sub2{color:var(--mute);font-size:.9rem;margin-top:-4px}
.ok{color:#34d399}.no2{color:#ff6b81}.mu{color:var(--mute)}
.acts{display:flex;gap:10px}.acts .btn{flex:1;padding:12px}
.btn.good{background:#34d399;color:#04241a;border-color:transparent}.btn.bad{background:#ff6b81;color:#2a0710;border-color:transparent}
.tb{height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.tb i{display:block;height:100%;background:var(--lagoon);transform-origin:right}
.res{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:2px 0}
.res .l1{font:700 1.55rem 'Reem Kufi',sans-serif}.res .l2{font-size:1.05rem}
</style>
</head>
<body>
<main>
  <div id="sb" class="glass scorebar"></div>
  <div class="info"><div id="dots" class="dots"></div><div id="gp" class="gp"></div></div>
  <div id="scene" class="scene" aria-label="الصندوق">
    <div id="stage" class="stage">
      <div class="shadow"></div>
      <div class="rot back">
        <div class="f back"></div><div class="f left"></div><div class="f right"></div><div class="f bottom"></div>
        <div class="hinge"><div id="lid" class="lid"><div class="lidp"></div></div></div>
      </div>
      <div id="item" class="item">
        <model-viewer id="m3d" camera-controls auto-rotate auto-rotate-delay="2500" rotation-per-second="28deg" disable-zoom disable-pan
          interaction-prompt="none" touch-action="none" shadow-intensity="1.1" exposure="1.1" environment-image="neutral"></model-viewer>
        <img id="iimg" alt="" hidden>
      </div>
      <div class="rot front"><div class="f front"></div></div>
    </div>
  </div>
  <div id="panel" class="glass pn">جارٍ التحميل…</div>
</main>
<script type="module">
import { runTransaction, onValue, serverNow, update } from '../../shared/firebase.js';
import { enterRoom, watchRoom, gameRef, roomRef, goLobby, abortGame } from '../../shared/room.js';
import { finishGame, makeResult, evBy } from '../../shared/result.js';
import { countdown, deadline } from '../../shared/timer.js';
import { toast, sfx, scoreBar } from '../../shared/ui.js';
import { initGameExit, initGroupExit } from '../../shared/leave.js';

// إعدادات قابلة للتعديل
const CHOOSE_S = 20, ASK_S = 30, ASK_MULTI_S = 60, JUDGE_S = 10, REVEAL_S = 7, DECK = 14, IDLE_MS = 3000; // IDLE_MS: يعود المجسم للصندوق بعد هذا الخمول
const $ = s => document.querySelector(s);
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const btn = (txt, cls, fn) => { const b = h('button', 'btn ' + cls, txt); b.onclick = () => { sfx.click(); fn(); }; return b; };
const T = { honest: 'صادق', liar: 'كاذب' };
const TOT = { choose: CHOOSE_S, judge: JUDGE_S, reveal: REVEAL_S };
const MAX_MODELS = 500;                                   // يبحث اللعب عن 1.glb … 500.glb الموجودة فعلاً (إضافة مجسم = رفع ملفه فقط)
let ctx, st = null, me = -1, players = {}, scores = {}, ended = false, stopT = null, panelKey = '', boxOpen = false, boxOpenedManually = false, inactivityTimer = null, tl = null, bob = null, preKey = '', lastSeq = -1, seen = false, seenRound = -1, prevPts = null;

// ===== القواعد =====
// لاعبان: 6 جولات بالتناوب (كما كانت). 3-4 لاعبين: جولتان لكل لاعب، يسأل الجميع صاحب الصندوق معاً ثم يحكم كل واحد منهم
const roundsFor = n => (n === 2 ? 6 : n * 2);
const askFor = n => (n === 2 ? ASK_S : ASK_MULTI_S);
const nOf = c => c.order.length;
const isGone = (c, i) => !!(c.gone && c.gone[c.order[i]]);
const aliveOf = c => c.order.map((_, i) => i).filter(i => !isGone(c, i));
const holderAt = (c, r) => { const n = nOf(c); let i = (r - 1) % n; for (let k = 0; k < n && isGone(c, i); k++) i = (i + 1) % n; return i; };
const hOf = c => holderAt(c, c.round);                    // المضيف يحمل الصندوق في الجولات الفردية
const guessersOf = c => aliveOf(c).filter(i => i !== hOf(c));
const gUids = c => guessersOf(c).map(i => c.order[i]);
const prod = c => c.deck[(c.round - 1) % c.deck.length];
const act = fn => runTransaction(gameRef(ctx.code), cur => (cur ? fn(cur) : undefined)).catch(() => {});
const toAsk = (c, pick) => ({ ...c, pick, rdy: {}, votes: {}, phase: 'ask', endAt: deadline(askFor(nOf(c))), seq: c.seq + 1 });
const choose = p => act(c => (c.phase === 'choose' && c.order[hOf(c)] === ctx.uid) ? toAsk(c, p) : undefined);
const toJudge = c => ({ ...c, phase: 'judge', votes: {}, endAt: deadline(JUDGE_S), seq: c.seq + 1 });
const ready = () => act(c => {
  if (c.phase !== 'ask' || !gUids(c).includes(ctx.uid) || (c.rdy || {})[ctx.uid]) return;
  const rdy = { ...(c.rdy || {}), [ctx.uid]: 1 };
  return gUids(c).every(u => rdy[u]) ? toJudge({ ...c, rdy }) : { ...c, rdy };
});
function reveal(c) {                                      // نقطة لكل مخمّن أصاب، ونقطة لصاحب الصندوق عن كل مخمّن أخطأ أو لم يحكم
  const hh = hOf(c), votes = c.votes || {}, pts = [...c.pts];
  guessersOf(c).forEach(i => { pts[votes[c.order[i]] === c.pick ? i : hh]++; });
  return { ...c, pts, phase: 'reveal', endAt: serverNow() + REVEAL_S * 1000, seq: c.seq + 1 };
}
const judge = v => act(c => {
  if (c.phase !== 'judge' || !gUids(c).includes(ctx.uid) || (c.votes || {})[ctx.uid]) return;
  const o = { ...c, votes: { ...(c.votes || {}), [ctx.uid]: v } };
  return gUids(o).every(u => o.votes[u]) ? reveal(o) : o;
});
const topTie = c => { const v = aliveOf(c).map(i => c.pts[i]).sort((a, b) => b - a); return v.length > 1 && v[0] === v[1]; };
function afterReveal(c) {
  const r = c.round, n = nOf(c), R = roundsFor(n);
  const more = n === 2 ? (r < R || (r === R && c.pts[0] === c.pts[1])) : (r < R || (r < R + 2 && topTie(c)));   // التعادل يُحسم بجولة فاصلة
  if (more) return { ...c, round: r + 1, phase: 'choose', pick: null, rdy: {}, votes: {}, endAt: deadline(CHOOSE_S), seq: c.seq + 1 };
  const top = aliveOf(c).sort((a, b) => c.pts[b] - c.pts[a])[0];
  return { ...c, phase: 'done', winner: n === 2 ? (c.pts[0] > c.pts[1] ? 0 : 1) : (topTie(c) ? -1 : top), seq: c.seq + 1 };
}
const timeout = seq => act(c => {
  if (c.seq !== seq || serverNow() < c.endAt - 500) return;
  if (c.phase === 'choose') return toAsk(c, Math.random() < .5 ? 'honest' : 'liar');
  if (c.phase === 'ask') return toJudge(c);
  if (c.phase === 'judge') return reveal(c);
  if (c.phase === 'reveal') return afterReveal(c);
});
// انسحاب لاعب (3-4 لاعبين): تستمر اللعبة بالباقين، وإن بقي واحد فاز
const settle = c => {
  if (c.phase === 'ask' && gUids(c).every(u => (c.rdy || {})[u])) return toJudge(c);
  if (c.phase === 'judge' && gUids(c).every(u => (c.votes || {})[u])) return reveal(c);
  return c;
};
const dropPlayer = uid => act(c => {
  if (c.phase === 'done' || !c.order.includes(uid) || (c.gone || {})[uid]) return;
  const wasH = c.order[hOf(c)] === uid, o = { ...c, gone: { ...(c.gone || {}), [uid]: 1 }, seq: c.seq + 1 }, al = aliveOf(o);
  if (al.length < 2) return { ...o, phase: 'done', winner: al.length ? al[0] : -1, forfeit: true };
  if (wasH && ['choose', 'ask', 'judge'].includes(c.phase)) return { ...o, round: c.round + 1, phase: 'choose', pick: null, rdy: {}, votes: {}, endAt: deadline(CHOOSE_S) };
  return settle(o);
});

// ===== الصندوق التفاعلي (GSAP) =====
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) gsap.globalTimeline.timeScale(10);
gsap.set('.rot', { rotationX: -18, rotationY: -26 });
gsap.set('#lid', { transformOrigin: '50% 0', rotationX: 0 });
gsap.set('#item', { xPercent: -50, yPercent: -50, opacity: 0, scale: .4, y: 40, pointerEvents: 'none' });
gsap.fromTo('.rot', { y: -760, rotationZ: -10, visibility: 'visible' }, { y: 0, rotationZ: 0, duration: 1.2, ease: 'bounce.out', delay: .1 });
gsap.from('.shadow', { opacity: 0, scale: .4, duration: .8, delay: .5 });
gsap.to('.rot', { y: -8, duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 1.6 });

let nudgeT = null;
function nudge() { if (!boxOpen) gsap.fromTo('.rot', { rotationZ: -5 }, { rotationZ: 5, duration: .09, yoyo: true, repeat: 5, ease: 'sine.inOut', onComplete: () => gsap.set('.rot', { rotationZ: 0 }) }); }
function updateNudge() {
  const need = st && st.phase === 'choose' && me === hOf(st) && !seen && !boxOpen && !reduce;
  if (need && !nudgeT) nudgeT = setInterval(nudge, 3200);
  if (!need && nudgeT) { clearInterval(nudgeT); nudgeT = null; }
}
function openBox() {
  boxOpen = true; tl?.kill(); bob?.kill();
  tl = gsap.timeline()
    .fromTo('.rot', { x: -4 }, { x: 4, duration: .05, repeat: 5, yoyo: true, ease: 'none' })
    .to('.rot', { x: 0, duration: .05 })
    .to('#lid', { rotationX: 115, duration: .6, ease: 'back.out(1.7)' })
    .fromTo('#item', { y: 40, scale: .4, opacity: 0, rotation: -10 }, { y: -225, scale: 1, opacity: 1, rotation: 0, duration: .95, ease: 'elastic.out(1,.6)',
      onStart: () => gsap.set('#item', { pointerEvents: 'auto' }),
      onComplete: () => { bob = gsap.to('#item', { y: '-=12', duration: 1.7, ease: 'sine.inOut', yoyo: true, repeat: -1 }); resetIdle(); } }, '-=.25');
}
function closeBox() {
  boxOpen = false; tl?.kill(); bob?.kill(); clearTimeout(inactivityTimer);
  gsap.set('#item', { pointerEvents: 'none' });
  tl = gsap.timeline().to('#item', { y: 40, scale: .4, opacity: 0, duration: .4, ease: 'power2.in' })
    .to('#lid', { rotationX: 0, duration: .5, ease: 'bounce.out' }, '-=.1');
}
function burst() {
  for (let i = 0; i < 22; i++) {
    const p = h('i', 'spark'), a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 130;
    $('#stage').append(p);
    gsap.fromTo(p, { x: 0, y: 0, scale: 1, opacity: 1 }, { x: Math.cos(a) * d, y: Math.sin(a) * d - 60, scale: 0, opacity: 0, delay: .5,
      duration: .9 + Math.random() * .5, ease: 'power2.out', onComplete: () => p.remove() });
  }
}

const canHold = () => st && me === hOf(st) && ['choose', 'ask', 'judge'].includes(st.phase);

const is3d = f => /\.(glb|gltf)$/i.test(f);
function setProduct(f) {                                    // .glb/.gltf يُعرض مجسماً، وغيره صورة عادية
  const url = 'images/' + encodeURIComponent(f), m = $('#m3d'), im = $('#iimg');
  m.hidden = !is3d(f); im.hidden = is3d(f);
  if (is3d(f)) { if (m.getAttribute('src') !== url) m.src = url; } else im.src = url;
}
// يعود المجسم إلى الصندوق إذا تركه اللاعب IDLE_MS دون لمس
function resetIdle() {
  clearTimeout(inactivityTimer);
  if (boxOpen && canHold()) inactivityTimer = setTimeout(() => { boxOpenedManually = false; syncBox(); }, IDLE_MS);
}
function syncBox() {
  if (!st) return;
  const want = st.phase === 'reveal' || (boxOpenedManually && canHold());
  if (want && !boxOpen) {
    setProduct(prod(st)); openBox();
    if (st.phase === 'reveal') { burst(); sfx.win(); } else sfx.turn();
  } else if (!want && boxOpen) closeBox();
}
const scene = $('#scene');
// لمسة على الصندوق تفتحه أو تغلقه، أما لمس المجسم نفسه فيدوّره ويؤخّر عودته للصندوق
scene.addEventListener('pointerdown', e => {
  if (!canHold() || e.target.closest('#item')) return;
  e.preventDefault(); boxOpenedManually = !boxOpenedManually;
  if (boxOpenedManually && !seen) { seen = true; panelKey = ''; }
  syncBox(); renderPanel(); updateNudge();
});
// تصغير المشهد تلقائياً ليبقى الصندوق والمنتج واللوحة كلها داخل الشاشة
function fit() {
  const r = scene.getBoundingClientRect();
  $('#stage').style.transform = `scale(${Math.max(.3, Math.min(1.2, r.height / 520, r.width / 340))})`;
}
new ResizeObserver(fit).observe(scene); addEventListener('resize', fit); fit();
['pointerdown', 'pointermove', 'wheel', 'touchstart'].forEach(ev => $('#item').addEventListener(ev, resetIdle, { passive: true }));
scene.addEventListener('contextmenu', e => e.preventDefault());

// ===== الواجهة =====
const nm = i => players[st.order[i]]?.name || '؟';
function startTimer() {
  stopT?.(); if (st.phase === 'done') return;
  const t = $('#t'), b = $('#tb i'), seq = st.seq, tot = (st.phase === 'ask' ? askFor(nOf(st)) : TOT[st.phase] || 10) * 1000;
  stopT = countdown(st.endAt, (l, s) => {
    if (t) t.textContent = s;
    if (b) b.style.transform = `scaleX(${Math.min(1, l / tot)})`;
    if (t && s <= 3 && s > 0 && l % 1000 < 100) sfx.tick();
  }, () => timeout(seq));
}
const sp = (txt, cls) => h('span', cls, txt);
const hd = (title, timer = true) => {                       // سطر العنوان: نص حيّ + العدّاد
  const r = h('div', 'hd'), t = h('div', 'ttl');
  t.append(...[].concat(title).map(x => (typeof x === 'string' ? document.createTextNode(x) : x))); r.append(t);
  if (timer) { const m = h('div', 'tm', '…'); m.id = 't'; r.append(m); }
  return r;
};
const acts = (...els) => { const r = h('div', 'acts'); r.append(...els); return r; };
const bar = () => { const b = h('div', 'tb'); b.id = 'tb'; b.append(h('i')); return b; };
function renderPanel() {
  if (!st) return;
  const rdy = st.rdy || {}, votes = st.votes || {};
  const key = [st.seq, st.phase, st.endAt, seen, Object.keys(rdy).length, Object.keys(votes).length].join('|');
  if (key === panelKey) return; panelKey = key;
  const p = $('#panel'), hh = hOf(st), gs = guessersOf(st), gu = gs.map(i => st.order[i]), multi = nOf(st) > 2, g = gs[0], isH = me === hh, ph = st.phase;
  p.replaceChildren();
  if (ph === 'choose') {
    if (!isH) p.append(hd([sp(`${nm(hh)} يستعد…`, 'mu')]));
    else if (!seen) p.append(hd('المس الصندوق'));
    else p.append(hd('ستكون…؟'), acts(btn('صادق 😇', 'good', () => choose('honest')), btn('كاذب 😈', 'bad', () => choose('liar'))));
  } else if (ph === 'ask') {
    const k = gu.filter(u => rdy[u]).length;
    if (isH) p.append(hd([sp(st.pick === 'honest' ? 'اخترت الصدق 😇' : 'اخترت الكذب 😈', st.pick === 'honest' ? 'ok' : 'no2')]), h('div', 'sub2', multi ? 'يسألك الجميع' : `يسألك ${nm(g)}`));
    else if (!multi) p.append(hd(`اسأل ${nm(hh)} عن المنتج`), acts(btn('انتهيت، سأحكم', 'primary', ready)));
    else if (rdy[ctx.uid]) p.append(hd([sp('جاهز ✓', 'ok')]), h('div', 'sub2', `بانتظار الباقين ${k}/${gu.length}`));
    else p.append(hd(`اسألوا ${nm(hh)} عن المنتج`), acts(btn('جاهز للتخمين', 'primary', ready)), h('div', 'sub2', `${k}/${gu.length} جاهزون`));
  } else if (ph === 'judge') {
    const k = gu.filter(u => votes[u]).length;
    if (isH) p.append(hd([sp(multi ? `الجميع يحكمون… ${k}/${gu.length}` : `${nm(g)} يحكم الآن…`, 'mu')]));
    else if (votes[ctx.uid]) p.append(hd([sp(`حكمك: ${T[votes[ctx.uid]]}`, 'mu')]), h('div', 'sub2', `${k}/${gu.length}`));
    else p.append(hd(`هل ${nm(hh)} صادق؟`), acts(btn('صادق', 'good', () => judge('honest')), btn('كاذب', 'bad', () => judge('liar'))));
  } else if (ph === 'reveal') {
    const r = h('div', 'res'), l2 = h('div', 'l2'); let l1, good;
    const lie = () => { l2.append(document.createTextNode(me === hh ? 'أنت كنت ' : `${nm(hh)} كان `), sp(T[st.pick], st.pick === 'honest' ? 'ok' : 'no2')); };
    if (!multi) {
      const okk = votes[st.order[g]] === st.pick; good = okk ? me === g : me === hh;
      // المخمِّن: «أصبت/أخطأت» ثم «اسم الخصم كان كاذب»، وصاحب الصندوق: «اسم الخصم أصاب/أخطأ» ثم «أنت كنت كاذب»
      l1 = me === g ? (okk ? 'أصبت! 🎯' : 'أخطأت ✗') : (okk ? `${nm(g)} أصاب 🎯` : `${nm(g)} أخطأ ✗`);
    } else if (isH) {
      const f = gu.filter(u => votes[u] !== st.pick).length; good = f > 0;
      l1 = f ? `خدعت ${f} من ${gu.length} 😈` : 'كشفوك كلهم 🎯';
    } else { good = votes[ctx.uid] === st.pick; l1 = good ? 'أصبت! 🎯' : 'أخطأت ✗'; }
    lie(); r.append(sp(l1, 'l1 ' + (good ? 'ok' : 'no2')), l2); p.append(r);
  } else {
    const w = st.winner, r = h('div', 'res');
    if (!multi) r.append(sp(w === me ? 'فزت! 🎉' : `فاز ${nm(w)}`, 'l1 ' + (w === me ? 'ok' : 'no2')), h('div', 'l2', `${st.pts[w]} – ${st.pts[1 - w]}`));
    else {
      const rank = st.order.map((_, i) => i).filter(i => !isGone(st, i)).sort((a, b) => st.pts[b] - st.pts[a]);
      r.append(sp(w < 0 ? 'تعادل' : w === me ? 'فزت! 🎉' : `فاز ${nm(w)}`, 'l1 ' + (w < 0 ? 'mu' : w === me ? 'ok' : 'no2')), h('div', 'l2', rank.map(i => `${nm(i)} ${st.pts[i]}`).join(' · ')));
    }
    p.append(r);
  }
  if (ph !== 'done') p.append(bar());
  if (!reduce) gsap.from(p.children, { y: 12, opacity: 0, duration: .35, stagger: .06, ease: 'power2.out' });
  startTimer();
}
function render() {
  if (!st) return;
  if (st.round !== seenRound) { seenRound = st.round; seen = false; }
  const done = st.phase === 'done', maxR = Math.max(roundsFor(nOf(st)), st.round), hh = hOf(st);
  $('#dots').replaceChildren(...Array.from({ length: maxR }, (_, i) => h('i', (i + 1 < st.round || done ? 'on' : '') + (i + 1 === st.round && !done ? ' cur' : ''))));
  $('#gp').className = 'gp' + (nOf(st) > 2 ? ' m' : '');
  $('#gp').replaceChildren(...st.order.map((_, i) => {
    const pl = h('div', 'pill' + (isGone(st, i) ? ' gone' : '')); pl.append(sp(nm(i) + (!done && i === hh ? ' 📦' : '')), h('b', '', st.pts[i]));
    if (prevPts && prevPts[i] !== st.pts[i] && !reduce) gsap.fromTo(pl, { scale: 1.25 }, { scale: 1, duration: .6, ease: 'elastic.out(1,.5)' });
    return pl;
  }));
  prevPts = [...st.pts];
  if (!canHold() && boxOpenedManually) { boxOpenedManually = false; }
  if (st.seq !== lastSeq) { lastSeq = st.seq; if (st.phase === 'choose' || st.phase === 'judge') sfx.turn(); }
  const pk = st.round + (canHold() ? 'h' : st.phase === 'judge' ? 'g' : '');
  if (pk !== preKey && /[hg]$/.test(pk)) { preKey = pk; setProduct(prod(st)); }
  syncBox(); renderPanel(); updateNudge();
  if (st.phase === 'done' && !ended) {
    ended = true; const w = st.winner;
    w === me ? sfx.win() : sfx.lose();
    if (ctx.isHost) setTimeout(() => {
      if (nOf(st) === 2) return finishGame(ctx, makeResult('win', [st.order[w], st.order[1 - w]], { pts: st.pts, ev: evBy(st.order, st.pts, 'r') }));
      const rank = aliveOf(st).sort((a, b) => st.pts[b] - st.pts[a]).map(i => st.order[i]);
      finishGame(ctx, makeResult(w < 0 ? 'draw' : 'win', rank, { pts: st.pts, ev: evBy(st.order, st.pts, 'r') }), Object.fromEntries(Object.entries(players).filter(([u]) => rank.includes(u))));
    }, 6000);
  }
}

// ===== التشغيل =====
const backToLobby = async () => { await update(roomRef(ctx.code, 'meta'), { status: 'lobby', game: null }).catch(() => {}); goLobby(ctx.code); };
try { ctx = await enterRoom(); } catch (e) { toast(e.message, 'error'); setTimeout(() => goLobby(''), 1800); throw e; }
const ids = Object.keys(ctx.players), N0 = ids.length;
// يختار مجسمات موجودة فعلاً فقط: يجمع ما في list.json مع الأرقام 1…MAX_MODELS ويتحقق من وجود كل ملف قبل اعتماده
const exists = async f => { try { const r = await fetch('images/' + encodeURIComponent(f), { method: 'HEAD', cache: 'no-store' }); return r.ok && !/html/.test(r.headers.get('content-type') || '') && +(r.headers.get('content-length') || 1000) > 100; } catch { return false; } };
async function buildDeck() {
  let list = []; try { const j = await (await fetch('images/list.json?' + Date.now())).json(); if (Array.isArray(j)) list = j.filter(x => typeof x === 'string' && x); } catch { /* نكمل بالبحث عن الأرقام */ }
  const set = new Set(list); for (let i = 1; i <= MAX_MODELS; i++) set.add(i + '.glb');
  const cand = [...set].sort(() => Math.random() - .5), deck = [];
  for (let i = 0; i < cand.length && deck.length < DECK; i += 12) {
    const part = cand.slice(i, i + 12), ok = await Promise.all(part.map(exists));
    part.forEach((f, k) => { if (ok[k] && deck.length < DECK) deck.push(f); });
  }
  return deck;
}
if (N0 < 2 || N0 > 4) { toast('اللعبة تحتاج من 2 إلى 4 لاعبين', 'error'); abortGame(ctx); }
else if (ctx.isHost) {
  try {
    const deck = await buildDeck(); if (!deck.length) throw 0;
    const others = ids.filter(i => i !== ctx.meta.host).sort((a, b) => (ctx.players[a].joinedAt || 0) - (ctx.players[b].joinedAt || 0));
    runTransaction(gameRef(ctx.code), cur => cur || { order: [ctx.meta.host, ...others], deck, round: 1, phase: 'choose', pts: ids.map(() => 0),
      endAt: deadline(CHOOSE_S), seq: 0 });
  } catch { toast('لا توجد صور أو مجسمات في games/truth-lie/images', 'error'); setTimeout(backToLobby, 2500); }
}
players = ctx.players;
const ex = N0 === 2 ? initGameExit(ctx, { isOver: () => st?.phase === 'done' })
  : initGroupExit(ctx, { isOver: () => st?.phase === 'done', onGone: u => { if (ctx.isHost) dropPlayer(u); } });
onValue(gameRef(ctx.code), s => { st = s.val(); if (st) { me = st.order.indexOf(ctx.uid); render(); } });
watchRoom(ctx.code, {
  meta: m => { if ((!m || m.status !== 'playing') && !ex.busy()) goLobby(ctx.code); },
  players: p => { players = p || players; scoreBar($('#sb'), players, scores, ctx.uid); if (st) { panelKey = ''; render(); } },
  scores: s => { scores = s || {}; scoreBar($('#sb'), players, scores, ctx.uid); }
});
</script>
</body>
</html>
