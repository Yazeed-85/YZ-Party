<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الكلمات المشفرة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
html,body{height:100%;overflow:hidden}
main{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;justify-content:flex-start;gap:8px;padding:10px 14px 14px}
@media (pointer:coarse){main{padding-bottom:58px}}
.scorebar{padding:6px 10px;flex:none}.sb{padding:5px 12px}
.ttl{font:700 1.6rem 'Reem Kufi',sans-serif;color:#fff}
.sub{color:var(--mute);font-size:.9rem;line-height:1.6;white-space:pre-line}
.ok{color:#34d399}.no2{color:#ff6b81}.am{color:var(--amber)}.mu{color:var(--mute)}
.spin{width:50px;height:50px;border-radius:50%;border:5px solid rgba(255,255,255,.12);border-top-color:var(--lagoon);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* شاشة الإعداد */
.setup{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;overflow-y:auto}
.teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:400px}
.team-col{background:rgba(0,0,0,.35);border-radius:16px;padding:12px;border:1px solid rgba(255,255,255,.06)}
.team-col h3{margin-bottom:6px;font-size:1.05rem}
.t-red{border-top:3px solid #ef4444}.t-red h3{color:#f87171}
.t-blue{border-top:3px solid #3b82f6}.t-blue h3{color:#60a5fa}
.slot{display:block;width:100%;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.22);border-radius:10px;padding:12px 8px;margin-top:8px;cursor:pointer;font:700 .85rem 'Cairo',sans-serif;color:var(--mute)}
.slot:active{transform:scale(.96)}
.slot.filled{background:rgba(255,255,255,.1);border-style:solid;color:#fff;cursor:default}
.slot.me{border-color:var(--amber);color:var(--amber);cursor:pointer}
.row2{display:flex;gap:10px;width:100%;max-width:340px}.row2 .btn{flex:1}

/* لوحة اللعب */
.game{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(0,0,0,.35);padding:8px 12px;border-radius:16px;border:1px solid var(--line);flex:none}
.score{font:700 1.3rem 'Reem Kufi',sans-serif;padding:2px 14px;border-radius:12px;min-width:48px;text-align:center}
.score.r{color:#fca5a5;background:#7f1d1d;border:2px solid #ef4444}
.score.b{color:#bfdbfe;background:#1e3a8a;border:2px solid #3b82f6}
.score.g{color:#bbf7d0;background:#14532d;border:2px solid #22c55e}
.score.t{color:var(--amber);background:rgba(255,180,84,.12);border:2px solid rgba(255,180,84,.5)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.turn-badge{padding:4px 12px;border-radius:20px;font-weight:700;font-size:.82rem;background:var(--glass);border:1px solid var(--line);text-align:center}
.turn-badge.r{background:#ef4444;color:#fff}.turn-badge.b{background:#3b82f6;color:#fff}.turn-badge.g{background:#16a34a;color:#fff}
.tm{font:700 1rem 'Reem Kufi',sans-serif;color:var(--mute)}.tm.warn{color:var(--rose)}

.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:5px;perspective:800px}
.b-card{background:#fdfbf7;border:2px solid #d0c8b6;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font:700 .82rem 'Cairo',sans-serif;color:#111;cursor:default;box-shadow:0 3px 8px rgba(0,0,0,.25);padding:2px;word-break:break-word;line-height:1.15;position:relative;min-height:0;transition:transform .15s}
.b-card.can{cursor:pointer}.b-card.can:active{transform:scale(.93)}
.b-card.rev{box-shadow:none}
.b-card.rev.red{background:#ef4444;color:#fff;border-color:#b91c1c}
.b-card.rev.blue{background:#3b82f6;color:#fff;border-color:#1d4ed8}
.b-card.rev.neutral{background:#d4d4d8;color:#555;border-color:#a1a1aa}
.b-card.rev.assassin{background:#18181b;color:#fff;border-color:#000}
.b-card.rev.green{background:#22c55e;color:#fff;border-color:#15803d}
/* رؤية القائد (فريقان) أو مفتاحك الخاص (تعاوني) */
.b-card.sp-red{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.b-card.sp-blue{background:#dbeafe;border-color:#3b82f6;color:#1e3a8a}
.b-card.sp-assassin{background:#3f3f46;border-color:#000;color:#fff}
.b-card.sp-neutral{background:#f4f4f5;color:#555}
.b-card.k-G{background:#dcfce7;border-color:#22c55e;color:#14532d}
.b-card.k-A{background:#3f3f46;border-color:#000;color:#fff}
.b-card.k-N{background:#f4f4f5;color:#555}
.b-card.tn::after{content:'✕';position:absolute;top:1px;left:4px;font-size:.7rem;color:#71717a}
.b-card.lost{outline:3px solid #ff6b81}

.dock{background:rgba(0,0,0,.5);padding:10px;border-radius:16px;border:1px solid var(--line);flex:none;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.role-chip{font-size:.78rem;color:var(--mute)}
.clue-form{display:flex;gap:8px;width:100%;max-width:380px}
.clue-form input{flex:1;min-width:0;padding:10px;border-radius:10px;font-size:1rem}
.clue-form select{background:#222;border:1px solid #444;color:#fff;padding:8px;border-radius:10px;font:inherit}
.clue-form .btn{width:auto;padding:10px 16px}
.clue-display{font:700 1.15rem 'Cairo',sans-serif;color:var(--amber);background:rgba(255,180,84,.1);padding:8px 16px;border-radius:12px;border:1px dashed var(--amber);width:100%}
.tb{height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;width:100%}
.tb i{display:block;height:100%;background:var(--lagoon);transform-origin:right}
@media (max-width:380px){.b-card{font-size:.72rem}}
</style>
</head>
<body>
<main>
  <div id="sb" class="glass scorebar"></div>
  <div id="setup" class="glass setup"><div class="spin"></div><div class="sub">جارٍ التحميل…</div></div>
  <div id="game" class="game" hidden>
    <div class="hud">
      <div id="hl" class="score"></div>
      <div class="mid"><div id="badge" class="turn-badge"></div><div id="tm" class="tm"></div></div>
      <div id="hr" class="score"></div>
    </div>
    <div id="board" class="board"></div>
    <div id="dock" class="dock"></div>
  </div>
</main>

<script type="module">
import { runTransaction, onValue, serverNow } from '../../shared/firebase.js';
import { enterRoom, watchRoom, gameRef, goLobby, abortGame } from '../../shared/room.js';
import { finishGame, makeResult } from '../../shared/result.js';
import { countdown, deadline } from '../../shared/timer.js';
import { toast, sfx, scoreBar } from '../../shared/ui.js';
import { initTeamExit } from '../../shared/leave.js';
import { WORDS } from './words.js';

// ===== إعدادات قابلة للتعديل =====
const CLUE_S = 75, GUESS_S = 100;       // وقت إعطاء التلميح ووقت التخمين
const TURNS = 9;                        // عدد أدوار الوضع التعاوني (لاعبان)
const SLOTS = ['red-spy', 'red-op', 'blue-spy', 'blue-op'];
const TEAM_AR = { red: 'الأحمر', blue: 'الأزرق' }, ROLE_AR = { spy: 'القائد', op: 'العميل' };
const INF = 9;                          // القيمة التي تعني «بلا حد» في عدد التلميح

const $ = s => document.querySelector(s);
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const btn = (txt, cls, fn) => { const b = h('button', 'btn ' + cls, txt); b.onclick = () => { sfx.click(); fn(); }; return b; };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || !window.gsap;   // بلا حركات إن مُنعت المكتبة أو فُضِّل تقليلها
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const setCh = (s, i, ch) => s.slice(0, i) + ch + s.slice(i + 1);
const normW = s => (s || '').replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '').replace(/^ال(?=.{2,})/, '');
const maxGuesses = n => (n >= INF ? 99 : n + 1);

let ctx, st = null, me = -1, players = {}, scores = {}, ended = false, stopT = null, viewKey = '', draft = { w: '', n: '1' }, prevSig = '', boardShown = false;
const nm = u => players[u]?.name || 'لاعب';
const nmI = i => nm(st?.order?.[i]);
const act = fn => runTransaction(gameRef(ctx.code, 's'), cur => (cur ? fn(cur) : undefined)).catch(() => {});

// ===== التوزيع =====
const dealWords = () => shuffle(WORDS).slice(0, 25);
function dealTeam() {                                  // 9 للفريق البادئ و8 للآخر و7 محايدة ومغتال واحد
  const start = Math.random() < .5 ? 'red' : 'blue', other = start === 'red' ? 'blue' : 'red';
  const colors = shuffle([...Array(9).fill(start), ...Array(8).fill(other), ...Array(7).fill('neutral'), 'assassin']);
  return { board: dealWords().map((w, i) => ({ w, c: colors[i], rev: false })), turn: start, left: { red: start === 'red' ? 9 : 8, blue: start === 'blue' ? 9 : 8 } };
}
function dealDuet() {                                  // لكل لاعب مفتاحه: 9 عملاء و3 مغتالين و13 محايدة، وبينهما 15 عميلاً مميزاً
  const kinds = shuffle([...Array(3).fill('GG'), ...Array(5).fill('GN'), ...Array(5).fill('NG'), 'GA', 'AG', 'AA', 'NA', 'AN', ...Array(7).fill('NN')]);
  return { words: dealWords(), keys: [kinds.map(k => k[0]).join(''), kinds.map(k => k[1]).join('')] };
}
const allFound = c => { for (let i = 0; i < 25; i++) if ((c.keys[0][i] === 'G' || c.keys[1][i] === 'G') && c.found[i] !== '1') return false; return true; };
const foundCount = c => { let n = 0; for (let i = 0; i < 25; i++) if (c.found[i] === '1') n++; return n; };

// ===== الإعداد =====
const imReady = () => act(c => {
  if (c.phase !== 'setup' || c.mode !== 'duet' || me < 0) return;
  const rd = [...(c.rd || [0, 0])]; rd[me] = 1;
  if (!(rd[0] && rd[1])) return { ...c, rd, seq: c.seq + 1 };
  return { ...c, rd, phase: 'play', ...dealDuet(), found: '0'.repeat(25), touch: '0'.repeat(25), giver: 0, tPhase: 'clue', turnsLeft: TURNS,
    clue: { w: '', n: 0 }, guesses: 0, endAt: deadline(CLUE_S), seq: c.seq + 1 };
});
const takeSlot = slot => act(c => {
  if (c.phase !== 'setup' || c.mode !== 'team' || !SLOTS.includes(slot) || !c.order.includes(ctx.uid)) return;
  const teams = { ...(c.teams || {}) };
  if (teams[slot] && teams[slot] !== ctx.uid) return;                 // المقعد مشغول
  const mine = teams[slot] === ctx.uid;
  for (const k of Object.keys(teams)) if (teams[k] === ctx.uid) delete teams[k];
  if (!mine) teams[slot] = ctx.uid;                                   // الضغط على مقعدك يخلّيه
  return { ...c, teams, seq: c.seq + 1 };
});
const autoAssign = () => act(c => {
  if (c.phase !== 'setup' || c.mode !== 'team' || c.order[0] !== ctx.uid) return;
  const o = shuffle(c.order), teams = {}; SLOTS.forEach((s, i) => { teams[s] = o[i]; });
  return { ...c, teams, seq: c.seq + 1 };
});
const startTeam = () => act(c => {
  if (c.phase !== 'setup' || c.mode !== 'team' || c.order[0] !== ctx.uid) return;
  const t = c.teams || {}, vals = SLOTS.map(s => t[s]);
  if (vals.some(v => !v) || new Set(vals).size !== 4 || !vals.every(v => c.order.includes(v))) return;
  const d = dealTeam();
  return { ...c, phase: 'play', board: d.board, turn: d.turn, left: d.left, tPhase: 'spy', clue: { w: '', n: 0 }, guesses: 0, endAt: deadline(CLUE_S), seq: c.seq + 1 };
});

// ===== قواعد اللعب =====
const other = t => (t === 'red' ? 'blue' : 'red');
const teamTurnEnd = c => ({ ...c, turn: other(c.turn), tPhase: 'spy', clue: { w: '', n: 0 }, guesses: 0, endAt: deadline(CLUE_S), seq: c.seq + 1 });
function duetTurnEnd(c, extra = {}) {                  // كل دور ينتهي يستهلك رمزاً، وإن نفدت الرموز دون إكمال العملاء تخسرون
  const o = { ...c, ...extra }, left = c.turnsLeft - 1;
  if (left <= 0) return { ...o, turnsLeft: 0, phase: 'done', win: false, reason: 'انتهت الأدوار قبل أن تكتشفا كل العملاء', seq: c.seq + 1 };
  return { ...o, turnsLeft: left, giver: 1 - c.giver, tPhase: 'clue', clue: { w: '', n: 0 }, guesses: 0, endAt: deadline(CLUE_S), seq: c.seq + 1 };
}
const clueOk = (c, w) => {
  if (!w || w.length > 20 || /\s/.test(w)) return false;
  const n = normW(w); if (n.length < 2) return false;
  const words = c.mode === 'duet' ? c.words.filter((_, i) => c.found[i] !== '1') : c.board.filter(x => !x.rev).map(x => x.w);
  return !words.some(x => { const m = normW(x); return m === n || (n.length >= 3 && m.length >= 3 && (m.includes(n) || n.includes(m))); });
};
const submitClue = (w, n) => act(c => {
  if (c.phase !== 'play' || !clueOk(c, w) || !(n >= 1 && n <= INF)) return;
  if (c.mode === 'duet') { if (c.tPhase !== 'clue' || c.order[c.giver] !== ctx.uid) return; }
  else if (c.tPhase !== 'spy' || c.teams[`${c.turn}-spy`] !== ctx.uid) return;
  return { ...c, tPhase: c.mode === 'duet' ? 'guess' : 'op', clue: { w, n }, guesses: 0, endAt: deadline(GUESS_S), seq: c.seq + 1 };
});
const passTurn = () => act(c => {
  if (c.phase !== 'play') return;
  if (c.mode === 'duet') { if (c.tPhase !== 'guess' || c.order[1 - c.giver] !== ctx.uid) return; return duetTurnEnd(c); }
  if (c.tPhase !== 'op' || c.teams[`${c.turn}-op`] !== ctx.uid) return;
  return teamTurnEnd(c);
});
const pick = idx => act(c => {
  if (c.phase !== 'play' || !Number.isInteger(idx) || idx < 0 || idx > 24) return;
  if (c.mode === 'duet') {
    if (c.tPhase !== 'guess' || c.order[1 - c.giver] !== ctx.uid || c.found[idx] === '1' || (+c.touch[idx] & (1 << c.giver))) return;
    const k = c.keys[c.giver][idx];
    if (k === 'A') return { ...c, phase: 'done', win: false, lostIdx: idx, reason: 'لمستما مغتالاً!', seq: c.seq + 1 };
    if (k === 'N') return duetTurnEnd(c, { touch: setCh(c.touch, idx, String(+c.touch[idx] | (1 << c.giver))) });
    const o = { ...c, found: setCh(c.found, idx, '1'), guesses: (c.guesses || 0) + 1 };
    if (allFound(o)) return { ...o, phase: 'done', win: true, reason: 'اكتشفتما كل العملاء!', seq: c.seq + 1 };
    return (o.guesses >= maxGuesses(c.clue.n)) ? duetTurnEnd(o) : { ...o, endAt: deadline(GUESS_S), seq: c.seq + 1 };
  }
  if (c.tPhase !== 'op' || c.teams[`${c.turn}-op`] !== ctx.uid || c.board[idx].rev) return;
  const board = c.board.map((x, i) => (i === idx ? { ...x, rev: true } : x)), card = board[idx], left = { ...c.left };
  if (card.c === 'assassin') return { ...c, board, phase: 'done', winner: other(c.turn), reason: `لمس فريق ${TEAM_AR[c.turn]} المغتال!`, seq: c.seq + 1 };
  if (card.c === 'red' || card.c === 'blue') left[card.c]--;
  if (left.red === 0) return { ...c, board, left, phase: 'done', winner: 'red', reason: 'اكتشف الفريق الأحمر كل عملائه!', seq: c.seq + 1 };
  if (left.blue === 0) return { ...c, board, left, phase: 'done', winner: 'blue', reason: 'اكتشف الفريق الأزرق كل عملائه!', seq: c.seq + 1 };
  const o = { ...c, board, left, guesses: (c.guesses || 0) + 1 };
  if (card.c !== c.turn || o.guesses >= maxGuesses(c.clue.n)) return teamTurnEnd(o);   // أخطأت أو استنفدت التخمينات
  return { ...o, endAt: deadline(GUESS_S), seq: c.seq + 1 };
});
const onTimeout = seq => act(c => {
  if (c.seq !== seq || c.phase !== 'play' || serverNow() < c.endAt - 500) return;
  return c.mode === 'duet' ? duetTurnEnd(c) : teamTurnEnd(c);
});

// ===== الواجهة =====
const myTeamRole = () => { const e = Object.entries(st.teams || {}).find(([, v]) => v === ctx.uid); return e ? e[0].split('-') : [null, null]; };

function startTimer() {
  stopT?.(); stopT = null;
  const t = $('#tm'); if (!st || st.phase !== 'play') { if (t) t.textContent = ''; return; }
  const seq = st.seq, tot = (st.tPhase === 'clue' || st.tPhase === 'spy' ? CLUE_S : GUESS_S) * 1000;
  stopT = countdown(st.endAt, (l, s) => { t.textContent = '⏱ ' + s; t.classList.toggle('warn', s <= 10); const b = $('#tb i'); if (b) b.style.transform = `scaleX(${Math.min(1, l / tot)})`; if (s <= 3 && s > 0 && l % 1000 < 100) sfx.tick(); }, () => onTimeout(seq));
}

function renderSetup() {
  const S = $('#setup'); S.replaceChildren();
  if (st.mode === 'duet') {
    S.append(h('div', 'ttl', 'الكلمات المشفرة 🕵️‍♂️'),
      h('div', 'sub', `تعاون بين لاعبين: كل منكما يرى مفتاحه السري فقط.\nتتناوبان إعطاء التلميح (كلمة واحدة + رقم) ويخمّن الآخر.\nاكتشفا 15 عميلاً خلال ${TURNS} أدوار، واحذرا المغتالين!`));
    if (st.rd?.[me]) S.append(h('div', 'spin'), h('div', 'sub', `بانتظار ${nmI(1 - me)}…`));
    else S.append(btn('جاهز للمهمة 🕵️‍♂️', 'primary', imReady));
    return;
  }
  const t = st.teams || {}, isHost = st.order[0] === ctx.uid;
  S.append(h('div', 'ttl', 'الكلمات المشفرة 🕵️‍♂️'), h('div', 'sub', 'فريقان، ولكل فريق قائد يعطي التلميحات وعميل يخمّن.\nاختر مقعدك (المس مقعدك مرة أخرى لإخلائه).'));
  const grid = h('div', 'teams-grid');
  for (const team of ['red', 'blue']) {
    const col = h('div', 'team-col t-' + team); col.append(h('h3', '', 'الفريق ' + TEAM_AR[team]));
    for (const role of ['spy', 'op']) {
      const slot = `${team}-${role}`, u = t[slot], b = h('button', 'slot' + (u ? ' filled' : '') + (u === ctx.uid ? ' me' : ''));
      b.textContent = u ? `${role === 'spy' ? '🕵️‍♂️' : '🏃‍♂️'} ${nm(u)}` : `${ROLE_AR[role]} (اضغط)`;
      b.onclick = () => { sfx.click(); takeSlot(slot); };
      col.append(b);
    }
    grid.append(col);
  }
  S.append(grid);
  const full = SLOTS.every(s => t[s]) && new Set(SLOTS.map(s => t[s])).size === 4;
  if (isHost) {
    const row = h('div', 'row2'); const a = btn('🎲 توزيع عشوائي', 'ghost', autoAssign), s = btn('🚀 ابدأ', 'primary', startTeam); s.disabled = !full;
    row.append(a, s); S.append(row);
    S.append(h('div', 'sub am', full ? 'الفرق مكتملة، اضغط ابدأ!' : 'يجب أن يأخذ كل لاعب مقعداً مختلفاً'));
  } else S.append(h('div', 'sub am', full ? `بانتظار ${nmI(0)} ليبدأ…` : 'اختر مقعدك وانتظر البقية…'));
}

function cardEls() {
  const duet = st.mode === 'duet', done = st.phase === 'done', [mt, mr] = duet ? [null, null] : myTeamRole();
  const canPick = st.phase === 'play' && (duet ? st.tPhase === 'guess' && st.order[1 - st.giver] === ctx.uid : st.tPhase === 'op' && st.teams[`${st.turn}-op`] === ctx.uid);
  return Array.from({ length: 25 }, (_, i) => {
    const e = h('div', 'b-card');
    if (duet) {
      e.textContent = st.words[i];
      const fnd = st.found[i] === '1', tb = +st.touch[i];
      if (fnd) e.classList.add('rev', 'green'); else e.classList.add('k-' + st.keys[me][i]);
      if (!fnd && tb) e.classList.add('tn');
      if (st.lostIdx === i) e.classList.add('lost');
      if (canPick && !fnd && !(tb & (1 << st.giver))) { e.classList.add('can'); e.onclick = () => pick(i); }
    } else {
      const c = st.board[i]; e.textContent = c.w;
      if (c.rev) e.classList.add('rev', c.c); else if (mr === 'spy' || done) e.classList.add('sp-' + c.c);
      if (canPick && !c.rev) { e.classList.add('can'); e.onclick = () => pick(i); }
    }
    return e;
  });
}

function renderDock() {
  const D = $('#dock'), duet = st.mode === 'duet', done = st.phase === 'done'; D.replaceChildren();
  if (done) {
    const win = duet ? st.win : myTeamRole()[0] === st.winner;
    D.append(h('div', 'ttl ' + (win ? 'ok' : 'no2'), duet ? (st.win ? 'نجحت المهمة! 🎉' : 'فشلت المهمة 💥') : `فاز الفريق ${TEAM_AR[st.winner]} ${st.winner === 'red' ? '🔴' : '🔵'}`), h('div', 'sub', st.reason || ''));
    return;
  }
  const giverTurn = duet ? (st.tPhase === 'clue') : (st.tPhase === 'spy');
  const iGive = duet ? giverTurn && st.order[st.giver] === ctx.uid : giverTurn && st.teams[`${st.turn}-spy`] === ctx.uid;
  const iGuess = duet ? !giverTurn && st.order[1 - st.giver] === ctx.uid : !giverTurn && st.teams[`${st.turn}-op`] === ctx.uid;
  if (!duet) { const [mt, mr] = myTeamRole(); D.append(h('div', 'role-chip', `أنت: ${ROLE_AR[mr]} · الفريق ${TEAM_AR[mt]}`)); }
  if (iGive) {
    const f = h('div', 'clue-form'), inp = h('input'), sel = h('select'), go = btn('إرسال', 'primary', () => {
      const w = inp.value.trim(), n = +sel.value;
      if (!clueOk(st, w)) { sfx.error(); return toast('تلميح غير صالح: كلمة واحدة، وليست من كلمات اللوح', 'error'); }
      submitClue(w, n); draft = { w: '', n: '1' };
    });
    inp.placeholder = 'كلمة واحدة فقط…'; inp.maxLength = 20; inp.autocomplete = 'off'; inp.value = draft.w;
    inp.oninput = () => { draft.w = inp.value; }; inp.onkeydown = e => { if (e.key === 'Enter') go.click(); };
    [1, 2, 3, 4, 5].forEach(n => sel.append(new Option(n, n))); sel.append(new Option('∞', INF)); sel.value = draft.n; sel.onchange = () => { draft.n = sel.value; };
    f.append(inp, sel, go); D.append(h('div', 'sub am', 'دورك لإعطاء التلميح'), f);
  } else if (giverTurn) {
    D.append(h('div', 'sub', duet ? `⏳ ${nmI(st.giver)} يكتب تلميحاً…` : `⏳ قائد الفريق ${TEAM_AR[st.turn]} يكتب تلميحاً…`));
  } else {
    D.append(h('div', 'clue-display', `التلميح: ${st.clue.w} (${st.clue.n >= INF ? '∞' : st.clue.n})`));
    const used = st.guesses || 0, cap = maxGuesses(st.clue.n);
    if (iGuess) { D.append(h('div', 'sub', cap > 50 ? 'خمّن ما تشاء، أو أنهِ الدور' : `تخمينات متبقية: ${cap - used}`), btn('إنهاء التخمين ⏭', 'ghost', passTurn)); }
    else D.append(h('div', 'sub', duet ? `${nmI(1 - st.giver)} يخمّن…` : `فريق ${TEAM_AR[st.turn]} يخمّن…`));
  }
  const tb = h('div', 'tb'); tb.id = 'tb'; tb.append(h('i')); D.append(tb);
}

function renderPlay() {
  const duet = st.mode === 'duet', done = st.phase === 'done';
  const hl = $('#hl'), hr = $('#hr'), bd = $('#badge');
  if (duet) {
    hl.className = 'score g'; hl.textContent = `🎯 ${foundCount(st)}/15`; hr.className = 'score t'; hr.textContent = `⏳ ${st.turnsLeft}`;
    bd.className = 'turn-badge ' + (done ? '' : 'g'); bd.textContent = done ? 'انتهت المهمة' : (st.tPhase === 'clue' ? `🕵️‍♂️ ${nmI(st.giver)} يعطي تلميحاً` : `🏃‍♂️ ${nmI(1 - st.giver)} يخمّن`);
  } else {
    hl.className = 'score r'; hl.textContent = st.left.red; hr.className = 'score b'; hr.textContent = st.left.blue;
    bd.className = 'turn-badge ' + (done ? '' : st.turn === 'red' ? 'r' : 'b');
    bd.textContent = done ? 'انتهت اللعبة' : (st.tPhase === 'spy' ? `🕵️‍♂️ قائد ${TEAM_AR[st.turn]} يكتب تلميحاً` : `🏃‍♂️ عميل ${TEAM_AR[st.turn]} يخمّن`);
  }
  const B = $('#board'); B.replaceChildren(...cardEls());
  if (!boardShown && !reduce && window.gsap) gsap.from(B.children, { rotationY: 90, opacity: 0, duration: .4, stagger: .02, ease: 'back.out' });
  boardShown = true;
  renderDock(); startTimer();
}

function render() {
  if (!st) return;
  me = st.order.indexOf(ctx.uid);
  const sig = st.order.map(nmI).join('|'), key = [st.seq, st.phase, sig].join('|');
  if (key === viewKey) return;
  const was = viewKey; viewKey = key;
  const play = st.phase === 'play' || st.phase === 'done';
  $('#setup').hidden = play; $('#game').hidden = !play;
  if (!play) renderSetup(); else { renderPlay(); if (was && prevSig === sig) sfx.click(); }
  prevSig = sig;
  if (st.phase === 'done' && !ended) {
    ended = true; stopT?.();
    const duet = st.mode === 'duet', win = duet ? st.win : myTeamRole()[0] === st.winner;
    win ? sfx.win() : sfx.lose();
    if (ctx.isHost) setTimeout(() => {
      if (duet) {
        const bonus = st.win ? (st.turnsLeft >= 4 ? 2 : st.turnsLeft >= 2 ? 1 : 0) : 0;
        finishGame(ctx, makeResult(st.win ? 'coop-win' : 'coop-lose', st.order, { turnsLeft: st.turnsLeft, bonus }));
      } else {
        const winners = Object.entries(st.teams).filter(([k]) => k.startsWith(st.winner + '-')).map(([, v]) => v);
        finishGame(ctx, makeResult('team-win', winners, { winner: st.winner }));
      }
    }, 6000);
  }
}

// ===== التشغيل =====
try { ctx = await enterRoom(); } catch (e) { toast(e.message, 'error'); setTimeout(() => goLobby(''), 1800); throw e; }
const ids = Object.keys(ctx.players || {});
if (ids.length !== 2 && ids.length !== 4) { toast('اللعبة تحتاج لاعبين أو أربعة', 'error'); abortGame(ctx); }
else {
  if (ctx.isHost) {
    const order = [ctx.meta.host, ...ids.filter(i => i !== ctx.meta.host)];
    runTransaction(gameRef(ctx.code, 's'), cur => cur || { mode: ids.length === 2 ? 'duet' : 'team', order, phase: 'setup', teams: {}, rd: [0, 0], seq: 0 });
  }
  players = ctx.players;
  const ex = initTeamExit(ctx, {
    isOver: () => st?.phase === 'done',
    onGone: () => stopT?.(),
    resolve: u => {                                       // انسحاب أثناء لعب الفريقين: يخسر فريق المنسحب ويُحتسب الفوز للآخر
      if (!st || st.phase !== 'play' || st.mode !== 'team') return null;
      const e = Object.entries(st.teams || {}).find(([, v]) => v === u); if (!e) return null;
      const win = other(e[0].split('-')[0]), winners = Object.entries(st.teams).filter(([k]) => k.startsWith(win + '-')).map(([, v]) => v);
      return { result: makeResult('team-win', winners, { forfeit: true }), sub: `فاز الفريق ${TEAM_AR[win]}` };
    }
  });
  onValue(gameRef(ctx.code, 's'), s => { st = s.val(); render(); });
  watchRoom(ctx.code, {
    meta: m => { if ((!m || m.status !== 'playing') && !ex.busy()) goLobby(ctx.code); },
    players: p => { players = p || players; scoreBar($('#sb'), players, scores, ctx.uid); if (st) render(); },
    scores: s => { scores = s || {}; scoreBar($('#sb'), players, scores, ctx.uid); }
  });
}
</script>
</body>
</html>
