<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الأسماء المشفرة - Codenames</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
html,body{height:100%;overflow:hidden;background-color:#0d1117;}
main{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 14px 14px}

.scorebar{padding:6px 10px;flex:none;z-index:2}

/* شاشة اللوبي */
.lobby-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;background:rgba(15,20,30,0.85);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.5);overflow-y:auto}
.ttl{font:900 1.8rem 'Reem Kufi',sans-serif;color:white;text-shadow:0 0 15px rgba(255,255,255,0.2)}
.sub{color:var(--mute);font-size:.9rem}

.teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:400px;margin-top:10px}
.team-col{background:rgba(0,0,0,0.4);border-radius:16px;padding:12px;border:1px solid rgba(255,255,255,0.05)}
.t-red{border-top:3px solid #ef4444;box-shadow:inset 0 15px 30px -15px rgba(239,68,68,0.2)}
.t-blue{border-top:3px solid #3b82f6;box-shadow:inset 0 15px 30px -15px rgba(59,130,246,0.2)}

.slot{background:rgba(255,255,255,0.05);border:1px dashed rgba(255,255,255,0.2);border-radius:10px;padding:12px 8px;margin-top:8px;cursor:pointer;transition:0.2s;font-size:0.85rem;font-weight:700;color:var(--mute)}
.slot:active{transform:scale(0.95)}
.slot.filled{background:rgba(255,255,255,0.1);border-style:solid;color:white}
.slot.me{border-color:var(--amber);box-shadow:0 0 15px rgba(251,191,36,0.2);color:var(--amber)}

/* لوحة اللعب */
.game-area{flex:1;display:none;flex-direction:column;gap:10px;min-height:0}
.top-hud{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.4);padding:10px 15px;border-radius:16px;border:1px solid rgba(255,255,255,0.05);flex:none}
.score{font:900 1.5rem 'Cairo';padding:4px 16px;border-radius:12px}
.score.r{color:#fca5a5;background:#7f1d1d;border:2px solid #ef4444}
.score.b{color:#bfdbfe;background:#1e3a8a;border:2px solid #3b82f6}
.turn-badge{background:var(--glass);padding:6px 15px;border-radius:20px;font-weight:700;font-size:0.9rem;border:1px solid var(--line)}
.turn-badge.r{background:#ef4444;color:white}
.turn-badge.b{background:#3b82f6;color:white}

.board{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-content:center;perspective:800px}
.b-card{background:#fdfbf7;border:2px solid #d0c8b6;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font:700 0.85rem 'Cairo';color:#111;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.2);padding:2px;word-break:break-word;transition:transform 0.2s}
.b-card:active{transform:scale(0.92)}
.b-card.rev{pointer-events:none;box-shadow:none}
.b-card.rev.red{background:#ef4444;color:white;border-color:#b91c1c}
.b-card.rev.blue{background:#3b82f6;color:white;border-color:#1d4ed8}
.b-card.rev.neutral{background:#d4d4d8;color:#555;border-color:#a1a1aa}
.b-card.rev.assassin{background:#18181b;color:white;border-color:#000}

/* رؤية القائد (Spymaster) */
.view-spy .b-card:not(.rev).red{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.view-spy .b-card:not(.rev).blue{background:#dbeafe;border-color:#3b82f6;color:#1e3a8a}
.view-spy .b-card:not(.rev).assassin{background:#3f3f46;border-color:#000;color:#fff}
.view-spy .b-card:not(.rev).neutral{background:#f4f4f5;color:#555}

/* لوحة التحكم السفلية */
.bottom-dock{background:rgba(0,0,0,0.6);padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,0.05);flex:none;display:flex;flex-direction:column;gap:10px;align-items:center}
.clue-form{display:flex;gap:8px;width:100%;max-width:350px}
.clue-form input{flex:1;background:#222;border:1px solid #444;color:white;padding:10px;border-radius:10px;font-family:'Cairo';outline:none}
.clue-form select{background:#222;border:1px solid #444;color:white;padding:10px;border-radius:10px;outline:none}
.clue-display{font:900 1.2rem 'Cairo';color:var(--amber);background:rgba(251,191,36,0.1);padding:8px 20px;border-radius:12px;border:1px dashed var(--amber);width:100%;text-align:center}

@media (max-width:380px){ .b-card{font-size:0.75rem;} .top-hud{padding:8px;} }
</style>
</head>
<body>
<main>
  <div id="sb" class="glass scorebar"></div>

  <!-- شاشة اللوبي -->
  <div id="lobby" class="lobby-card">
    <div>
      <div class="ttl">الأسماء المشفرة 🕵️‍♂️</div>
      <div class="sub">اختر دورك (تتطلب 4 لاعبين)</div>
    </div>
    
    <div class="teams-grid">
      <div class="team-col t-red">
        <h3 style="color:#f87171;margin-bottom:5px;font-size:1.1rem">الفريق الأحمر</h3>
        <div id="slot-red-spy" class="slot" onclick="joinSlot('red','spy')">القائد (اضغط)</div>
        <div id="slot-red-op" class="slot" onclick="joinSlot('red','op')">العميل (اضغط)</div>
      </div>
      <div class="team-col t-blue">
        <h3 style="color:#60a5fa;margin-bottom:5px;font-size:1.1rem">الفريق الأزرق</h3>
        <div id="slot-blue-spy" class="slot" onclick="joinSlot('blue','spy')">القائد (اضغط)</div>
        <div id="slot-blue-op" class="slot" onclick="joinSlot('blue','op')">العميل (اضغط)</div>
      </div>
    </div>
    
    <button id="btnStart" class="btn primary" style="width:100%;max-width:300px;margin-top:10px;opacity:0.5" disabled onclick="startGame()">🚀 بدء اللعبة</button>
    <div id="waitText" class="sub am" style="font-weight:bold">في انتظار اكتمال 4 لاعبين...</div>
  </div>

  <!-- شاشة اللعب -->
  <div id="game" class="game-area">
    <div class="top-hud">
      <div id="scoreRed" class="score r">0</div>
      <div id="turnBadge" class="turn-badge">جاري التحميل...</div>
      <div id="scoreBlue" class="score b">0</div>
    </div>
    <div id="board" class="board"></div>
    <div id="dock" class="bottom-dock"></div>
  </div>

  <!-- شاشة النهاية -->
  <div id="done" class="lobby-card" style="display:none">
    <div id="winBadge" style="font-size:4rem">🏆</div>
    <div id="winText" class="ttl">انتهت اللعبة!</div>
    <div id="winReason" class="sub"></div>
  </div>
</main>

<script type="module">
import { runTransaction, onValue, update } from '../../shared/firebase.js';
import * as RoomMod from '../../shared/room.js';
import { finishGame, makeResult } from '../../shared/result.js';
import { toast, sfx, scoreBar } from '../../shared/ui.js';
import * as LeaveMod from '../../shared/leave.js';

const { enterRoom, watchRoom, gameRef, roomRef, goLobby } = RoomMod;
const $ = s => document.querySelector(s);
const h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const btn = (txt, cls, fn) => { const b = h('button', 'btn ' + cls, txt); b.onclick = () => { sfx.click(); fn(); }; return b; };

const WORDS = ["تفاح","موز","أسد","نمر","سيارة","طيارة","شمس","قمر","نجم","بحر","نهر","جبل","نار","ثلج","ملك","أميرة","سيف","درع","قلعة","خيمة","مستشفى","مدرسة","طبيب","معلم","كتاب","قلم","ساعة","باب","شباك","كرسي","طاولة","حاسوب","هاتف","صورة","لون","شجرة","وردة","عشب","جذر","سماء","أرض","هواء","رياح","عاصفة","مطر","قطة","كلب","حصان","جمل","عصفور"];

let ctx, st = null, players = {}, scores = {}, ended = false;
let boardHtml = '';

const nm = uid => players[uid]?.name || 'لاعب';
const act = fn => runTransaction(gameRef(ctx.code, 's'), cur => (cur ? fn(cur) : undefined)).catch(() => {});

window.joinSlot = (team, role) => act(c => {
  if (c.phase !== 'ready') return;
  const teams = c.teams || {};
  for(let key in teams) { if(teams[key] === ctx.uid) delete teams[key]; }
  teams[`${team}-${role}`] = ctx.uid;
  return { ...c, teams, seq: c.seq + 1 };
});

window.startGame = () => act(c => {
  if (c.phase !== 'ready') return;
  const pIds = Object.keys(players);
  if (pIds.length < 4 || Object.keys(c.teams||{}).length !== 4) return;

  let shf = [...WORDS].sort(() => 0.5 - Math.random()).slice(0, 25);
  let startTeam = Math.random() > 0.5 ? 'red' : 'blue';
  let colors = [...Array(9).fill(startTeam), ...Array(8).fill(startTeam==='red'?'blue':'red'), ...Array(7).fill('neutral'), 'assassin'].sort(() => 0.5 - Math.random());
  let board = shf.map((w, i) => ({ word: w, color: colors[i], rev: false }));

  return {
    ...c, phase: 'play', board, 
    turn: startTeam, tPhase: 'spy', 
    clue: {w:'', n:0}, 
    sRed: startTeam==='red'?9:8, sBlue: startTeam==='blue'?9:8,
    seq: c.seq + 1
  };
});

window.submitClue = () => {
  const w = $('#clueWord').value.trim();
  const n = parseInt($('#clueNum').value);
  if(!w || !n) return toast('اكتب الكلمة واختر الرقم','error');
  act(c => {
    if(c.phase !== 'play' || c.tPhase !== 'spy' || c.teams[`${c.turn}-spy`] !== ctx.uid) return;
    return { ...c, tPhase: 'op', clue: {w, n}, seq: c.seq + 1 };
  });
};

window.endTurn = () => act(c => {
  if(c.phase !== 'play' || c.tPhase !== 'op' || c.teams[`${c.turn}-op`] !== ctx.uid) return;
  return { ...c, turn: c.turn==='red'?'blue':'red', tPhase: 'spy', clue: {w:'', n:0}, seq: c.seq + 1 };
});

window.clickCard = (idx) => act(c => {
  if(c.phase !== 'play' || c.tPhase !== 'op' || c.teams[`${c.turn}-op`] !== ctx.uid || c.board[idx].rev) return;
  
  const nb = [...c.board];
  const card = nb[idx];
  card.rev = true;

  let sr = c.sRed, sb = c.sBlue;
  let nextPhase = c.tPhase, nextTurn = c.turn;

  if (card.color === 'assassin') {
    const winner = c.turn === 'red' ? 'blue' : 'red';
    return { ...c, phase: 'done', board: nb, winner, reason: `لمس المغتال! خسر الفريق ${c.turn==='red'?'الأحمر':'الأزرق'}`, seq: c.seq+1 };
  }

  if (card.color === 'red') sr--;
  if (card.color === 'blue') sb--;

  if (sr === 0) return { ...c, phase: 'done', board: nb, sRed: sr, winner: 'red', reason: 'اكتشف الفريق الأحمر عملاءه!', seq: c.seq+1 };
  if (sb === 0) return { ...c, phase: 'done', board: nb, sBlue: sb, winner: 'blue', reason: 'اكتشف الفريق الأزرق عملاءه!', seq: c.seq+1 };

  if (card.color !== c.turn) {
    nextTurn = c.turn === 'red' ? 'blue' : 'red';
    nextPhase = 'spy';
  }

  return { ...c, board: nb, sRed: sr, sBlue: sb, turn: nextTurn, tPhase: nextPhase, clue: nextPhase==='spy'?{w:'',n:0}:c.clue, seq: c.seq+1 };
});

function renderLobby() {
  const tms = st.teams || {};
  const isFull = Object.keys(tms).length === 4 && Object.keys(players).length >= 4;
  
  ['red-spy','red-op','blue-spy','blue-op'].forEach(slot => {
    const el = $(`#slot-${slot}`);
    if(tms[slot]) {
      el.className = 'slot filled' + (tms[slot] === ctx.uid ? ' me' : '');
      el.innerHTML = `${slot.includes('spy')?'🕵️‍♂️':'🏃‍♂️'} ${nm(tms[slot])}`;
    } else {
      el.className = 'slot';
      el.innerHTML = `${slot.includes('spy')?'القائد':'العميل'} (اضغط للانضمام)`;
    }
  });

  const btn = $('#btnStart');
  if(ctx.isHost) {
    btn.style.display = 'block';
    if(isFull) { btn.disabled=false; btn.style.opacity='1'; $('#waitText').innerText='الفرق مكتملة، اضغط للبدء!'; }
    else { btn.disabled=true; btn.style.opacity='0.5'; $('#waitText').innerText=`تحتاج 4 لاعبين لأخذ أدوارهم (حاليا: ${Object.keys(players).length})`; }
  } else {
    btn.style.display = 'none';
    $('#waitText').innerText = isFull ? 'في انتظار الهوست للبدء...' : 'اختر دورك وانتظر البقية...';
  }
}

function renderPlay() {
  const myRoleObj = Object.entries(st.teams).find(([k, v]) => v === ctx.uid);
  const myTeam = myRoleObj ? myRoleObj[0].split('-')[0] : 'spectator';
  const myRole = myRoleObj ? myRoleObj[0].split('-')[1] : 'spectator';

  $('#scoreRed').innerText = st.sRed;
  $('#scoreBlue').innerText = st.sBlue;
  
  const tb = $('#turnBadge');
  tb.className = `turn-badge ${st.turn === 'red' ? 'r' : 'b'}`;
  tb.innerText = st.tPhase === 'spy' 
    ? `🕵️‍♂️ قائد ${st.turn==='red'?'الأحمر':'الأزرق'} يكتب تلميحاً` 
    : `🏃‍♂️ عميل ${st.turn==='red'?'الأحمر':'الأزرق'} يخمن`;

  const newBoardHtml = st.board.map((c, i) => `<div class="b-card ${c.rev ? 'rev '+c.color : c.color}" onclick="clickCard(${i})">${c.word}</div>`).join('');
  if (boardHtml !== newBoardHtml) {
    boardHtml = newBoardHtml;
    const b = $('#board');
    b.innerHTML = boardHtml;
    b.className = `board ${myRole === 'spy' ? 'view-spy' : ''}`;
    gsap.from(b.children, {rotationY:90, opacity:0, duration:0.4, stagger:0.02, ease:'back.out'});
  }

  const dock = $('#dock');
  dock.replaceChildren();
  
  if (st.tPhase === 'spy' && myRole === 'spy' && myTeam === st.turn) {
    const f = h('div', 'clue-form');
    f.innerHTML = `<input type="text" id="clueWord" placeholder="كلمة واحدة فقط..." autocomplete="off">
                   <select id="clueNum"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="9">∞</option></select>`;
    f.append(btn('إرسال', 'primary', submitClue));
    dock.append(f);
  } else if (st.tPhase === 'op') {
    dock.append(h('div', 'clue-display', `التلميح: ${st.clue.w} (${st.clue.n === 9 ? '∞' : st.clue.n})`));
    if (myRole === 'op' && myTeam === st.turn) {
      dock.append(btn('إنهاء التخمين (Pass)', 'ghost', endTurn));
    }
  } else {
    dock.append(h('div', 'sub', 'راقب اللعب واستنتج...'));
  }
}

function render() {
  if (!st) return;
  const p = st.phase;

  if (p === 'ready') { $('#lobby').style.display='flex'; $('#game').style.display='none'; $('#done').style.display='none'; renderLobby(); }
  else if (p === 'play') { $('#lobby').style.display='none'; $('#game').style.display='flex'; $('#done').style.display='none'; renderPlay(); }
  else if (p === 'done') {
    $('#game').style.display='none'; $('#done').style.display='flex';
    $('#winBadge').innerText = '🏆';
    const wt = $('#winText');
    wt.className = `ttl ${st.winner==='red'?'no':'b'}`;
    wt.innerText = `فاز الفريق ${st.winner==='red'?'الأحمر 🔴':'الأزرق 🔵'}!`;
    $('#winReason').innerText = st.reason;
    
    if (!ended) {
      ended = true;
      const myTeam = Object.entries(st.teams).find(([k,v]) => v === ctx.uid)?.[0].split('-')[0];
      const isWin = myTeam === st.winner;
      isWin ? sfx.win() : sfx.lose();
      if (ctx.isHost) {
        const winners = Object.entries(st.teams).filter(([k,v]) => k.startsWith(st.winner)).map(([k,v]) => v);
        setTimeout(() => finishGame(ctx, makeResult(isWin?'win':'lose', winners)), 6000);
      }
    }
  }
}

const abort = async msg => {
  const fn = RoomMod.abortGame || LeaveMod.abortGame;
  if (fn) return fn(ctx, msg);
  toast(msg || 'تم إنهاء اللعبة', 'error');
  if (ctx?.isHost) await update(roomRef(ctx.code, 'meta'), { status: 'lobby', game: null }).catch(() => {});
  setTimeout(() => goLobby(ctx?.code || ''), 1800);
};

try { ctx = await enterRoom(); } catch (e) { toast(e.message, 'error'); setTimeout(() => goLobby(''), 1800); throw e; }

if (ctx.isHost) {
  runTransaction(gameRef(ctx.code, 's'), cur => cur || { phase: 'ready', teams: {}, seq: 0 });
}

const initLeave = LeaveMod.watchLeave || LeaveMod.setupLeave || LeaveMod.default;
if (typeof initLeave === 'function') { try { initLeave(ctx, () => !ended); } catch {} }

players = ctx.players;
onValue(gameRef(ctx.code, 's'), s => { st = s.val(); if (st) render(); });
watchRoom(ctx.code, {
  meta: m => { if (!m || m.status !== 'playing') goLobby(ctx.code); },
  players: p => { players = p || players; scoreBar($('#sb'), players, scores, ctx.uid); if (st) render(); },
  scores: s => { scores = s || {}; scoreBar($('#sb'), players, scores, ctx.uid); }
});
</script>
</body>
</html>
