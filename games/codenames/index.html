<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Codenames - الأسماء المشفرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/style.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Cairo', sans-serif; }
        body { background-color: #1e1e24; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .team-color-bar { height: 6px; width: 100%; transition: all 0.5s; z-index: 100; flex-shrink: 0; }
        .bar-red { background: #ef4444; box-shadow: 0 0 15px #ef4444; }
        .bar-blue { background: #3b82f6; box-shadow: 0 0 15px #3b82f6; }
        .bar-none { background: #555; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #2b2b2b; color: white; height: 75px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 10; flex-shrink: 0; }
        .room-pin { font-family: monospace; font-size: 1.4rem; background: #111; padding: 8px 20px; border-radius: 8px; color: #facc15; font-weight: bold; border: 1px solid #444; cursor: pointer; display: flex; gap: 10px; align-items: center; }
        
        .host-menu-btn { background: transparent; border: none; font-size: 1.8rem; cursor: pointer; transition: 0.2s; display: none; }
        .host-menu-btn:active { transform: rotate(45deg); }

        .score-board { display: flex; gap: 15px; font-size: 1.5rem; font-weight: bold; }
        .score-red { color: #fca5a5; background: #7f1d1d; padding: 4px 15px; border-radius: 8px; border: 2px solid #ef4444; }
        .score-blue { color: #bfdbfe; background: #1e3a8a; padding: 4px 15px; border-radius: 8px; border: 2px solid #3b82f6; }

        .turn-status { font-size: 1rem; font-weight: bold; background: #444; padding: 8px 15px; border-radius: 30px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .turn-red { background: #ef4444; color: white; border: 2px solid #b91c1c; }
        .turn-blue { background: #3b82f6; color: white; border: 2px solid #1d4ed8; }

        .game-board { flex: 1; display: flex; justify-content: center; align-items: center; padding: 15px; background-image: radial-gradient(#d4cbb8 2px, transparent 2px); background-size: 20px 20px; overflow: hidden; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 850px; height: 100%; max-height: 550px; }
        
        .card { background: #fdfbf7; border: 2px solid #d0c8b6; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; font-weight: bold; color: #333; cursor: pointer; box-shadow: 0 6px 10px rgba(0,0,0,0.15); transition: all 0.2s; position: relative; text-align: center; padding: 4px; word-break: break-word; }
        .card:active { transform: scale(0.95); }
        .card.revealed { pointer-events: none; }
        .card.revealed.red { background: #ef4444; color: white; border-color: #b91c1c; }
        .card.revealed.blue { background: #3b82f6; color: white; border-color: #1d4ed8; }
        .card.revealed.neutral { background: #d4d4d8; color: #555; border-color: #a1a1aa; }
        .card.revealed.assassin { background: #18181b; color: white; border-color: #000; }

        .spymaster-view .card:not(.revealed).red { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .spymaster-view .card:not(.revealed).blue { background: #dbeafe; border-color: #3b82f6; color: #1e3a8a; }
        .spymaster-view .card:not(.revealed).assassin { background: #3f3f46; border-color: #000; color: #fff; }
        .spymaster-view .card:not(.revealed).neutral { background: #f4f4f5; }

        .bottom-panel { background: #2b2b2b; padding: 12px 20px; border-top: 3px solid #111; display: flex; flex-direction: column; align-items: center; gap: 10px; color: white; z-index: 50; flex-shrink: 0; }
        .clue-area { display: none; gap: 10px; align-items: center; justify-content: center; background: #1a1a1a; padding: 8px; border-radius: 10px; border: 1px solid #444; flex-wrap: wrap; }
        .clue-area input { padding: 8px 12px; border-radius: 6px; border: 2px solid #555; font-size: 1rem; width: 160px; background: #333; color: white; outline: none; }
        .clue-area select { padding: 8px; border-radius: 6px; border: 2px solid #555; font-size: 1rem; background: #333; color: white; cursor: pointer; }
        .btn-submit { background: #10b981; color: white; padding: 8px 20px; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        
        .clue-display { text-align: center; font-size: 1.3rem; font-weight: bold; color: #facc15; display: none; background: #1a1a1a; padding: 8px 20px; border-radius: 10px; border: 1px dashed #facc15; }
        .btn-end { background: #6b7280; color: white; padding: 10px 25px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; display: none; }

        /* شاشة اللوبي */
        .lobby-screen { position: fixed; inset: 0; background: #111; z-index: 1000; display: flex; flex-direction: column; overflow: hidden; }
        .lobby-header { text-align: center; padding: 12px; background: #0a0a0a; border-bottom: 2px solid #333; flex-shrink: 0; }
        .lobby-header h1 { color: #facc15; margin: 0; font-size: 1.8rem; }
        .lobby-header .pin-box { display: inline-block; background: #222; border: 2px dashed #444; padding: 4px 20px; border-radius: 10px; margin-top: 6px; cursor: pointer; }
        .lobby-header .pin-text { font-size: 1.6rem; color: #fff; font-family: monospace; font-weight: bold; letter-spacing: 4px; }
        
        .btn-master-lock { display: none; margin: 6px auto 0; padding: 6px 20px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; color: white; }

        .lobby-content { flex: 1; display: flex; flex-wrap: wrap; padding: 15px; gap: 15px; overflow-y: auto; justify-content: center; align-items: stretch; }
        
        .team-col { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 10px; border-radius: 12px; padding: 12px; border: 2px solid transparent; }
        .col-blue { background: linear-gradient(to bottom, #1e3a8a, #0f172a); border-color: #3b82f6; }
        .col-red { background: linear-gradient(to bottom, #7f1d1d, #2e0505); border-color: #ef4444; }
        .col-center { background: rgba(255, 255, 255, 0.05); border: 2px dashed #666; }
        
        .team-title { text-align: center; font-size: 1.4rem; font-weight: bold; margin-bottom: 5px; }
        .col-blue .team-title { color: #60a5fa; }
        .col-red .team-title { color: #f87171; }
        .col-center .team-title { color: #aaa; }

        .role-box { background: rgba(0,0,0,0.4); border-radius: 8px; padding: 10px; border: 1px solid rgba(255,255,255,0.1); flex: 1; display: flex; flex-direction: column; }
        .role-title { font-size: 1rem; color: #facc15; text-align: center; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
        
        .players-wrap { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; flex: 1; align-content: flex-start; min-height: 45px; border-radius: 6px; padding: 4px; border: 2px dashed transparent; transition: 0.2s; }
        .players-wrap.drag-over { border-color: #facc15; background: rgba(250, 204, 21, 0.1); }
        
        .player-badge { background: #333; padding: 6px 12px; border-radius: 15px; font-weight: bold; color: white; display: flex; align-items: center; gap: 6px; border: 1px solid #555; font-size: 0.9rem; }
        .me-badge { background: #f59e0b; color: #000; border-color: #fff; }

        .btn-join { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .col-blue .btn-join { background: #3b82f6; color: white; }
        .col-red .btn-join { background: #ef4444; color: white; }

        .lobby-footer { background: #000; padding: 15px; display: flex; justify-content: center; align-items: center; gap: 15px; border-top: 2px solid #333; flex-wrap: wrap; flex-shrink: 0; width: 100%; }
        .btn-large { padding: 12px 25px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: white; }
        .btn-start { background: #10b981; }
        .btn-random { background: #8b5cf6; }
        
        .overlay { position: fixed; inset: 0; background: rgba(10, 10, 15, 0.92); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; backdrop-filter: blur(5px); }
        .end-box { background: #1a1a1a; padding: 30px; border-radius: 18px; border: 2px solid #444; width: 90%; max-width: 450px; }
        .host-top-menu { background: #222; padding: 20px; border-radius: 15px; border: 2px solid #555; display: flex; flex-direction: column; gap: 10px; width: 280px; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 8px 16px; border-radius: 20px; font-weight: bold; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 3000; }
        .toast.show { opacity: 1; bottom: 70px; }
    </style>
</head>
<body>

    <div id="teamColorBar" class="team-color-bar bar-none"></div>

    <!-- شاشة اللوبي (تتطلب 4 لاعبين) -->
    <div id="lobbyScreen" class="lobby-screen" style="display: none;">
        <div class="lobby-header">
            <h1>الأسماء المشفرة 🕵️‍♂️</h1>
            <div class="pin-box" onclick="copyPin()">
                <div style="color:#aaa; font-size:0.85rem; margin-bottom:2px;">كود الغرفة (اضغط للنسخ)</div>
                <div class="pin-text" id="lobbyPinDisplay">----</div>
            </div>
            <button id="masterLockBtn" class="btn-master-lock" onclick="toggleMasterLock()">🔒 قفل اللوبي</button>
        </div>
        
        <div class="lobby-content">
            <div class="team-col col-blue">
                <div class="team-title">الفريق الأزرق 🔵</div>
                <div class="role-box">
                    <div class="role-title">القائد (Spymaster)</div>
                    <div class="players-wrap" id="blueSpymaster" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropPlayer(event, 'blue', 'spymaster')"></div>
                    <button class="btn-join" onclick="joinSlot('blue', 'spymaster')">انضم كقائد أزرق</button>
                </div>
                <div class="role-box">
                    <div class="role-title">العملاء (Operatives)</div>
                    <div class="players-wrap" id="blueOperatives" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropPlayer(event, 'blue', 'operative')"></div>
                    <button class="btn-join" onclick="joinSlot('blue', 'operative')">انضم كعميل أزرق</button>
                </div>
            </div>

            <div class="team-col col-center">
                <div class="team-title">قاعة الانتظار ☕</div>
                <div class="players-wrap" id="unassignedPlayers" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropPlayer(event, 'none', 'none')"></div>
            </div>

            <div class="team-col col-red">
                <div class="team-title">الفريق الأحمر 🔴</div>
                <div class="role-box">
                    <div class="role-title">القائد (Spymaster)</div>
                    <div class="players-wrap" id="redSpymaster" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropPlayer(event, 'red', 'spymaster')"></div>
                    <button class="btn-join" onclick="joinSlot('red', 'spymaster')">انضم كقائد أحمر</button>
                </div>
                <div class="role-box">
                    <div class="role-title">العملاء (Operatives)</div>
                    <div class="players-wrap" id="redOperatives" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropPlayer(event, 'red', 'operative')"></div>
                    <button class="btn-join" onclick="joinSlot('red', 'operative')">انضم كعميل أحمر</button>
                </div>
            </div>
        </div>

        <div class="lobby-footer" id="hostControls">
            <button class="btn-large btn-random" onclick="randomizeTeams()">🎲 توزيع عشوائي</button>
            <button class="btn-large btn-start" id="startBtn" onclick="startGame()" style="opacity: 0.5; cursor: not-allowed;" disabled>🚀 بدء اللعبة (يتطلب 4 لاعبين)</button>
        </div>
        <div class="lobby-footer" id="waitingMsg" style="display: none; justify-content: center; align-items: center; width: 100%;">
            <div style="color:#facc15; font-size:1.2rem; font-weight:bold; text-align: center;" id="waitingText">في انتظار اكتمال 4 لاعبين والهوست...</div>
        </div>
    </div>

    <!-- شاشة اللعب الرئيسية -->
    <div class="top-bar">
        <div style="display: flex; gap: 10px; align-items: center;">
            <div class="room-pin" id="pinDisplay" onclick="copyPin()">----</div>
            <button id="hostSettingsBtn" class="host-menu-btn" onclick="openHostTopMenu()">⚙️</button>
        </div>
        
        <div class="turn-status" id="turnStatus">بانتظار اللعبة...</div>
        
        <div class="score-board">
            <div class="score-red" id="scoreRed">0</div>
            <div class="score-blue" id="scoreBlue">0</div>
        </div>
    </div>

    <div class="game-board">
        <div class="grid" id="grid"></div>
    </div>

    <div class="bottom-panel">
        <div class="clue-display" id="clueDisplay">التلميح: - (0)</div>
        
        <div class="clue-area" id="clueArea">
            <input type="text" id="clueWord" placeholder="كلمة التلميح..." autocomplete="off">
            <select id="clueNum">
                <option value="1">1</option><option value="2">2</option>
                <option value="3">3</option><option value="4">4</option>
                <option value="5">5</option><option value="9">∞</option>
            </select>
            <button class="btn-submit" onclick="submitClue()">إرسال التلميح</button>
        </div>

        <button class="btn-end" id="btnEnd" onclick="endTurn()">إنهاء التخمين (Pass)</button>
    </div>

    <div id="endScreen" class="overlay">
        <div id="endBox" class="end-box"></div>
    </div>

    <div id="hostTopModal" class="overlay"></div>
    <div id="toast" class="toast">تم نسخ الكود ✅</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";
        import * as RoomMod from '../../shared/room.js';
        import { finishGame, makeResult } from '../../shared/result.js';
        import { scoreBar } from '../../shared/ui.js';
        import * as LeaveMod from '../../shared/leave.js';

        const { enterRoom, watchRoom, gameRef, roomRef, goLobby } = RoomMod;

        const firebaseConfig = { apiKey: "AIzaSyB5CobIKfYdAz8jaabJpMQrGoqS9Ton28Y", authDomain: "buttons-f3501.firebaseapp.com", databaseURL: "https://buttons-f3501-default-rtdb.firebaseio.com", projectId: "buttons-f3501" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let ctx;
        try {
            ctx = await enterRoom();
        } catch (e) {
            setTimeout(() => goLobby(''), 1500);
            throw e;
        }

        const pin = ctx.code;
        let myName = ctx.myName || "لاعب";
        const isHost = ctx.isHost;
        const myId = ctx.uid;

        const codenamesRef = ref(db, `codenames/${pin}`);
        const stateRef = ref(db, `codenames/${pin}/state`);
        const playersRef = ref(db, `codenames/${pin}/players`);
        const boardRef = ref(db, `codenames/${pin}/board`);

        const WORD_LIST = ["تفاح", "موز", "أسد", "نمر", "سيارة", "طيارة", "شمس", "قمر", "نجم", "بحر", "نهر", "جبل", "نار", "ثلج", "ملك", "أميرة", "سيف", "درع", "قلعة", "خيمة", "مستشفى", "مدرسة", "طبيب", "معلم", "كتاب", "قلم", "ساعة", "باب", "شباك", "كرسي", "طاولة", "حاسوب", "هاتف", "صورة", "لون", "شجرة", "وردة", "عشب", "جذر", "سماء", "أرض", "هواء", "رياح", "عاصفة", "مطر", "قطة", "كلب", "حصان", "جمل", "عصفور"];

        let gameState = { status: 'lobby', lobbyLocked: false };
        let players = {};
        let board = [];
        let myPlayer = { name: myName, team: 'none', role: 'none' };
        let ended = false;

        const myPlayerRef = ref(db, `codenames/${pin}/players/${myId}`);
        get(myPlayerRef).then((snap) => {
            if (!snap.exists()) { 
                set(myPlayerRef, { name: myName, team: 'none', role: 'none' }); 
            } else { 
                if(snap.val().name) myName = snap.val().name; 
            }
        });

        onValue(stateRef, snap => { gameState = snap.val() || { status: 'lobby', lobbyLocked: false }; renderUI(); });
        onValue(playersRef, snap => { players = snap.val() || {}; myPlayer = players[myId] || myPlayer; renderUI(); });
        onValue(boardRef, snap => { board = snap.val() || []; renderBoard(); });

        // --- إدارة اللوبي والفرق ---
        window.joinSlot = async (team, role) => {
            if (gameState.lobbyLocked && !isHost) {
                alert("🔒 اللوبي مقفل من قبل الهوست!");
                return;
            }
            let updates = {};
            updates[`codenames/${pin}/players/${myId}/team`] = team;
            updates[`codenames/${pin}/players/${myId}/role`] = role;

            if (role === 'spymaster') {
                Object.keys(players).forEach(pId => {
                    if (pId !== myId && players[pId].team === team && players[pId].role === 'spymaster') {
                        updates[`codenames/${pin}/players/${pId}/role`] = 'operative';
                    }
                });
            }
            await update(ref(db), updates);
        };

        window.randomizeTeams = async () => {
            let pIds = Object.keys(players);
            pIds.sort(() => 0.5 - Math.random()); 
            let mid = Math.ceil(pIds.length / 2);
            let blueTeam = pIds.slice(0, mid);
            let redTeam = pIds.slice(mid);

            let updates = {};
            blueTeam.forEach((id, index) => {
                updates[`codenames/${pin}/players/${id}/team`] = 'blue';
                updates[`codenames/${pin}/players/${id}/role`] = index === 0 ? 'spymaster' : 'operative';
            });
            redTeam.forEach((id, index) => {
                updates[`codenames/${pin}/players/${id}/team`] = 'red';
                updates[`codenames/${pin}/players/${id}/role`] = index === 0 ? 'spymaster' : 'operative';
            });
            await update(ref(db), updates);
        };

        window.toggleMasterLock = async () => {
            if (!isHost) return;
            let currentLock = gameState.lobbyLocked || false;
            await update(stateRef, { lobbyLocked: !currentLock });
        };

        window.dragStart = (e, pId) => {
            if (!isHost) { e.preventDefault(); return; }
            e.dataTransfer.setData("text/plain", pId);
        };
        window.dragOver = (e) => { if (!isHost) return; e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
        window.dragLeave = (e) => { if (!isHost) return; e.currentTarget.classList.remove('drag-over'); };
        window.dropPlayer = async (e, team, role) => {
            if (!isHost) return;
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const pId = e.dataTransfer.getData("text/plain");
            if (pId) {
                let updates = {};
                updates[`codenames/${pin}/players/${pId}/team`] = team;
                updates[`codenames/${pin}/players/${pId}/role`] = role;
                if (role === 'spymaster') {
                    Object.keys(players).forEach(id => {
                        if (id !== pId && players[id].team === team && players[id].role === 'spymaster') {
                            updates[`codenames/${pin}/players/${id}/role`] = 'operative';
                        }
                    });
                }
                await update(ref(db), updates);
            }
        };

        window.openHostTopMenu = () => {
            const overlay = document.getElementById('hostTopModal');
            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <div class="host-top-menu">
                    <h2 style="color:#facc15; margin:0; text-align:center;">إدارة اللعبة ⚙️</h2>
                    <button class="btn" style="background:#3b82f6;" onclick="closeHostTopMenu()">▶️ استمرار</button>
                    <button class="btn" style="background:#8b5cf6;" onclick="startGame()">🔄 إعادة ضبط اللعبة</button>
                    <button class="btn" style="background:#ef4444;" onclick="returnToLobby()">🔙 العودة للوبي</button>
                </div>
            `;
        };
        window.closeHostTopMenu = () => { document.getElementById('hostTopModal').style.display = 'none'; };

        window.returnToLobby = async () => {
            await update(ref(db, `codenames/${pin}/state`), { status: 'lobby', lobbyLocked: false });
            await set(boardRef, []);
            closeHostTopMenu();
        };

        // --- بدء اللعبة (بشرط 4 لاعبين) ---
        window.startGame = async function() {
            closeHostTopMenu();
            let totalPlayers = Object.keys(players).length;
            if (totalPlayers < 4) {
                alert("⚠️ لا يمكن بدء اللعبة إلا بوجود 4 لاعبين على الأقل في الغرفة!");
                return;
            }

            let redCount = Object.values(players).filter(p => p.team === 'red').length;
            let blueCount = Object.values(players).filter(p => p.team === 'blue').length;
            if (redCount === 0 || blueCount === 0) {
                alert("يجب توزيع اللاعبين على الفريقين الأحمر والأزرق!");
                return;
            }

            let shuffledWords = [...WORD_LIST].sort(() => 0.5 - Math.random()).slice(0, 25);
            let startingTeam = Math.random() > 0.5 ? 'red' : 'blue';
            
            let colors = [
                ...Array(9).fill(startingTeam),
                ...Array(8).fill(startingTeam === 'red' ? 'blue' : 'red'),
                ...Array(7).fill('neutral'),
                'assassin'
            ].sort(() => 0.5 - Math.random());

            let newBoard = shuffledWords.map((word, i) => ({ word: word, color: colors[i], revealed: false }));

            await set(codenamesRef, {
                state: { status: 'playing', currentTurn: startingTeam, turnPhase: 'spymaster', clueWord: '', clueNum: 0, redScore: startingTeam === 'red' ? 9 : 8, blueScore: startingTeam === 'blue' ? 9 : 8 },
                players: players,
                board: newBoard
            });
        };

        window.submitClue = () => {
            const word = document.getElementById('clueWord').value.trim();
            const num = document.getElementById('clueNum').value;
            if (word && num) {
                update(stateRef, { turnPhase: 'operative', clueWord: word, clueNum: parseInt(num) });
                document.getElementById('clueWord').value = ''; 
            }
        };

        window.endTurn = () => {
            if (gameState.turnPhase === 'operative') {
                update(stateRef, { currentTurn: gameState.currentTurn === 'red' ? 'blue' : 'red', turnPhase: 'spymaster', clueWord: '', clueNum: 0 });
            }
        };

        window.clickCard = async (index) => {
            if (gameState.status !== 'playing' || myPlayer.role !== 'operative' || gameState.turnPhase !== 'operative' || myPlayer.team !== gameState.currentTurn) return;
            if (board[index].revealed) return;

            let card = board[index];
            await update(ref(db, `codenames/${pin}/board/${index}`), { revealed: true });

            let newRedScore = gameState.redScore;
            let newBlueScore = gameState.blueScore;

            if (card.color === 'assassin') {
                update(stateRef, { status: 'game_over', winner: gameState.currentTurn === 'red' ? 'blue' : 'red', reason: '💥 تم لمس المغتال! خسر الفريق ' + (gameState.currentTurn === 'red' ? 'الأحمر' : 'الأزرق') });
                checkEndGame('assassin', gameState.currentTurn === 'red' ? 'blue' : 'red');
                return;
            }

            if (card.color === 'red') newRedScore--;
            if (card.color === 'blue') newBlueScore--;

            if (newRedScore === 0) { 
                update(stateRef, { status: 'game_over', winner: 'red', reason: '🎉 اكتشف الفريق الأحمر جميع عملائه وفاز بالمهمة!' }); 
                checkEndGame('win', 'red');
                return; 
            }
            if (newBlueScore === 0) { 
                update(stateRef, { status: 'game_over', winner: 'blue', reason: '🎉 اكتشف الفريق الأزرق جميع عملائه وفاز بالمهمة!' }); 
                checkEndGame('win', 'blue');
                return; 
            }

            let updates = { redScore: newRedScore, blueScore: newBlueScore };
            if (card.color !== gameState.currentTurn) {
                updates.currentTurn = gameState.currentTurn === 'red' ? 'blue' : 'red';
                updates.turnPhase = 'spymaster';
                updates.clueWord = '';
            }
            update(stateRef, updates);
        };

        function checkEndGame(type, winnerTeam) {
            if (ended) return;
            ended = true;
            let iWon = (winnerTeam === 'red' && myPlayer.team === 'red') || (winnerTeam === 'blue' && myPlayer.team === 'blue');
            if (iWon) makeResult('win', [myId], { redScore: gameState.redScore, blueScore: gameState.blueScore });
            else makeResult('lose', [myId], { redScore: gameState.redScore, blueScore: gameState.blueScore });
            if (isHost) {
                setTimeout(() => finishGame(ctx, makeResult(iWon ? 'win' : 'lose', [myId])), 5000);
            }
        }

        function renderBoard() {
            const grid = document.getElementById('grid');
            if (!grid) return;
            grid.innerHTML = '';
            if (myPlayer?.role === 'spymaster') grid.classList.add('spymaster-view');
            else grid.classList.remove('spymaster-view');

            board.forEach((card, index) => {
                const el = document.createElement('div');
                el.className = `card ${card.revealed ? 'revealed ' + card.color : card.color}`;
                el.innerText = card.word;
                el.onclick = () => clickCard(index);
                grid.appendChild(el);
            });
        }

        window.copyPin = () => {
            navigator.clipboard.writeText(pin);
            const t = document.getElementById('toast'); t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        };

        function getPlayersHTML(team, role) {
            let filtered = Object.keys(players).filter(id => players[id].team === team && players[id].role === role);
            if(filtered.length === 0) return `<div style="color:#888; font-size:0.85rem; padding: 6px; width:100%; text-align:center; pointer-events:none;">${isHost ? '-- اسحب اللاعبين هنا --' : '-- فارغ --'}</div>`;
            
            return filtered.map(id => {
                const p = players[id];
                const isMe = id === myId ? 'me-badge' : '';
                return `
                    <div class="player-badge ${isMe}" draggable="${isHost ? 'true' : 'false'}" ondragstart="dragStart(event, '${id}')" style="cursor: ${isHost ? 'grab' : 'default'}">
                        👤 ${p.name}
                    </div>
                `;
            }).join('');
        }

        function getTurnAnnouncement() {
            let activeTeam = gameState.currentTurn;
            let phase = gameState.turnPhase;
            let teamName = activeTeam === 'red' ? 'الأحمر' : 'الأزرق';
            
            if (phase === 'spymaster') {
                let sm = Object.values(players).find(p => p.team === activeTeam && p.role === 'spymaster');
                let name = sm ? sm.name : "القائد";
                return `🕵️‍♂️ قائد ${teamName}: ${name}`;
            } else {
                let ops = Object.values(players).filter(p => p.team === activeTeam && p.role === 'operative');
                let name = ops.length === 1 ? ops[0].name : "العملاء";
                return `🏃‍♂️ عملاء ${teamName}: ${name}`;
            }
        }

        function renderUI() {
            document.getElementById('pinDisplay').innerText = `PIN: ${pin}`;
            document.getElementById('lobbyPinDisplay').innerText = pin;
            
            const colorBar = document.getElementById('teamColorBar');
            colorBar.className = `team-color-bar ${myPlayer?.team === 'red' ? 'bar-red' : (myPlayer?.team === 'blue' ? 'bar-blue' : 'bar-none')}`;

            document.getElementById('hostSettingsBtn').style.display = isHost ? 'block' : 'none';

            const lobbyScreen = document.getElementById('lobbyScreen');
            const endScreen = document.getElementById('endScreen');
            
            if (gameState.status === 'lobby') {
                lobbyScreen.style.display = 'flex';
                endScreen.style.display = 'none';

                document.getElementById('blueSpymaster').innerHTML = getPlayersHTML('blue', 'spymaster');
                document.getElementById('blueOperatives').innerHTML = getPlayersHTML('blue', 'operative');
                document.getElementById('redSpymaster').innerHTML = getPlayersHTML('red', 'spymaster');
                document.getElementById('redOperatives').innerHTML = getPlayersHTML('red', 'operative');
                document.getElementById('unassignedPlayers').innerHTML = getPlayersHTML('none', 'none');

                document.getElementById('hostControls').style.display = isHost ? 'flex' : 'none';
                document.getElementById('waitingMsg').style.display = isHost ? 'none' : 'flex';

                // فحص شرط الـ 4 لاعبين لبدء اللعبة
                let totalPlayers = Object.keys(players).length;
                let startBtn = document.getElementById('startBtn');
                let waitingText = document.getElementById('waitingText');

                if (totalPlayers >= 4) {
                    if (startBtn) {
                        startBtn.style.opacity = '1';
                        startBtn.style.cursor = 'pointer';
                        startBtn.removeAttribute('disabled');
                    }
                    if (waitingText) waitingText.innerText = "اكتمل العدد! في انتظار الهوست لبدء اللعبة...";
                } else {
                    if (startBtn) {
                        startBtn.style.opacity = '0.5';
                        startBtn.style.cursor = 'not-allowed';
                        startBtn.setAttribute('disabled', 'true');
                    }
                    if (waitingText) waitingText.innerText = `يجب أن يكون هناك 4 لاعبين على الأقل (حالياً: ${totalPlayer}/4)`;
                }

                if (isHost) {
                    const lockBtn = document.getElementById('masterLockBtn');
                    lockBtn.style.display = 'block';
                    if (gameState.lobbyLocked) {
                        lockBtn.innerText = '🔓 فتح اللوبي';
                        lockBtn.style.background = '#10b981';
                    } else {
                        lockBtn.innerText = '🔒 قفل اللوبي';
                        lockBtn.style.background = '#ef4444';
                    }
                }

            } else if (gameState.status === 'playing') {
                lobbyScreen.style.display = 'none';
                endScreen.style.display = 'none';
                
                document.getElementById('scoreRed').innerText = gameState.redScore;
                document.getElementById('scoreBlue').innerText = gameState.blueScore;
                
                const turnBox = document.getElementById('turnStatus');
                turnBox.className = `turn-status ${gameState.currentTurn === 'red' ? 'turn-red' : 'turn-blue'}`;
                turnBox.innerText = getTurnAnnouncement();

                const clueArea = document.getElementById('clueArea');
                const clueDisplay = document.getElementById('clueDisplay');
                const btnEnd = document.getElementById('btnEnd');
                
                if (gameState.turnPhase === 'spymaster' && myPlayer.role === 'spymaster' && myPlayer.team === gameState.currentTurn) {
                    clueArea.style.display = 'flex';
                    clueDisplay.style.display = 'none';
                    btnEnd.style.display = 'none';
                } else if (gameState.turnPhase === 'operative') {
                    clueArea.style.display = 'none';
                    clueDisplay.style.display = 'block';
                    clueDisplay.innerText = `التلميح: ${gameState.clueWord} (${gameState.clueNum === 9 ? 'لا نهائي' : gameState.clueNum})`;
                    
                    if (myPlayer.role === 'operative' && myPlayer.team === gameState.currentTurn) {
                        btnEnd.style.display = 'block';
                    } else {
                        btnEnd.style.display = 'none';
                    }
                } else {
                    clueArea.style.display = 'none';
                    clueDisplay.style.display = 'none';
                    btnEnd.style.display = 'none';
                }
            } else if (gameState.status === 'game_over') {
                lobbyScreen.style.display = 'none';
                endScreen.style.display = 'flex';
                
                const box = document.getElementById('endBox');
                box.style.borderColor = gameState.winner === 'red' ? '#ef4444' : '#3b82f6';
                box.innerHTML = `
                    <h1 style="color:${gameState.winner === 'red' ? '#ef4444' : '#3b82f6'}; font-size: 2.2rem; margin-bottom: 15px;">
                        فاز الفريق ${gameState.winner === 'red' ? 'الأحمر' : 'الأزرق'}! 🏆
                    </h1>
                    <p style="color:#ccc; font-size: 1.1rem; margin-bottom: 20px;">${gameState.reason}</p>
                    ${isHost ? `
                    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                        <button class="btn-large" style="background:#ef4444;" onclick="returnToLobby()">🔙 اللوبي</button>
                        <button class="btn-large btn-start" onclick="startGame()">🔄 جولة جديدة</button>
                    </div>` : '<p style="color:#facc15; font-weight:bold; font-size:1.1rem;">في انتظار الهوست...</p>'}
                `;
            }
        }

        // إعدادات الخروج المشترك عبر الـ leave.js
        const initLeave = LeaveMod.watchLeave || LeaveMod.setupLeave || LeaveMod.default;
        if (typeof initLeave === 'function') {
            try { initLeave(ctx, () => !ended); } catch {}
        }
    </script>
</body>
</html>
