<style>
html,body{height:100%;overflow:hidden}
body{background-image:radial-gradient(70% 40% at 50% 0%,rgba(255,107,129,.13),transparent),radial-gradient(60% 50% at 95% 0%,rgba(79,209,197,.13),transparent),radial-gradient(55% 45% at 0% 100%,rgba(255,180,84,.12),transparent)}
main{max-width:520px;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;justify-content:flex-start;gap:6px;padding:8px 12px 10px}
@media (pointer:coarse){main{padding-bottom:54px}}
.scorebar{padding:5px 8px;flex:none;position:relative;z-index:120}.sb{padding:4px 10px;font-size:.88rem}
/* شريط المعلومات */
.info{display:flex;align-items:center;gap:6px;flex:none}
.chip{display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:.8rem;white-space:nowrap;color:var(--text)}
.chip b{font:700 1rem 'Reem Kufi',sans-serif;color:var(--amber)}
.chip.tg{padding:2px 10px 2px 7px}.chip.tg svg{width:20px;height:28px;display:block}
.chip.sp{margin-inline-start:auto}
.chip.btnc{cursor:pointer;font:inherit;width:34px;justify-content:center;padding:3px 0}
.chip.warn{border-color:var(--rose);color:var(--rose)}
.tbar{height:3px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;flex:none}
.tbar i{display:block;height:100%;width:100%;background:var(--lagoon);transform-origin:right;transform:scaleX(0)}
/* المشهد: يُصغَّر تلقائياً ليتسع بلا تمرير */
.scene{position:relative;flex:1 1 0;min-height:110px}
.stage{position:absolute;left:50%;top:0;width:340px;height:340px;margin-left:-170px;transform-origin:50% 0}
.stage>*{position:absolute;left:0;top:0;width:340px;height:340px}
#tableSvg{pointer-events:none}
#pile{pointer-events:none;z-index:3}
.pc{position:absolute;left:146px;top:126px;width:48px;height:67px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.pc svg,.fc svg,.hc svg{width:100%;height:100%;display:block}
#seats{z-index:5}
#fly{z-index:8;pointer-events:none}
#fx{z-index:20;pointer-events:none}
.seat{position:absolute;width:92px;transform:translate(-50%,-27px);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;--pc:#4fd1c5;--pcg:rgba(79,209,197,.6)}
.av{position:relative;width:54px;height:54px;border-radius:50%;border:3px solid var(--pc);background:#12172a;box-shadow:0 6px 14px rgba(0,0,0,.5)}
.av .face{width:100%;height:100%;border-radius:50%;display:block}
.seat.act .av{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 var(--pcg),0 6px 14px rgba(0,0,0,.5)}50%{box-shadow:0 0 16px 6px var(--pcg),0 6px 14px rgba(0,0,0,.5)}}
.seat .hcb{position:absolute;top:-6px;inset-inline-end:-10px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--amber);color:#3a2605;font:700 .8rem 'Reem Kufi',sans-serif;display:flex;align-items:center;justify-content:center;gap:2px;border:2px solid #12172a}
.seat .nm{font-size:.76rem;font-weight:700;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 4px #000;color:var(--pc)}
.seat.me .nm::after{content:' (أنت)';color:var(--mute);font-weight:400}
.pips{display:flex;gap:3px;direction:ltr;height:7px}.pips i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.16)}.pips i.on{background:var(--rose);box-shadow:0 0 6px var(--rose)}
.sk{position:absolute;inset:3px;display:none;border-radius:50%;background:rgba(8,10,20,.55)}.sk svg{width:100%;height:100%}
.seat.dead .av{filter:grayscale(1) brightness(.55)}.seat.dead .sk{display:block}.seat.dead .nm{color:var(--mute);text-decoration:line-through}.seat.dead .hcb{display:none}
.seat.off .av{opacity:.55}.seat.off .nm::before{content:'📡 '}
.bub{position:absolute;bottom:calc(100% - 10px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;background:#12172a;border:1px solid var(--amber);font-size:.78rem;font-weight:700;white-space:nowrap;z-index:6;pointer-events:none}
.bub svg{width:15px;height:21px}
/* الأوراق والتأثيرات */
.fc{perspective:700px;position:absolute}.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}.ff{transform:rotateY(180deg)}
.dim{position:absolute;inset:0;background:radial-gradient(circle at 50% 47%,rgba(5,7,14,.88),rgba(5,7,14,.6))}
.ban{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:9px 20px;border-radius:999px;font:700 1.2rem 'Reem Kufi',sans-serif;white-space:nowrap;background:#12172a;border:2px solid var(--amber);color:var(--amber);box-shadow:0 8px 24px rgba(0,0,0,.6)}
.ban.red{border-color:var(--rose);color:var(--rose)}.ban.grn{border-color:#34d399;color:#34d399}
.say{position:absolute;left:0;width:340px;text-align:center;font:700 1.1rem 'Reem Kufi',sans-serif;text-shadow:0 2px 10px #000}
.say small{display:block;font:400 .8rem 'Cairo',sans-serif;color:var(--mute);margin-top:2px}
#gun{position:absolute;left:75px;top:75px;width:190px;height:190px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.7))}
.flash{position:absolute;inset:-60px;background:#fff;opacity:0}
.vig{position:absolute;inset:-60px;background:radial-gradient(circle,rgba(255,107,129,0) 25%,rgba(180,20,50,.85));opacity:0}
/* اليد والأزرار */
.hand{flex:none;height:126px;position:relative;touch-action:manipulation}
.hc{position:absolute;left:50%;top:16px;width:72px;height:101px;margin-left:-36px;cursor:pointer;transform-origin:50% 130%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55));-webkit-tap-highlight-color:transparent}
.hc.sel{filter:drop-shadow(0 0 9px var(--amber)) drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.hand.off .hc{cursor:default}
.ctl{display:flex;gap:10px;flex:none}
.ctl .btn{padding:12px 8px}
.btn.play{background:var(--amber);color:#3a2605;border-color:transparent;flex:1.35}
.btn.liar{background:var(--rose);color:#2a0710;border-color:transparent;flex:1}
.btn.pulse{animation:pulseb .8s ease-in-out infinite alternate}@keyframes pulseb{to{transform:scale(1.05);box-shadow:0 0 18px rgba(255,107,129,.7)}}
.spec{flex:none;text-align:center;padding:12px;border-radius:16px;background:rgba(255,107,129,.1);border:1px solid rgba(255,107,129,.4);color:var(--rose);font-weight:700}
/* شاشة الدخول */
.enter{display:none!important;position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:74px 20px 20px;background:radial-gradient(80% 60% at 50% 0%,#1d1530,#07090f 70%)}
.ecard{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.ecard .logo{width:150px;height:150px}
.ecard h1{font:700 2.3rem 'Reem Kufi',sans-serif;letter-spacing:.02em;line-height:1.1}
.ecard h1 em{font-style:normal;color:var(--rose)}
.ecard .tag{color:var(--mute);font-size:.95rem}
.plist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pchip{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:.85rem;--pc:#4fd1c5}
.pchip i{width:9px;height:9px;border-radius:50%;background:var(--pc);opacity:.35}.pchip.ok i{opacity:1;box-shadow:0 0 8px var(--pc)}
.ecard .btn{max-width:340px}
.ecard .sm2{color:var(--mute);font-size:.82rem;min-height:1.2em}
.rules{max-width:360px;text-align:right;align-items:stretch}
.rules ol{padding-inline-start:20px;display:flex;flex-direction:column;gap:7px;font-size:.9rem;line-height:1.6;color:var(--text)}
.rules ol b{color:var(--amber)}
@media (prefers-reduced-motion:reduce){.seat.act .av,.btn.pulse{animation:none}}
</style>

<script type="module">
import { runTransaction, onValue, get, set, remove, serverNow } from '../../shared/firebase.js';
import { enterRoom, watchRoom, gameRef, roomRef, goLobby, abortGame, backToLobby } from '../../shared/room.js';
import { finishGame, makeResult, evBy } from '../../shared/result.js';
import { countdown, deadline } from '../../shared/timer.js';
import { toast, sfx, scoreBar, confirmDialog, showOverlay, isMuted, toggleMute } from '../../shared/ui.js';
import { initGroupExit } from '../../shared/leave.js';

// ===== محرّك القواعد (دوال نقية بلا شبكة، تُختبر بمحاكاة آلاف المباريات) =====
const HAND = 5, MAX_PLAY = 3, TURN_S = 45, DEAL_S = 3.6, REVEAL_S = 4.4, ROUL_S = 8.8, REDEAL_S = 2.4, DONE_S = 6.5, STRIKES = 2, CH_S = 1.8;
const CODES = ['A', 'K', 'Q'];
const rnd = n => Math.floor(Math.random() * n);
const A = (arr, i, v) => { const a = [...arr]; a[i] = v; return a; };
const aliveIdx = al => al.map((a, i) => (a ? i : -1)).filter(i => i >= 0);
const nextAlive = (al, from) => { const n = al.length; for (let k = 1; k <= n; k++) { const i = (from + k) % n; if (al[i]) return i; } return from; };
const newPid = () => Math.random().toString(36).slice(2, 10);
const newMeta = () => ({ r: Math.round(Math.random() * 60 - 30), x: Math.round(Math.random() * 20 - 10), y: Math.round(Math.random() * 20 - 10) });
function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// التوزيع كما في اللعبة القديمة: كل لاعب ورقة مطلوبة على الأقل، وجوكران لاثنين مختلفين، والباقي من بقية الأوراق
function dealHands(uids, target) {
  const COUNTS = { A: 6, K: 6, Q: 6 };
  const targetCards = shuffle(Array(COUNTS[target]).fill(target)), otherCards = [];
  CODES.forEach(c => { if (c !== target) for (let i = 0; i < COUNTS[c]; i++) otherCards.push(c); });
  const hands = {}; uids.forEach(u => { hands[u] = []; });
  shuffle(uids).forEach(u => { if (targetCards.length) hands[u].push(targetCards.pop()); });
  shuffle(uids).slice(0, 2).forEach((u, i) => { if (hands[u].length < HAND) hands[u].push('J'); });
  const pool = shuffle([...targetCards, ...shuffle(otherCards)]);
  uids.forEach(u => { while (hands[u].length < HAND && pool.length) hands[u].push(pool.pop()); hands[u] = shuffle(hands[u]); });
  return hands;
}

const newState = order => {
  const n = order.length, z = () => Array(n).fill(0);
  return { order, al: Array(n).fill(1), out: [], ch: z(), hc: z(), rd: z(), afk: z(), rnd: 0, tg: 'A', turn: 0, ph: 'ready', endAt: 0, seq: 0, pile: [], ev: { n: 0, t: '', i: 0 } };
};
const evOf = (s, t, i) => ({ n: (s.ev?.n || 0) + 1, t, i });

// بدء جولة: أوراق جديدة وهدف جديد، أو (same) إعادة توزيع بالهدف نفسه بعد نفاد الأوراق
function startRound(s, same) {
  const idx = aliveIdx(s.al);
  if (idx.length < 2) return { state: { ...s, ph: 'done', win: idx[0] ?? 0, endAt: deadline(DONE_S), seq: s.seq + 1 } };
  const tg = same ? s.tg : CODES[rnd(3)], hands = dealHands(idx.map(i => s.order[i]), tg);
  const turn = same ? (s.al[s.turn] ? s.turn : nextAlive(s.al, s.turn)) : idx[rnd(idx.length)];
  const state = { ...s, rnd: same ? s.rnd : (s.rnd || 0) + 1, tg, turn, hc: s.order.map((_, i) => (s.al[i] ? HAND : 0)), pile: [], last: null, clg: null, rv: null, shot: null, ph: 'deal', endAt: deadline(DEAL_S), seq: s.seq + 1 };
  return { state, post: { deal: hands } };
}

// نزول أوراق: يمرّر الدور، وإن فرغت أوراق الجميع تبدأ إعادة التوزيع بالهدف نفسه
function playTx(c, by, n, pid, metas, afkVal = 0) {
  const hc = A(c.hc, by, c.hc[by] - n);
  const o = { ...c, hc, pile: [...(c.pile || []), ...metas], last: { by, n, pid }, turn: nextAlive(c.al, by), endAt: deadline(TURN_S), afk: A(c.afk, by, afkVal), seq: c.seq + 1 };
  if (hc[by] === 0 && c.al.every((a, i) => !a || i === by || hc[i] === 0)) { o.ph = 'redeal'; o.endAt = deadline(REDEAL_S); }
  return o;
}
const callTx = (c, by) => ({ ...c, ph: 'challenge', clg: { by, on: c.last.by }, endAt: deadline(CH_S), afk: A(c.afk, by, 0), seq: c.seq + 1 });

// الإقصاء (انسحاب أو غياب): يُخرج اللاعب، وإن بقي واحد فاز، وإن كان دوره ينتقل الدور
function forfeitTx(c, idx, why) {
  if (!c.al[idx] || c.ph === 'done') return c;
  const al = A(c.al, idx, 0), out = [...(c.out || []), idx], hc = A(c.hc, idx, 0), alive = aliveIdx(al);
  const o = { ...c, al, out, hc, ev: evOf(c, why, idx), seq: c.seq + 1 };
  if (alive.length <= 1) { o.ph = 'done'; o.win = alive[0] ?? idx; o.endAt = deadline(DONE_S); return o; }
  if (c.turn === idx && (c.ph === 'turn' || c.ph === 'deal')) { o.turn = nextAlive(al, idx); if (c.ph === 'turn') o.endAt = deadline(TURN_S); }
  if (c.ph === 'redeal' && c.turn === idx) o.turn = nextAlive(al, idx);
  return o;
}

// حسم الاتهام: الورقة صادقة إن كانت كلها من الهدف أو جوكر. تعذّر إثبات الأوراق = كذب
const bump = (xs, k, e) => { if (k == null) return xs || {}; const o = { ...(xs || {}) }; o[k] = { ...(o[k] || {}), [e]: ((o[k] || {})[e] || 0) + 1 }; return o; };   // عدّاد أحداث الخبرة
function challenge(s, io) {
  const on = s.clg.on, cards = io.pl(s.order[on], s.last.pid);
  const valid = Array.isArray(cards) && cards.length === s.last.n;
  const liar = !valid || cards.some(x => x !== s.tg && x !== 'J'), vic = liar ? on : s.clg.by;
  let xs = bump(s.xs, liar ? s.clg.by : on, liar ? 'c' : 'd'); if (!liar) xs = bump(xs, s.clg.by, 'w');
  return { state: { ...s, xs, ph: 'reveal', rv: { cards: valid ? cards : [], liar, vic, inv: !valid }, endAt: deadline(REVEAL_S), seq: s.seq + 1 } };
}
function toRoulette(s, io) {
  const v = s.rv.vic;
  if (!s.al[v]) return afterShot({ ...s, shot: null });                       // الضحية خرجت سابقاً: لا سحب للزناد
  return { state: { ...s, ph: 'roulette', shot: { vic: v, died: s.ch[v] === io.bullet(s.order[v]), chm: s.ch[v] }, endAt: deadline(ROUL_S), seq: s.seq + 1 } };
}
function afterShot(s) {
  const v = s.shot?.vic ?? s.rv?.vic, al = [...s.al], out = [...(s.out || [])], ch = [...s.ch], hc = [...s.hc];
  if (v != null && al[v]) { if (s.shot?.died) { al[v] = 0; out.push(v); hc[v] = 0; } else ch[v]++; }
  let xs = s.xs; if (v != null && s.shot) { if (s.shot.died && s.clg) xs = bump(xs, v === s.clg.on ? s.clg.by : s.clg.on, 'k'); else if (!s.shot.died) xs = bump(xs, v, 'sv'); }
  const alive = aliveIdx(al), base = { ...s, xs, al, out, ch, hc, shot: null, rv: null, clg: null };
  if (alive.length <= 1) return { state: { ...base, ph: 'done', win: alive[0] ?? v ?? 0, endAt: deadline(DONE_S), seq: s.seq + 1 } };
  return startRound(base, false);
}

      gsap.fromTo(e, { x: 146, y: 126, rotation: 0, scale: .9, opacity: 1 }, { x: to.x - 24, y: to.y - 34, rotation: gsap.utils.random(-25, 25), scale: .6, opacity: 0, duration: .5, delay: k * .07 + i * .04, ease: 'power2.in', onComplete: () => e.remove() });
    }
  });
}
function dealFx(c, quiet) {
  clearFx(); pileN = 0; $('#pile').replaceChildren(); dealAt = Date.now();
  const fx = $('#fx'), big = mkFlip(c.tg, 96, 134); big.style.left = '122px'; big.style.top = '93px';
  fx.append(big);
  const tl = fxTl = gsap.timeline();
  tl.fromTo(big, { scale: .2, rotation: -30, opacity: 0 }, { scale: 1.25, rotation: 0, opacity: 1, duration: .55, ease: 'back.out(1.8)' })
    .to(big.querySelector('.fi'), { rotationY: 180, duration: .6, ease: 'power2.inOut' }, '+=.1')
    .to(big, { scale: 1.38, duration: .25, yoyo: true, repeat: 1 }, '+=.05')
    .add(() => dealCards(c))
    .to(big, { opacity: 0, scale: .3, duration: .35, ease: 'power2.in' }, '+=.5')
    .add(() => { gsap.fromTo('#cTarget', { scale: 1.5 }, { scale: 1, duration: .6, ease: 'elastic.out(1,.5)' }); });
  if (!quiet) sfx.turn(); else tl.progress(1);
}
function turnFx(c) {
  if (c.turn !== me || !isAlive(me)) return; sfx.turn(); clearFx();
  const b = div('ban', '🎯'); $('#fx').append(b);
  fxTl = gsap.timeline().fromTo(b, { scale: .3, opacity: 0 }, { scale: 1, opacity: 1, duration: .4, ease: 'back.out(2.2)' }).to(b, { opacity: 0, y: -20, duration: .3 }, '+=.7').add(() => b.remove());
}
function throwFx(c, quiet) {
  const L = c.last, by = L.by, metas = (c.pile || []).slice(-L.n);
  const pts = pendingFly?.pid === L.pid ? pendingFly.pts : Array(L.n).fill(by === me ? { x: 170, y: 345 } : seatXY(by));
  if (pendingFly?.pid === L.pid) pendingFly = null;
  flyCards(pts, metas, () => { if (st) renderPile(true); });
  bubble(by, L.n, c.tg); if (!quiet) playSnd(`${Math.min(L.n, 4)}${c.tg}`);
}
function challengeFx(c, quiet) {
  clearFx(); const by = c.clg.by, on = c.clg.on, fx = $('#fx'), dim = div('dim');
  const ban = div('ban red', '🤥 كذّاب!'); fx.append(dim, ban);
  const av = $(`#seat${on} .av`);
  fxTl = gsap.timeline().from(dim, { opacity: 0, duration: .4 }).from(ban, { scale: .2, opacity: 0, duration: .5, ease: 'back.out(2.4)' }, 0)
    ;
  if (av) fxTl.fromTo(av, { x: -5 }, { x: 5, duration: .06, repeat: 7, yoyo: true, onComplete: () => gsap.set(av, { x: 0 }) }, .2);
  if (!quiet) sfx.error(); else fxTl.progress(1);
}
function revealFx(c, quiet) {
  clearFx(); const rv = c.rv, n = (rv.cards && rv.cards.length) || c.last.n, fx = $('#fx'), dim = div('dim'); fx.append(dim);
  const W = 70, H = 98, gap = 12, x0 = 170 - (n * W + (n - 1) * gap) / 2, cards = [];
  for (let k = 0; k < n; k++) {
    const code = rv.cards?.[k] || 'J', fc = mkFlip(code, W, H); fc.style.left = (x0 + k * (W + gap)) + 'px'; fc.style.top = '86px'; fx.append(fc); cards.push({ fc, code });
    const bad = !rv.inv && code !== c.tg && code !== 'J'; fc.dataset.bad = bad ? '1' : '0';
  }
  const head = div('ban ' + (rv.liar ? 'red' : 'grn'), rv.liar ? 'كاذب! 🤥' : 'صادق! 😇'); head.style.top = '232px'; head.style.opacity = 0;
  fx.append(head);
  const tl = fxTl = gsap.timeline(); tl.from(dim, { opacity: 0, duration: .35 });
  cards.forEach(({ fc, code }, k) => {
    tl.from(fc, { x: 170 - (x0 + k * (W + gap)) - W / 2, y: 70, scale: .5, rotation: gsap.utils.random(-40, 40), opacity: 0, duration: .5, ease: 'power3.out' }, .2 + k * .1);
    if (!rv.inv) tl.to(fc.querySelector('.fi'), { rotationY: 180, duration: .5, ease: 'power2.inOut' }, 1 + k * .3)
      .to(fc, { filter: fc.dataset.bad === '1' ? 'drop-shadow(0 0 12px #ff6b81)' : 'drop-shadow(0 0 12px #34d399)', duration: .3 }, 1.4 + k * .3);
  });
  const t = 1.5 + n * .3;
  tl.to(head, { opacity: 1, scale: 1.08, duration: .4, ease: 'back.out(2)' }, t);
  if (!quiet) { rv.liar ? sfx.lose() : sfx.win(); } else tl.progress(1);
}
function rouletteFx(c, quiet) {
  clearFx(); const sh = c.shot, fx = $('#fx'), dim = div('dim'); fx.append(dim);
  const holder = div('', gunSVG(sh.chm)); const gun = holder.firstChild; fx.append(gun);
  const out = div('say', ''); out.style.top = '278px'; out.style.fontSize = '1.5rem'; fx.append(out);
  const flash = div('flash'), vig = div('vig'); fx.append(flash, vig);
  const cyl = $('#cylG'), final = -(sh.chm * 60) - 1440, tl = fxTl = gsap.timeline(); let lastStep = 0;
  gsap.set(cyl, { svgOrigin: '100 100', rotation: 0 });
  const outcome = () => {
    if (sh.died) {
      const bl = $(`#bul${sh.chm}`); if (bl) bl.innerHTML = `<circle cx="${100 + Math.sin(sh.chm * Math.PI / 3) * 54}" cy="${100 - Math.cos(sh.chm * Math.PI / 3) * 54}" r="12" fill="#d79a3a" stroke="#6a4410" stroke-width="2"/>`;
      out.innerHTML = '💥';
      gsap.timeline().fromTo(flash, { opacity: .95 }, { opacity: 0, duration: .5 }).fromTo(vig, { opacity: 1 }, { opacity: .55, duration: 1.2 }, 0)
        .fromTo('#stage', { x: -9, y: 5 }, { x: 9, y: -5, duration: .05, repeat: 9, yoyo: true, ease: 'none', onComplete: () => gsap.set('#stage', { x: 0, y: 0 }) }, 0)
        .fromTo(out, { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: .35, ease: 'back.out(2)' }, 0);
      const seat = $('#seat' + sh.vic); seat?.classList.add('dead'); const skull = seat?.querySelector('.sk'); if (skull) gsap.fromTo(skull, { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: 'back.out(2)' });
    } else {
      out.innerHTML = '😮‍💨';
      gsap.fromTo(out, { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: 'back.out(2.4)' });
      const av = $(`#seat${sh.vic} .av`); if (av) gsap.fromTo(av, { scale: 1.25 }, { scale: 1, duration: .8, ease: 'elastic.out(1,.4)' });
    }
  };
  tl.from(dim, { opacity: 0, duration: .4 }).from(gun, { scale: .3, opacity: 0, rotation: -40, duration: .6, ease: 'back.out(1.7)' }, .1)
    .to(cyl, { rotation: final, duration: 5.1, ease: 'power3.out', onUpdate() { const k = Math.floor(Math.abs(gsap.getProperty(cyl, 'rotation')) / 60); if (k !== lastStep) { lastStep = k; if (!quiet) sfx.tick(); } } }, .5)
    .add(outcome, CLIMAX);

  else tl.progress(1);
}
function redealFx(quiet) { clearFx(); const b = div('ban', '🃏'); $('#fx').append(b); fxTl = gsap.timeline().from(b, { scale: .3, opacity: 0, duration: .45, ease: 'back.out(2)' }); if (!quiet) sfx.turn(); }
function doneFx(c, quiet) {
  clearFx(); const w = c.win, mine = w === me; if (!quiet) (mine ? sfx.win() : sfx.lose());
  showOverlay({ icon: '🏆', title: nmY(w), sub: '', confetti: true });
}
const EVT = { afk: i => `${nmY(i)} أُقصي لتأخره المتكرر`, gone: i => `${nmY(i)} غادر اللعبة`, noshow: i => `${nmY(i)} لم يدخل الطاولة` };
function dispatchFx(p, c) {
  const first = !p;
  if (first) {                                            // أول لقطة (دخول أو إعادة تحميل): نعرض الحالة الحالية دون حركات
    renderPile(false);
    if (c.ph === 'challenge') challengeFx(c, true); else if (c.ph === 'reveal') revealFx(c, true);
    else if (c.ph === 'roulette') rouletteFx(c, true); else if (c.ph === 'redeal') redealFx(true); else if (c.ph === 'done') doneFx(c, true);
    return;
  }
  if (c.ph === 'deal' && (p.ph !== 'deal' || c.rnd !== p.rnd)) dealFx(c, false);
  if (c.last && (!p.last || p.last.pid !== c.last.pid) && c.pile?.length) throwFx(c, false);
  if (c.ph === 'turn' && (p.ph !== 'turn' || c.turn !== p.turn || (c.last?.pid !== p.last?.pid))) { if (p.ph !== 'challenge') turnFx(c); }
  if (c.ph === 'challenge' && p.ph !== 'challenge') challengeFx(c, false);
  if (c.ph === 'reveal' && p.ph !== 'reveal') revealFx(c, false);
  if (c.ph === 'roulette' && p.ph !== 'roulette') rouletteFx(c, false);
  if (c.ph === 'redeal' && p.ph !== 'redeal') redealFx(false);
  if (c.ph === 'done' && p.ph !== 'done') doneFx(c, false);
  if (c.ev && c.ev.n !== (p.ev?.n || 0) && EVT[c.ev.t]) toast(EVT[c.ev.t](c.ev.i), 'info');
}

// ===== المؤقت والمعلومات =====
function startTimer() {
  const key = st.seq + ':' + st.ph; if (key === timerKey) return; timerKey = key; stopT?.();
  const tbi = $('#tbi'), ct = $('#cTime');
  if (st.ph !== 'turn') { ct.hidden = true; tbi.style.transform = 'scaleX(0)'; return; }
  ct.hidden = false; const tot = TURN_S * 1000;
  stopT = countdown(st.endAt, (l, s) => { ct.textContent = '⏱ ' + s; ct.classList.toggle('warn', s <= 10); tbi.style.transform = `scaleX(${Math.min(1, l / tot)})`; tbi.style.background = s <= 10 ? 'var(--rose)' : 'var(--lagoon)'; if (s <= 5 && s > 0 && me === st.turn && l % 1000 < 110) sfx.tick(); }, () => {});
}
function renderInfo() {
  $('#cRound').innerHTML = `الجولة <b>${st.rnd || 0}</b>`;
  $('#cTarget').innerHTML = st.rnd ? `${cardFace(st.tg)}<span>${CNAME[st.tg]}</span>` : '<span>—</span>';
  $('#cAlive').innerHTML = `👥 <b>${aliveIdx(st.al).length}</b>/${st.order.length}`;
}

// ===== شاشة الدخول إلى الطاولة =====
function showRules() {
  const o = div('ovl'), c = div('ovl-card glass rules');
  c.innerHTML = `<div class="ovl-t">كيف تُلعب؟</div><ol>
    <li>لكل لاعب <b>5 أوراق</b> (آص، ملك، ملكة، وجوكر). في كل جولة تُحدَّد <b>ورقة مطلوبة</b>.</li>
    <li>في دورك <b>أنزِل 1 إلى 3 أوراق مقلوبة</b> مدّعياً أنها الورقة المطلوبة. الجوكر يصلح لأي ورقة.</li>
    <li>اللاعب التالي إمّا يكمل بتصديقك، أو يصرخ <b>«كذّاب!»</b> فتُكشف أوراقك.</li>
    <li>إن كنتَ كاذباً <b>تسحب أنت الزناد</b>، وإن كنتَ صادقاً يسحبه من اتهمك ظلماً.</li>
    <li>المسدس <b>6 خانات وطلقة واحدة</b>: كل سحبة تنجو منها تقرّب الطلقة.</li>
    <li>آخر لاعب حيّ يفوز. وإن نفدت أوراق الجميع تُوزَّع من جديد.</li>
    <li>لكل دور <b>${TURN_S} ثانية</b>؛ التأخر مرتين متتاليتين يُخرجك من اللعبة.</li></ol>
    <div class="ovl-row"><button class="btn primary" id="rOk">فهمت</button></div>`;
  o.append(c); document.body.append(o);
  const close = () => { gsap.to(o, { opacity: 0, duration: .18, onComplete: () => o.remove() }); };
  gsap.fromTo(o, { opacity: 0 }, { opacity: 1, duration: .2 }); gsap.fromTo(c, { scale: .75, y: 30, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: .45, ease: 'back.out(2)' });
  c.querySelector('#rOk').onclick = close; o.onclick = e => { if (e.target === o) close(); };
}
function buildEnter() {
  enterBuilt = true; const e = $('#enter');
  e.innerHTML = `<div class="ecard">${LOGO}<h1>LIAR<em>'</em>S BAR</h1><div class="plist" id="plist"></div>
    <div class="sm2" id="eMsg"></div><button class="btn primary" id="eBtn">ادخل الطاولة 🔫</button><button class="btn ghost" id="eForce" hidden>ابدأ بمن دخلوا</button><button class="btn ghost" id="eRules">كيف تُلعب؟</button></div>`;
  $('#eRules').onclick = () => { sfx.click(); showRules(); };
  $('#eBtn').onclick = onEnter; $('#eForce').onclick = forceStart;
  if (!reduce) { gsap.from('.ecard > *', { y: 24, opacity: 0, duration: .6, stagger: .08, ease: 'power3.out' }); gsap.to('.ecard .logo', { rotation: 360, duration: 24, repeat: -1, ease: 'none' }); }
}
async function onEnter() {
  const b = $('#eBtn'); if (b.disabled) return; b.disabled = true; b.textContent = '⏳';
  await unlockAudio(); sfx.click(); await imReady();
}
const forceStart = () => act(c => c.ph === 'ready' ? aliveIdx(c.al).filter(i => !c.rd[i]).reduce((s, i) => forfeitTx(s, i, 'noshow'), c) : undefined);
function renderEnter() {
  const e = $('#enter'); if (!enterBuilt) buildEnter();
  if (st && st.ph !== 'ready') { if (!e.hidden && !e._closing) { e._closing = true; gsap.to(e, { opacity: 0, duration: .5, onComplete: () => { e.hidden = true; } }); } return; }
  e.hidden = false; e._closing = false; gsap.set(e, { opacity: 1 });
  const b = $('#eBtn'), msg = $('#eMsg');
  if (!st) { b.hidden = true; msg.textContent = '⏳'; $('#plist').replaceChildren(); return; }
  me = st.order.indexOf(ctx.uid);
  $('#plist').replaceChildren(...st.order.map((u, i) => { const c = div('pchip' + (st.rd[i] ? ' ok' : ''), `<i></i><span>${players[u]?.name || 'لاعب'}</span>`); c.style.setProperty('--pc', PCOL[i % 4]); return c; }));
  const ready = aliveIdx(st.al).filter(i => st.rd[i]).length, total = aliveIdx(st.al).length;
  if (st.rd[me]) { b.hidden = true; msg.textContent = `${ready}/${total}`; } else { b.hidden = false; b.disabled = false; b.textContent = 'ادخل الطاولة 🔫'; msg.textContent = ''; }
  $('#eForce').hidden = !(ctx.isHost && ready >= 2 && ready < total && Date.now() - enterAt > 20000);
}

// ===== العرض الرئيسي =====
function render() {
  if (!st) { renderEnter(); return; }
  me = st.order.indexOf(ctx.uid);
  if (me < 0) { toast('لست ضمن هذه اللعبة', 'error'); abortGame(ctx); return; }
  if (seatSig !== st.order.join()) buildSeats();
  const p = prev; prev = st;
  updateSeats(); renderInfo(); startTimer(); if (st.ph === 'ready' && me >= 0 && !st.rd[me]) imReady();
  if (!p || p.seq !== st.seq) dispatchFx(p, st);
  if ((st.pile || []).length < pileN) renderPile(false);
  if (!canAct() && sel.size) { sel.clear(); renderHand(false); }
  reconcileHand(); updateControls();
}

// ===== المضيف: هو الموزّع والحكَم (يعرف الأوراق والرصاصات السرّية) =====
let hostRunning = false, hostT = null, tries = {}, finishing = false;
async function ensureBullets(s) { for (const u of s.order) if (bullets[u] == null) { bullets[u] = rnd(6); await set(roomRef(ctx.code, `secret/b/${u}`), bullets[u]); } }
async function applyHost(s, r) {
  if (r.pre?.pl) await Promise.all(Object.entries(r.pre.pl).map(([u, v]) => set(roomRef(ctx.code, `hands/${u}/pl/${v.pid}`), v.c)));
  const res = await act(c => (c.seq === s.seq ? r.state : undefined));
  if (res?.committed) {
    if (r.post?.deal) await Promise.all(Object.entries(r.post.deal).map(([u, h]) => set(roomRef(ctx.code, 'hands/' + u), { h })));
    if (r.post?.h) await Promise.all(Object.entries(r.post.h).map(([u, h]) => set(roomRef(ctx.code, `hands/${u}/h`), h)));
  }
}
async function hostFinish(s) {
  if (finishing) return; finishing = true;
  try {
    const present = Object.keys(players), rank = [s.order[s.win], ...[...(s.out || [])].reverse().map(i => s.order[i])];
    const ranking = rank.filter((u, i) => present.includes(u) && rank.indexOf(u) === i);
    await remove(roomRef(ctx.code, 'hands')).catch(() => {}); await remove(roomRef(ctx.code, 'secret')).catch(() => {});
    await finishGame(ctx, makeResult('win', ranking.length ? ranking : [ctx.uid], { rounds: s.rnd, ev: Object.fromEntries(s.order.map((u, i) => [u, s.xs?.[i] || {}])) }), players);
  } catch (e) { console.error(e); finishing = false; }
}
async function hostTick() {
  if (!ctx.isHost || !st || hostRunning) return; hostRunning = true; const s = st;
  try {
    if (s.ph === 'done') { if (serverNow() >= (s.endAt || 0)) await hostFinish(s); }
    else {
      const now = serverNow(), cache = {};
      await Promise.all(needs(s, now).map(async u => { cache[u] = (await get(roomRef(ctx.code, 'hands/' + u))).val() || {}; }));
      await ensureBullets(s);
      const r = step(s, { hand: u => cache[u]?.h, pl: (u, pid) => cache[u]?.pl?.[pid], bullet: u => bullets[u] }, now);
      if (r) { const k = s.seq + ':' + s.ph; tries[k] = (tries[k] || 0) + 1; if (tries[k] <= 6) await applyHost(s, r); }
    }
  } catch (e) { console.error(e); }
  hostRunning = false; hostSchedule();
}
function hostSchedule() {
  clearTimeout(hostT); if (!ctx.isHost || !st) return;
  const wait = st.ph === 'ready' || !st.endAt ? 1200 : Math.min(Math.max(150, st.endAt - serverNow() + 60), 3000);
  hostT = setTimeout(hostTick, wait);
}

// ===== التشغيل =====
(async function main() {
  try { ctx = await enterRoom(); } catch (e) { toast(e.message, 'error'); setTimeout(() => goLobby(''), 1800); return; }
  players = ctx.players;
  const n = Object.keys(players).length;
  if (n < 2 || n > 4) { toast('اللعبة تتسع لـ 2 إلى 4 لاعبين', 'error'); abortGame(ctx); return; }
  fit(); new ResizeObserver(() => { fit(); if (myHand.length) renderHand(false); }).observe($('#scene')); addEventListener('resize', fit);
  $('#bSnd').textContent = isMuted() ? '🔇' : '🔊';
  $('#bSnd').onclick = () => { const m = toggleMute(); $('#bSnd').textContent = m ? '🔇' : '🔊'; if (m) stopSnd(); };
  $('#bHelp').onclick = () => { sfx.click(); showRules(); };
  $('#bPlay').onclick = () => { sfx.click(); doPlay(); }; $('#bLiar').onclick = () => { sfx.click(); doLiar(); };
  buildEnter(); unlockAudio();

  if (ctx.isHost) {                                       // المضيف يُهيّئ الطاولة والرصاصات السرّية (ولا يمسحها عند إعادة التحميل)
    try {
      const cur = (await get(gs())).val();
      if (cur) bullets = (await get(roomRef(ctx.code, 'secret/b'))).val() || {};
      else {
        await remove(roomRef(ctx.code, 'hands')); await remove(roomRef(ctx.code, 'secret'));
        const order = Object.entries(players).sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0)).map(e => e[0]);
        bullets = Object.fromEntries(order.map(u => [u, rnd(6)]));
        await set(roomRef(ctx.code, 'secret/b'), bullets);
        await runTransaction(gs(), c => c || newState(order));
      }
    } catch (e) {
      console.error(e);
      const denied = /permission|denied/i.test(String(e?.code || e?.message || e));
      showOverlay({ icon: denied ? '🔐' : '⚠️', title: denied ? 'قواعد Firebase تحتاج تحديثاً' : 'تعذّر تجهيز الطاولة',
        sub: denied ? 'افتح Firebase ← Realtime Database ← Rules، والصق محتوى ملف firebase.rules.json الجديد، ثم اضغط Publish وأعد المحاولة.' : 'تحقق من الاتصال وأعد المحاولة بعد لحظات.' });
      setTimeout(() => backToLobby(ctx), 10000); return;
    }
  }

  ex = initGroupExit(ctx, {
    isOver: () => st?.ph === 'done',
    onGone: uid => { if (!ctx.isHost) return; act(c => { const i = c.order.indexOf(uid); return i >= 0 && c.al[i] && c.ph !== 'done' ? forfeitTx(c, i, 'gone') : undefined; }); },
    onHostGone: () => { stopSnd(); },
    onLeave: () => { stopSnd(); }
  });
  onValue(roomRef(ctx.code, `hands/${ctx.uid}`), s => {
    const v = s.val() || {}; myPl = v.pl || {}; const h = Array.isArray(v.h) ? v.h : [], sig = h.join('');
    if (sig !== handSig || !handSig) { const newDeal = st?.ph === 'deal' && Date.now() - dealAt < 6000 && sig !== handSig; handSig = sig; myHand = h; renderHand(newDeal); }
    reconcileHand();
  }, () => {});
  onValue(gs(), s => { st = s.val(); render(); if (ctx.isHost) hostTick(); });
  watchRoom(ctx.code, {
    meta: m => { if ((!m || m.status !== 'playing') && !ex.busy()) goLobby(ctx.code); },
    players: p => { players = p || players; scoreBar($('#sb'), players, scores, ctx.uid); if (st) { updateSeats(); renderEnter(); } },
    scores: s => { scores = s || {}; scoreBar($('#sb'), players, scores, ctx.uid); }
  });
  setInterval(() => { if (ctx.isHost) hostTick(); }, 2000);   // احتياط: لا نعتمد على الأحداث وحدها
  setInterval(() => { if (!st || st.ph !== 'ready') return; if (me >= 0 && !st.rd[me]) imReady(); if (ctx.isHost && Date.now() - enterAt > 8000) { const al = aliveIdx(st.al), r = al.filter(i => st.rd[i]).length; if (r >= 2 && r < al.length) forceStart(); } }, 700);   // يظهر زر «ابدأ بمن دخلوا» بعد 20 ثانية دون أي حدث جديد
})();
