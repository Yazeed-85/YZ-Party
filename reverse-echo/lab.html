<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>مختبر الصوت العكسي</title>
<style>
body{margin:0;background:#0b0e1a;color:#eceef8;font-family:'Cairo',system-ui,sans-serif;padding:20px;max-width:520px;margin-inline:auto}
h1{font-size:1.3rem}p{color:#b6bbd0;line-height:1.8;font-size:.92rem}
button{display:block;width:100%;margin:10px 0;padding:15px;border:0;border-radius:16px;font:700 1rem inherit;background:#232844;color:#fff}
button.rec{background:#ff4d5e}button.go{background:#4fd1c5;color:#06231f}button:disabled{opacity:.4}
#st{min-height:1.6em;color:#ffb454}
</style>
</head>
<body>
<h1>🔬 مختبر الصوت العكسي</h1>
<p>سجّل جملة (مثل «الطقس بارد»)، ثم استمع لها بالطرق الأربع وأخبرني أيها الأوضح. لا يُرسَل شيء لأي مكان.</p>
<button id="rec" class="go">🎙 ابدأ التسجيل</button>
<div id="st"></div>
<button id="v0" disabled>▶ 1) الأصلي (غير معكوس)</button>
<button id="v1" disabled>⏪ 2) معكوس خام (عكس مباشر)</button>
<button id="v2" disabled>⏪ 3) معكوس معادَل الشدة (هو ما في اللعبة الآن)</button>
<button id="v3" disabled>⏪ 4) معكوس معادَل بقوة أعلى</button>
<script type="module">
import { SR_HI, prepare, resample, enhance } from './audio.js';
const $ = s => document.querySelector(s), st = m => ($('#st').textContent = m);
let ac, stream, node, chunks = [], total = 0, rec = false, clip = null;
const WORKLET = `class C extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor('lab',C)`;
async function start() {
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
  ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume(); chunks = []; total = 0;
  const src = ac.createMediaStreamSource(stream);
  await ac.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' })));
  node = new AudioWorkletNode(ac, 'lab', { numberOfOutputs: 0 }); node.port.onmessage = e => { chunks.push(e.data); total += e.data.length; }; src.connect(node); rec = true;
}
async function stop() {
  await new Promise(r => setTimeout(r, 500)); rec = false; node.disconnect(); stream.getTracks().forEach(t => t.stop());
  const raw = new Float32Array(total); let o = 0; for (const c of chunks) { raw.set(c, o); o += c.length; }
  const sr = ac.sampleRate; await ac.close();
  clip = prepare(raw, sr); ['v0', 'v1', 'v2', 'v3'].forEach(i => ($('#' + i).disabled = false)); st(`جاهز: ${(clip.length / SR_HI).toFixed(1)} ثانية`);
}
$('#rec').onclick = async () => {
  const b = $('#rec');
  try { if (!rec) { await start(); b.textContent = '⏹ أوقف التسجيل'; b.className = 'rec'; st('يُسجَّل…'); } else { b.disabled = true; await stop(); b.disabled = false; b.textContent = '🎙 سجّل من جديد'; b.className = 'go'; } }
  catch (e) { st('تعذّر المايك: ' + (e.name || e)); b.disabled = false; }
};
let pc, src;
function play(x, reversed) {
  try { src?.stop(); } catch {}
  pc ??= new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' }); pc.resume();
  const f0 = reversed ? Float32Array.from(x).reverse() : x, f = resample(f0, SR_HI, pc.sampleRate), b = pc.createBuffer(1, f.length, pc.sampleRate);
  b.copyToChannel(f, 0); src = pc.createBufferSource(); src.buffer = b; src.connect(pc.destination); src.start();
}
$('#v0').onclick = () => play(clip, false);
$('#v1').onclick = () => play(clip, true);
$('#v2').onclick = () => play(enhance(clip, 1), true);
$('#v3').onclick = () => play(enhance(clip, 1.6), true);
</script>
</body>
</html>
