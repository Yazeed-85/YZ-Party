# يولّد games/truth-lie/images/list.json تلقائياً كلما أضفت أو حذفت ملفات في المجلد
# يدعم المجسمات (glb, gltf) والصور، وإذا وُجد مجسم وصورة بنفس الاسم يُفضَّل المجسم
name: Build images list
on:
  push:
    paths: ['games/truth-lie/images/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate list.json
        run: |
          node -e "
          const fs=require('fs');const d='games/truth-lie/images';
          const all=fs.readdirSync(d);const base=n=>n.replace(/\.[^.]+$/,'');
          const models=all.filter(n=>/\.(glb|gltf)$/i.test(n));
          const mb=new Set(models.map(base));
          const imgs=all.filter(n=>/\.(png|jpe?g|gif|webp|avif|svg)$/i.test(n)&&!mb.has(base(n)));
          fs.writeFileSync(d+'/list.json',JSON.stringify([...models,...imgs].sort(),null,1)+'\n');"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/truth-lie/images/list.json
          git diff --cached --quiet || (git commit -m "update images list" && git push)
